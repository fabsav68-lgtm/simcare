<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PraxisTACA · Stage · Outil pédagogique IFSI</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
.btn-audio{position:fixed;bottom:16px;right:16px;background:#58a6ff;color:#0a0d0f;padding:10px 18px;border-radius:24px;font-size:13px;font-weight:700;cursor:pointer;z-index:1000;box-shadow:0 4px 16px rgba(0,0,0,.4);}
  <style>
:root{
  --bg:    #0d1117;
  --bg2:   #161b22;
  --card:  rgba(255,255,255,.03);
  --bdr:   rgba(255,255,255,.08);
  --txt:   #e6edf3;
  --txt2:  #7d8590;
  --txt3:  #8e96a0;
  --s1: #58a6ff;
  --s2: #3fb950;
  --s3: #d29922;
  --s4: #e07060;
  --s5: #a371f7;
  --s6: #f0c040;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'IBM Plex Sans',sans-serif;
  background:var(--bg);
  color:var(--txt);min-height:100vh;padding-bottom:80px;
  overflow-x:hidden;position:relative;
}
/* Fond terrain — motif hexagonal subtil */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle at 25% 25%, rgba(63,185,80,.04) 0%,transparent 50%),
    radial-gradient(circle at 75% 75%, rgba(88,166,255,.04) 0%,transparent 50%);
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    repeating-linear-gradient(60deg, rgba(255,255,255,.015) 0px, rgba(255,255,255,.015) 1px, transparent 1px, transparent 30px),
    repeating-linear-gradient(-60deg, rgba(255,255,255,.015) 0px, rgba(255,255,255,.015) 1px, transparent 1px, transparent 30px);
}

.wrap{max-width:720px;margin:0 auto;padding:0 20px;position:relative;z-index:1}

/* ── HEADER ── */
.site-header{padding:40px 24px 28px;text-align:center;position:relative;z-index:1}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.22);
  color:var(--s2);padding:5px 16px;border-radius:4px;
  font-family:'IBM Plex Mono',monospace;font-size:11px;
  letter-spacing:2px;text-transform:uppercase;margin-bottom:16px;
}
.site-header h1{
  font-family:'Lora',serif;
  font-size:clamp(26px,5vw,42px);font-weight:600;
  font-style:italic;line-height:1.15;letter-spacing:-.5px;margin-bottom:8px;
}
.site-header h1 em{font-style:normal;color:var(--s2)}
.site-header p{color:var(--txt2);font-size:13px;line-height:1.6}

/* ── CRESCENDO ── */
.crescendo{
  display:flex;align-items:flex-end;justify-content:center;
  gap:6px;padding:24px 0 8px;height:80px;
}
.cres-bar{
  display:flex;flex-direction:column;align-items:center;
  gap:6px;cursor:pointer;transition:all .2s;
  -webkit-tap-highlight-color:transparent;
}
.cres-bar-inner{
  width:38px;border-radius:4px 4px 0 0;
  transition:all .25s cubic-bezier(.34,1.56,.64,1);opacity:.3;
}
.cres-bar.active .cres-bar-inner{opacity:1;box-shadow:0 0 16px currentColor}
.cres-bar:hover .cres-bar-inner{opacity:.7}
.cres-lbl{
  font-family:'IBM Plex Mono',monospace;font-size:10px;
  color:var(--txt2);letter-spacing:1px;transition:color .2s;
}
.cres-bar.active .cres-lbl{font-weight:600}

/* ── SEM INFO ── */
.sem-info{
  display:flex;align-items:center;gap:14px;
  background:var(--card);border:1.5px solid var(--bdr);
  border-radius:12px;padding:16px 20px;margin-bottom:20px;
  position:relative;z-index:1;transition:border-color .3s;
}
.sem-badge{width:52px;height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.sem-name{font-family:'Lora',serif;font-size:17px;font-weight:500;font-style:italic}
.sem-posture{font-size:12px;color:var(--txt2);margin-top:2px;font-family:'IBM Plex Mono',monospace;letter-spacing:1px}
.sem-heures{margin-left:auto;text-align:right;font-family:'IBM Plex Mono',monospace}
.sem-heures-v{font-size:26px;font-weight:500;display:block;line-height:1}
.sem-heures-l{font-size:10px;color:var(--txt2);letter-spacing:1.5px;text-transform:uppercase}

/* ── ONGLETS ── */
.tabs{display:flex;gap:4px;padding:0 0 20px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap}
.tab{
  padding:8px 14px;border-radius:6px;
  border:1.5px solid var(--bdr);background:rgba(255,255,255,.02);
  color:var(--txt2);font-size:13px;font-weight:500;cursor:pointer;
  white-space:nowrap;transition:all .18s;font-family:'IBM Plex Sans',sans-serif;
  -webkit-tap-highlight-color:transparent;
}
.tab:hover{color:var(--txt);background:rgba(255,255,255,.04)}

/* ── CARD ── */
.card{background:var(--card);border:1.5px solid var(--bdr);border-radius:12px;padding:22px;margin-bottom:14px;position:relative;z-index:1}
.card-title{font-family:'Lora',serif;font-size:18px;font-weight:500;font-style:italic;margin-bottom:4px}
.card-sub{color:var(--txt2);font-size:13px;margin-bottom:18px;line-height:1.65}

/* ── JOURNAL RÉFLEXIF ── */
.gibbs-step{
  border-radius:10px;padding:16px;margin-bottom:10px;
  border-left:3px solid transparent;position:relative;
}
.gibbs-num{
  font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;
  opacity:.7;
}
.gibbs-titre{font-family:'Lora',serif;font-size:16px;font-weight:500;font-style:italic;margin-bottom:8px}
.gibbs-question{font-size:12px;color:var(--txt2);font-style:italic;margin-bottom:8px;line-height:1.6}
.gibbs-area{
  width:100%;border-radius:8px;padding:10px 12px;
  background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.07);
  color:var(--txt);font-size:13px;font-family:'IBM Plex Sans',sans-serif;
  outline:none;resize:vertical;min-height:60px;line-height:1.65;
  transition:border-color .2s;
}
.gibbs-area:focus{border-color:rgba(255,255,255,.2)}

/* ── PROGRESS ── */
.progress-bar-wrap{background:rgba(255,255,255,.06);border-radius:100px;height:8px;overflow:hidden;margin:6px 0}
.progress-bar{height:100%;border-radius:100px;transition:width .6s cubic-bezier(.34,1.2,.64,1)}

/* ── SITUATIONS ── */
.sit-card{
  background:rgba(0,0,0,.2);border-radius:10px;padding:14px;
  margin-bottom:8px;border-left:3px solid transparent;cursor:pointer;
  transition:all .18s;
}
.sit-card:hover{background:rgba(0,0,0,.3)}
.sit-titre{font-family:'Lora',serif;font-size:15px;font-weight:500;font-style:italic;margin-bottom:4px}
.sit-body{font-size:12px;color:var(--txt2);line-height:1.65;display:none;margin-top:8px}
.sit-card.open .sit-body{display:block}
.sit-tag{
  display:inline-block;padding:2px 8px;border-radius:4px;
  font-family:'IBM Plex Mono',monospace;font-size:9px;
  letter-spacing:1px;text-transform:uppercase;margin-top:6px;
}

/* ── ENTRETIEN ── */
.entretien-section{margin-bottom:16px}
.ent-titre{
  font-family:'IBM Plex Mono',monospace;font-size:11px;
  letter-spacing:2px;text-transform:uppercase;color:var(--txt2);margin-bottom:8px;
}
.ent-item{
  display:flex;gap:10px;align-items:flex-start;
  padding:10px 12px;border-radius:8px;margin-bottom:6px;
  background:rgba(255,255,255,.025);border:1px solid var(--bdr);
  cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;
}
.ent-item:hover{background:rgba(255,255,255,.04)}
.ent-check{
  width:18px;height:18px;border-radius:3px;border:1.5px solid var(--bdr);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  margin-top:1px;transition:all .15s;font-size:11px;
}
.ent-item.done .ent-check{background:var(--em-c,var(--s2));border-color:transparent;color:#0d1117}
.ent-txt{font-size:13px;color:var(--txt2);line-height:1.6}
.ent-item.done .ent-txt{text-decoration:line-through;color:var(--txt3)}

/* ── BOUTONS ── */
.btn-p{border:none;border-radius:8px;color:#0d1117;font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;padding:12px 24px;cursor:pointer;transition:opacity .2s,transform .1s}
.btn-p:hover{opacity:.9;transform:translateY(-1px)}
.btn-g{background:rgba(255,255,255,.04);border:1.5px solid var(--bdr);border-radius:8px;color:var(--txt2);font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:10px 18px;cursor:pointer;transition:all .18s}
.btn-g:hover{background:rgba(255,255,255,.07);color:var(--txt)}
.btn-full{width:100%}
.nav-row{display:flex;gap:10px}
.nav-row>*{flex:1}
.col8{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── INFO ── */
.info{border-radius:8px;padding:11px 14px;font-size:13px;line-height:1.75;margin-bottom:12px}
.info-blue {background:rgba(88,166,255,.07); border-left:3px solid rgba(88,166,255,.5); color:var(--s1)}
.info-green{background:rgba(63,185,80,.07);  border-left:3px solid rgba(63,185,80,.5);  color:var(--s2)}
.info-gold {background:rgba(210,153,34,.07);  border-left:3px solid rgba(210,153,34,.5);  color:var(--s3)}
.info-coral{background:rgba(224,112,96,.07);  border-left:3px solid rgba(224,112,96,.5);  color:var(--s4)}
.info-lav  {background:rgba(163,113,247,.07); border-left:3px solid rgba(163,113,247,.5); color:var(--s5)}
.info-sun  {background:rgba(240,192,64,.07);  border-left:3px solid rgba(240,192,64,.5);  color:var(--s6)}

/* ── LOADING ── */
.dots{text-align:center;padding:24px 0}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 3px;animation:dotB 1.4s ease-in-out infinite both}
.dots span:nth-child(2){animation-delay:.16s}
.dots span:nth-child(3){animation-delay:.32s}
.dots-msg{font-size:13px;margin-top:10px;font-style:italic;color:var(--txt2)}
.analysis p{margin-bottom:14px;font-size:15px;line-height:1.85;color:#8090a0}
.analysis strong{color:var(--txt)}

/* ── PREMIUM ── */
.premium-box{background:rgba(0,0,0,.3);border:1.5px solid rgba(63,185,80,.15);border-radius:12px;padding:24px;margin-bottom:14px}
.apikey-box{background:rgba(63,185,80,.04);border:1px solid rgba(63,185,80,.12);border-radius:8px;padding:12px}
.apikey-box p{font-size:13px;color:var(--txt2);margin-bottom:10px;line-height:1.6}
.apikey-box a{color:var(--s2)}
.apikey-row{display:flex;gap:8px}
.apikey-row input{flex:1;padding:9px 12px;font-size:12px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);border-radius:6px;color:var(--txt);font-family:'IBM Plex Mono',monospace;outline:none}
.apikey-row input:focus{border-color:rgba(63,185,80,.3)}
.apikey-row button{padding:9px 14px;border:none;border-radius:6px;color:#0d1117;font-weight:700;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:12px}
.apikey-saved{color:var(--s2);font-size:11px;margin-top:5px;font-family:'IBM Plex Mono',monospace}

hr.div{border:none;border-top:1px solid rgba(255,255,255,.06);margin:16px 0}

/* ── WELCOME ── */
.pts{display:flex;flex-direction:column;gap:10px;margin:18px 0;text-align:left}
.pt{display:flex;gap:12px;align-items:flex-start}
.pt-i{font-size:18px;flex-shrink:0;margin-top:2px}
.pt-t{font-size:14px;color:var(--txt2);line-height:1.65}
.pt-t strong{color:var(--txt)}

/* ── STAT ── */
.stat{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.05);border-radius:10px;padding:12px;text-align:center}
.stat-v{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:500;display:block}
.stat-l{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:1.5px;font-family:'IBM Plex Mono',monospace;display:block;margin-top:4px}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes dotB{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
.fadeup{animation:fadeUp .35s ease forwards}
@media(max-width:480px){.grid2{grid-template-columns:1fr}.nav-row{flex-direction:column}}
</style>
</head>
<body>
<div id="app"></div>
<button class="btn-audio" id="btn-audio" onclick="lireOnglet()">🔊 Écouter</button>
<script>

// ═══════════════════════════════════════
//  DONNÉES — CRESCENDO EN STAGE
// ═══════════════════════════════════════
const SEMESTRES = [
  {
    id:1, label:'S1', couleur:'#58a6ff', hauteur:20,
    posture:'👁️ Observation guidée', titre:'Je regarde et je note',
    hSemaine:5, nbSemaines:8,
    question_reflexive:'Qu\'ai-je observé aujourd\'hui ?',
    message:'En S1, tu observes. Tout est nouveau — les gestes, les relations, les espaces. Tes 5h/semaine de TACA en stage sont un espace protégé pour poser tes observations, pas encore pour juger.',
    infoClass:'info-blue',
    gibbs_focus:[0,1], // Description + Sentiments uniquement
    situations:[
      {titre:'Ma première prise en charge', q:'Décris le premier soin auquel tu as assisté. Qu\'as-tu ressenti ? Qu\'as-tu observé du rôle IDE ?', niveaux:['Je décris ce que j\'ai vu','Je note mes émotions','Je pose des questions à mon tuteur']},
      {titre:'La relation soignant-soigné', q:'Observe une interaction entre un IDE et un patient. Qu\'est-ce qui t\'a frappé dans la communication ? Le verbal, le non-verbal ?', niveaux:['J\'observe sans intervenir','Je note les attitudes soignantes','Je repère ce que je veux reproduire']},
      {titre:'L\'organisation du service', q:'Comment s\'organise une journée de travail IDE dans ce service ? Quelles sont les priorités ?', niveaux:['Je cartographie l\'organisation','Je comprends les transmissions','Je repère les moments clés']},
    ],
    entretien:{
      mi_stage:[
        'Présenter mes premières observations sur le service',
        'Identifier 2 situations qui m\'ont marqué(e)',
        'Exprimer mes difficultés sans honte',
        'Demander des précisions sur ce que je n\'ai pas compris',
        'Fixer un objectif concret pour la 2ème moitié de stage',
      ],
      fin_stage:[
        'Présenter mon bilan d\'observations du semestre',
        'Identifier mes apprentissages principaux',
        'Reconnaître mes zones d\'inconfort — et c\'est normal en S1',
        'Remercier l\'équipe et le tuteur pour l\'accueil',
        'Identifier ce que je veux approfondir en TACA Théorie',
      ],
    },
  },
  {
    id:2, label:'S2', couleur:'#3fb950', hauteur:32,
    posture:'🤲 Participation assistée', titre:'Je commence à faire',
    hSemaine:5, nbSemaines:8,
    question_reflexive:'Qu\'ai-je fait, et avec quelle aide ?',
    message:'En S2, tu passes de l\'observation à l\'action — avec un filet de sécurité. Chaque geste réalisé devient matière à réflexion. Tu commences à comprendre pourquoi on fait les choses, pas seulement comment.',
    infoClass:'info-green',
    gibbs_focus:[0,1,2],
    situations:[
      {titre:'Mon premier soin technique réalisé', q:'Quel soin as-tu réalisé pour la première fois ? Comment te préparais-tu ? Comment tu t\'es senti(e) après ?', niveaux:['Je décris le soin étape par étape','J\'identifie ce qui a bien marché','Je note ce que j\'aurais fait différemment']},
      {titre:'Un moment d\'incertitude', q:'Décris un moment où tu n\'as pas su quoi faire. Comment l\'as-tu géré ? Qu\'as-tu appris de cette incertitude ?', niveaux:['Je décris la situation sans me juger','J\'identifie ce qui m\'a manqué','Je cherche les ressources pour combler ce manque']},
      {titre:'La relation avec mon tuteur', q:'Comment se passe ta relation avec ton tuteur de stage ? Qu\'apprends-tu de lui/elle en dehors des soins techniques ?', niveaux:['Je décris notre collaboration','Je repère son style d\'encadrement','Je tire parti de ses retours, positifs et négatifs']},
    ],
    entretien:{
      mi_stage:[
        'Présenter les soins réalisés et le niveau d\'autonomie atteint',
        'Identifier 1 situation difficile et comment je l\'ai gérée',
        'Demander un feedback précis sur ma posture professionnelle',
        'Exprimer ce dont j\'ai besoin pour progresser',
        'Fixer 2 objectifs de soins pour la 2ème moitié',
      ],
      fin_stage:[
        'Évaluer ma progression entre le début et la fin de stage',
        'Identifier les compétences acquises et celles en cours',
        'Présenter une situation clinique analysée avec le cycle de Gibbs',
        'Nommer les valeurs soignantes que j\'ai observées chez les professionnels',
        'Définir mon prochain objectif de stage',
      ],
    },
  },
  {
    id:3, label:'S3', couleur:'#d29922', hauteur:44,
    posture:'🎯 Participation active', titre:'Je fais et je comprends pourquoi',
    hSemaine:5, nbSemaines:10,
    question_reflexive:'Pourquoi ai-je fait ça ? Qu\'aurais-je pu faire autrement ?',
    message:'En S3, tu n\'exécutes plus — tu raisonnes. Chaque acte est précédé d\'un "pourquoi" et suivi d\'un "qu\'est-ce que ça m\'apprend". Le cycle de Gibbs devient ton outil quotidien.',
    infoClass:'info-gold',
    gibbs_focus:[0,1,2,3],
    situations:[
      {titre:'Une situation complexe gérée seul(e)', q:'Décris une situation où tu as dû prendre une initiative. Qu\'as-tu évalué ? Qu\'as-tu décidé ? Avec quel résultat ?', niveaux:['Je décris mon raisonnement clinique','J\'évalue la qualité de ma décision','Je consulte avec le tuteur sur ma démarche']},
      {titre:'Un patient difficile à aborder', q:'As-tu rencontré un patient en colère, en refus, ou dans une grande détresse ? Comment as-tu adapté ta communication ?', niveaux:['Je décris la situation relationnelle','J\'analyse mes réactions émotionnelles','Je réfléchis à une meilleure approche']},
      {titre:'Collaboration interprofessionnelle', q:'Décris un moment où tu as travaillé avec d\'autres professionnels (médecin, kiné, AS...). Quelle était ta place dans cette équipe ?', niveaux:['Je décris les rôles de chacun','J\'analyse la communication inter-équipe','Je positionne mon rôle IDE dans ce collectif']},
    ],
    entretien:{
      mi_stage:[
        'Présenter une analyse Gibbs d\'une situation vécue',
        'Identifier mon niveau de raisonnement clinique actuel',
        'Discuter d\'une décision que j\'ai prise seul(e)',
        'Nommer mes axes de progression prioritaires',
        'Proposer un objectif de stage autonome',
      ],
      fin_stage:[
        'Présenter le portfolio de 3 situations analysées avec Gibbs',
        'Évaluer mon autonomie dans les soins du service',
        'Identifier les spécificités du service et leur lien avec les UE',
        'Formaliser mon projet professionnel provisoire',
        'Rédiger une synthèse écrite de stage',
      ],
    },
  },
  {
    id:4, label:'S4', couleur:'#e07060', hauteur:56,
    posture:'🧭 Semi-autonome', titre:'Je gère et je transmets',
    hSemaine:5, nbSemaines:10,
    question_reflexive:'Qu\'ai-je appris sur moi en tant que soignant(e) ?',
    message:'En S4, tu prends en charge et tu transmets. Tu es capable d\'assurer une continuité de soins. Ta réflexivité porte sur ton identité professionnelle — pas seulement tes actes.',
    infoClass:'info-coral',
    gibbs_focus:[0,1,2,3,4],
    situations:[
      {titre:'Gestion d\'une situation urgente', q:'Décris une situation d\'urgence ou de dégradation clinique. Qu\'as-tu évalué en premier ? Comment as-tu alerté ? Comment l\'équipe a-t-elle répondu ?', niveaux:['Je décris mon évaluation clinique initiale','J\'analyse ma gestion de la priorité','Je mesure l\'efficacité de ma communication d\'urgence']},
      {titre:'Transmission et passation', q:'Comment prépares-tu tes transmissions ? Qu\'est-ce qu\'une bonne transmission ? Comment t\'es-tu amélioré(e) dans cet exercice ?', niveaux:['Je décris la structure de mes transmissions','J\'identifie les informations essentielles vs secondaires','Je travaille la concision et la précision']},
      {titre:'Accompagnement d\'un étudiant S1 ou S2', q:'As-tu été amené(e) à expliquer un soin ou à accompagner un étudiant junior ? Comment as-tu transmis tes connaissances ?', niveaux:['Je décris ma façon d\'expliquer','J\'analyse ma pédagogie spontanée','Je réfléchis à ce que transmettre signifie pour moi']},
    ],
    entretien:{
      mi_stage:[
        'Présenter une prise en charge complète d\'un patient',
        'Analyser une erreur ou un presque-accident avec Gibbs',
        'Discuter de mes transmissions — points forts et axes de travail',
        'Identifier comment je contribue à l\'équipe',
        'Définir mon projet professionnel de manière plus précise',
      ],
      fin_stage:[
        'Évaluer mon autonomie dans la gestion de plusieurs patients',
        'Présenter une analyse de la culture soignante du service',
        'Identifier les spécialités qui m\'attirent et pourquoi',
        'Documenter 5 compétences consolidées dans mon portfolio',
        'Rédiger une lettre à mon futur moi IDE',
      ],
    },
  },
  {
    id:5, label:'S5', couleur:'#a371f7', hauteur:68,
    posture:'🔍 Autonome réflexif', titre:'Je questionne ma pratique',

const STORE_KEY = 'simtaca_stage';
function loadStore(){ try{return JSON.parse(localStorage.getItem(STORE_KEY))||{};}catch(e){return {};} }
function saveStore(d){ try{localStorage.setItem(STORE_KEY,JSON.stringify(d));}catch(e){} }
let STORE = loadStore();

function getJournal(sem, etape){ return STORE[`j_${sem}_${etape}`]||''; }
function setJournal(sem, etape, v){ STORE[`j_${sem}_${etape}`]=v; saveStore(STORE); }
function getEntDone(sem, type, i){ return (STORE[`ent_${sem}_${type}`]||[]).includes(i); }
function toggleEnt(sem, type, i){
  const arr = STORE[`ent_${sem}_${type}`]||[];
  const idx = arr.indexOf(i);
  if(idx>=0) arr.splice(idx,1); else arr.push(i);
  STORE[`ent_${sem}_${type}`]=arr; saveStore(STORE);
}
function getSitOpen(){ return STORE['sit_open']||null; }
function setSitOpen(v){ STORE['sit_open']=v; saveStore(STORE); }

};

function semObj(){ return SEMESTRES[S.sem-1]; }

// ═══════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function renderMd(text){
  return text.split('\n\n').filter(p=>p.trim()).map(para=>{
    const parts=para.split(/\*\*([^*]+)\*\*/g);
    const inner=parts.map((p,i)=>i%2===1?`<strong>${esc(p)}</strong>`:esc(p)).join('');
    return `<p>${inner}</p>`;
  }).join('');
}

function journalPct(sem){
  const sem_obj = SEMESTRES[sem-1];
  const n = sem_obj.gibbs_focus.length;
  let filled = 0;
  sem_obj.gibbs_focus.forEach(i=>{ if(getJournal(sem,i).trim().length>10) filled++; });
  return n>0 ? Math.round(filled/n*100) : 0;
}

// ═══════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════
var _lecture = false;
function meilleureVoixFr(){
  var voix = speechSynthesis.getVoices().filter(function(v){ return v.lang && v.lang.toLowerCase().indexOf('fr') === 0; });
  if(voix.length === 0) return null;
  var bonsNoms = ['amélie','audrey','thomas','daniel'];
  var meilleure = voix.find(function(v){ return /enhanced|premium|neural/i.test(v.name); });
  if(!meilleure){
    meilleure = voix.find(function(v){ var n=v.name.toLowerCase(); return bonsNoms.some(function(bn){ return n.indexOf(bn)!==-1; }); });
  }
  return meilleure || voix[0];
}
function lireOnglet(){
  if(_lecture){ stopLecture(); return; }
  if(!('speechSynthesis' in window)){ alert('Lecture audio non disponible sur ce navigateur.'); return; }
  var textes = [];
  document.querySelectorAll('#app .card-title, #app .card-sub, #app .info, #app .gibbs-titre, #app .gibbs-question, #app .sit-titre, #app .sit-body, #app .ent-titre, #app .ent-txt, #app .stat-v, #app .stat-l').forEach(function(el){
    var t = el.innerText.trim();
    if(t.length > 2) textes.push(t);
  });
  if(textes.length === 0) return;
  _lecture = true;
  document.getElementById('btn-audio').textContent = '⏹ Stop';
  var voixChoisie = meilleureVoixFr();
  var i = 0;
  function suivante(){
    if(!_lecture || i >= textes.length){ stopLecture(); return; }
    var u = new SpeechSynthesisUtterance(textes[i++]);
    u.lang = 'fr-FR';
    u.rate = 0.9;
    if(voixChoisie) u.voice = voixChoisie;
    u.onend = suivante;
    u.onerror = suivante;
    speechSynthesis.speak(u);
  }
  speechSynthesis.cancel();
  setTimeout(suivante, 50);
}
function stopLecture(){
  _lecture = false;
  if('speechSynthesis' in window) speechSynthesis.cancel();
  var btn = document.getElementById('btn-audio');
  if(btn) btn.textContent = '🔊 Écouter';
}
  function go(v){ stopLecture(); S.view=v; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function setSem(n){ stopLecture(); S.sem=n; S.analyse=''; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function setOnglet(o){ stopLecture(); S.onglet=o; S.analyse=''; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function setJournalAction(etape, val){ setJournal(S.sem, etape, val); }
function toggleSit(i){
  const key = `${S.sem}_${i}`;
  setSitOpen(getSitOpen()===key ? null : key);
  render();
}
  function goJournalAvec(i){ stopLecture(); S.onglet='journal'; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function toggleEntAction(type, i){ toggleEnt(S.sem, type, i); render(); }
function saveKey(){ localStorage.setItem('simtaca_stage_key', S.apiKey); S.apiKeySaved=true; render(); }

// ═══════════════════════════════════════
//  API CLAUDE
// ═══════════════════════════════════════
async function runAnalyse(){
  const q = document.getElementById('question-stage')?.value || '';
  if(!q.trim()) return;
  const sem = semObj();

  // Contexte du journal
  const journalContext = GIBBS
    .filter((g,i)=>sem.gibbs_focus.includes(i)&&getJournal(S.sem,i).trim().length>10)
    .map(g=>`${g.titre}: ${getJournal(S.sem,GIBBS.indexOf(g)).substring(0,200)}`)
    .join('\n');

  S.loading=true; S.analyse=''; render();
  try{
    const headers={'Content-Type':'application/json'};
    if(S.apiKey){headers['x-api-key']=S.apiKey;headers['anthropic-version']='2023-06-01';}
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST', headers,
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514', max_tokens:900,
        messages:[{role:'user', content:`Tu es un formateur IFSI expert en pédagogie réflexive et en accompagnement des étudiants infirmiers en stage. Tu utilises le questionnement socratique — tu poses des questions qui approfondissent la réflexion plutôt que de donner des réponses.

Contexte étudiant :
- Semestre : S${S.sem} — posture "${sem.posture} · ${sem.titre}"
- Question réflexive du semestre : "${sem.question_reflexive}"
- Étapes Gibbs disponibles : ${sem.gibbs_focus.length} sur 6
${journalContext ? '- Extraits du journal :\n' + journalContext : '- Journal non encore rempli'}

Question ou difficulté de l'étudiant : ${q}

Utilise le questionnement socratique : pose 2-3 questions qui approfondissent la réflexion plutôt que de donner des réponses. Adapte ton approche à la posture "${sem.posture}" — un S1 a besoin de guidance, un S5-S6 de questionnement plus exigeant. Tutoie l'étudiant. Si pertinent, cite une étape du cycle de Gibbs qu'il pourrait approfondir. Sois bienveillant mais exigeant. Utilise **gras** pour les termes clés.`}]
      })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error.message);
    S.analyse = data.content?.find(b=>b.type==='text')?.text||'';
  }catch(e){
    S.analyse=`**Erreur**\n\n${e.message}`;
  }
  S.loading=false; render();
}

render();
