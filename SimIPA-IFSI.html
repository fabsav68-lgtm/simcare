<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimIPA · Outil pédagogique IFSI</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Inter:wght@300;400;500;600&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:    #08080e;
  --bg2:   #0f0f18;
  --card:  rgba(255,255,255,.03);
  --bdr:   rgba(255,255,255,.07);
  --txt:   #dde4f0;
  --txt2:  #5868a0;
  --txt3:  #151830;
  --em:    #c8a060;
  --em2:   #a07840;
  --silver:'#8898c0';
  --sil:   #8898c0;
  --m1:    #4090d0; /* Chroniques */
  --m2:    #d05050; /* Oncologie */
  --m3:    #4080a0; /* Néphrologie */
  --m4:    #8050c0; /* Psychiatrie */
  --m5:    #e07030; /* Urgences */
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);color:var(--txt);
  min-height:100vh;padding-bottom:80px;overflow-x:hidden;position:relative;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 60% 50% at 30% 0%, rgba(200,160,96,.06) 0%,transparent 55%),
    radial-gradient(ellipse 40% 30% at 80% 90%, rgba(136,152,192,.04) 0%,transparent 45%);
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    repeating-linear-gradient(90deg,rgba(200,160,96,.015) 0px,rgba(200,160,96,.015) 1px,transparent 1px,transparent 80px),
    repeating-linear-gradient(0deg,rgba(200,160,96,.015) 0px,rgba(200,160,96,.015) 1px,transparent 1px,transparent 80px);
}

.wrap{max-width:720px;margin:0 auto;padding:0 20px;position:relative;z-index:1}

/* ── HEADER ── */
.site-header{padding:44px 24px 28px;text-align:center;position:relative;z-index:1}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(200,160,96,.08);border:1px solid rgba(200,160,96,.22);
  color:var(--em);padding:5px 18px;border-radius:3px;
  font-family:'Fira Mono',monospace;font-size:11px;
  letter-spacing:2px;text-transform:uppercase;margin-bottom:18px;
}
.site-header h1{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(32px,6vw,60px);font-weight:600;font-style:italic;
  line-height:1.05;letter-spacing:-.5px;margin-bottom:10px;
}
.site-header h1 em{font-style:normal;color:var(--em)}
.site-header p{color:var(--txt2);font-size:13px;font-family:'Fira Mono',monospace;letter-spacing:.5px}

/* ── ONGLETS ── */
.tabs{display:flex;gap:4px;padding:0 0 20px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{
  padding:8px 16px;border-radius:3px;
  border:1.5px solid var(--bdr);background:rgba(255,255,255,.02);
  color:var(--txt2);font-size:13px;font-weight:500;cursor:pointer;
  white-space:nowrap;transition:all .18s;font-family:'Inter',sans-serif;
  -webkit-tap-highlight-color:transparent;
}
.tab:hover{color:var(--txt);background:rgba(200,160,96,.04)}
.tab.active{background:rgba(200,160,96,.1);border-color:rgba(200,160,96,.35);color:var(--em)}

/* ── CARD ── */
.card{background:var(--card);border:1.5px solid var(--bdr);border-radius:10px;padding:24px;margin-bottom:14px;position:relative;z-index:1}
.card-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;font-style:italic;margin-bottom:5px;line-height:1.15}
.card-sub{color:var(--txt2);font-size:13px;margin-bottom:18px;line-height:1.65}

/* ── 5 MENTIONS ── */
.mentions-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mention-card{
  border-radius:10px;padding:18px;cursor:pointer;
  border:1.5px solid transparent;transition:all .22s;
  position:relative;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
.mention-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,currentColor 0%,transparent 60%);
  opacity:.04;transition:opacity .2s;
}
.mention-card:hover::before{opacity:.08}
.mention-card.active{transform:translateY(-3px)}
.mention-num{
  font-family:'Fira Mono',monospace;font-size:10px;letter-spacing:2px;
  text-transform:uppercase;margin-bottom:10px;opacity:.6;
}
.mention-icon{font-size:28px;margin-bottom:10px;display:block}
.mention-nom{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;font-style:italic;margin-bottom:5px;line-height:1.3}
.mention-short{font-size:11px;opacity:.6;margin-bottom:10px;font-family:'Fira Mono',monospace}
.mention-detail{font-size:12px;line-height:1.7;display:none;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)}
.mention-card.active .mention-detail{display:block}

/* ── COMPARATIF IDE/IPA ── */
.compare-table{border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.07)}
.compare-row{display:grid;grid-template-columns:1.5fr 2fr 2fr;border-bottom:1px solid rgba(255,255,255,.05)}
.compare-row:last-child{border-bottom:none}
.compare-cell{padding:12px 14px;font-size:13px;color:var(--txt2);line-height:1.6}
.compare-cell:first-child{color:var(--em);font-weight:600;font-size:12px;font-family:'Fira Mono',monospace;letter-spacing:.5px;border-right:1px solid rgba(255,255,255,.05)}
.compare-header .compare-cell{background:rgba(200,160,96,.1);color:var(--em);font-weight:700;font-size:12px;padding:10px 14px}
.compare-header .compare-cell:first-child{color:var(--txt2)}

/* ── FORMATION ── */
.annee-card{
  background:rgba(0,0,0,.25);border-radius:10px;padding:18px;
  margin-bottom:8px;border-left:3px solid var(--em);
}
.annee-titre{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;font-style:italic;color:var(--em);margin-bottom:8px}
.annee-ects{font-family:'Fira Mono',monospace;font-size:11px;color:var(--txt2);letter-spacing:1.5px;margin-bottom:10px}
.ue-item{
  display:flex;gap:10px;align-items:flex-start;
  padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px;
}
.ue-item:last-child{border-bottom:none}
.ue-code{font-family:'Fira Mono',monospace;font-size:10px;color:var(--em);flex-shrink:0;width:60px;margin-top:2px}

/* ── PARCOURS TIMELINE ── */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--em),rgba(200,160,96,.1))}
.tl-item{position:relative;margin-bottom:20px}
.tl-dot{position:absolute;left:-20px;top:6px;width:14px;height:14px;border-radius:50%;border:2px solid var(--em);background:var(--bg)}
.tl-titre{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;font-style:italic;color:var(--em);margin-bottom:4px}
.tl-date{font-family:'Fira Mono',monospace;font-size:10px;color:var(--txt2);letter-spacing:1px;margin-bottom:5px}
.tl-desc{font-size:13px;color:var(--txt2);line-height:1.65}

/* ── SIMULATION CONSULTATION IPA ── */
.consult-ipa{
  background:rgba(0,0,0,.2);border-radius:8px;padding:14px;margin-bottom:8px;
  border-left:3px solid transparent;
}
.consult-area{
  width:100%;border-radius:6px;padding:9px 12px;
  background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.07);
  color:var(--txt);font-size:13px;font-family:'Inter',sans-serif;
  outline:none;resize:vertical;min-height:50px;line-height:1.65;
  transition:border-color .2s;
}
.consult-area:focus{border-color:rgba(200,160,96,.3)}

/* ── QUIZ ── */
.quiz-opt{
  padding:12px 16px;border-radius:8px;border:1.5px solid var(--bdr);
  background:rgba(255,255,255,.02);color:var(--txt2);
  cursor:pointer;font-size:14px;margin-bottom:8px;
  transition:all .18s;display:flex;align-items:center;gap:12px;
  -webkit-tap-highlight-color:transparent;
}
.quiz-opt:hover{background:rgba(200,160,96,.05);color:var(--txt)}
.quiz-opt.correct{background:rgba(64,144,208,.1);border-color:rgba(64,144,208,.4);color:var(--m1)}
.quiz-opt.wrong  {background:rgba(208,80,80,.1); border-color:rgba(208,80,80,.4); color:var(--m2)}
.quiz-expl{background:rgba(200,160,96,.05);border:1px solid rgba(200,160,96,.15);border-radius:8px;padding:12px 14px;margin-top:10px;font-size:13px;color:var(--txt2);line-height:1.7}
.quiz-expl strong{color:var(--txt)}

/* ── INFO ── */
.info{border-radius:6px;padding:11px 14px;font-size:13px;line-height:1.75;margin-bottom:12px}
.info-em   {background:rgba(200,160,96,.07);border-left:3px solid rgba(200,160,96,.5);color:var(--em)}
.info-sil  {background:rgba(136,152,192,.07);border-left:3px solid rgba(136,152,192,.5);color:var(--sil)}
.info-m1   {background:rgba(64,144,208,.07); border-left:3px solid rgba(64,144,208,.5);  color:var(--m1)}
.info-m4   {background:rgba(128,80,192,.07); border-left:3px solid rgba(128,80,192,.5);  color:var(--m4)}
.info-m5   {background:rgba(224,112,48,.07); border-left:3px solid rgba(224,112,48,.5);  color:var(--m5)}

/* ── STAT ── */
.stat{background:rgba(0,0,0,.3);border:1px solid rgba(200,160,96,.08);border-radius:8px;padding:13px;text-align:center}
.stat-v{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;color:var(--em);display:block;line-height:1}
.stat-l{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:1.5px;font-family:'Fira Mono',monospace;display:block;margin-top:4px}

/* ── BOUTONS ── */
.btn-p{background:linear-gradient(135deg,var(--em2),var(--em));border:none;border-radius:6px;color:#08080e;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;padding:12px 26px;cursor:pointer;transition:opacity .2s,transform .1s;}
.btn-p:hover{opacity:.9;transform:translateY(-1px)}
.btn-g{background:rgba(255,255,255,.03);border:1.5px solid var(--bdr);border-radius:6px;color:var(--txt2);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;padding:10px 18px;cursor:pointer;transition:all .18s;}
.btn-g:hover{background:rgba(200,160,96,.05);color:var(--txt)}
.btn-full{width:100%}
.col8{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
hr.div{border:none;border-top:1px solid rgba(255,255,255,.06);margin:16px 0}

/* ── PROGRESS ── */
.progress-bar-wrap{background:rgba(255,255,255,.06);border-radius:100px;height:7px;overflow:hidden;margin:6px 0}
.progress-bar{height:100%;border-radius:100px;transition:width .6s ease}

/* ── LOADING ── */
.dots{text-align:center;padding:24px 0}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--em);margin:0 3px;animation:dotB 1.4s ease-in-out infinite both}
.dots span:nth-child(2){animation-delay:.16s}
.dots span:nth-child(3){animation-delay:.32s}
.dots-msg{color:var(--txt2);font-size:13px;margin-top:10px;font-style:italic}
.analysis p{margin-bottom:14px;font-size:15px;line-height:1.85;color:#7080a0}
.analysis strong{color:var(--txt)}

/* ── PREMIUM ── */
.premium-box{background:rgba(0,0,0,.3);border:1.5px solid rgba(200,160,96,.15);border-radius:10px;padding:24px;margin-bottom:14px}
.apikey-box{background:rgba(200,160,96,.04);border:1px solid rgba(200,160,96,.12);border-radius:6px;padding:12px}
.apikey-box p{font-size:13px;color:var(--txt2);margin-bottom:10px;line-height:1.6}
.apikey-box a{color:var(--em)}
.apikey-row{display:flex;gap:8px}
.apikey-row input{flex:1;padding:9px 12px;font-size:12px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);border-radius:6px;color:var(--txt);font-family:'Fira Mono',monospace;outline:none}
.apikey-row input:focus{border-color:rgba(200,160,96,.3)}
.apikey-row button{padding:9px 14px;border:none;border-radius:6px;background:var(--em2);color:#08080e;font-weight:700;cursor:pointer;font-size:12px}
.apikey-saved{color:#60d080;font-size:11px;margin-top:5px;font-family:'Fira Mono',monospace}

/* ── WELCOME ── */
.pts{display:flex;flex-direction:column;gap:10px;margin:18px 0;text-align:left}
.pt{display:flex;gap:12px;align-items:flex-start}
.pt-i{font-size:18px;flex-shrink:0;margin-top:2px}
.pt-t{font-size:14px;color:var(--txt2);line-height:1.65}
.pt-t strong{color:var(--txt)}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes dotB{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
.fadeup{animation:fadeUp .35s ease forwards}
@media(max-width:480px){.grid2,.grid3,.mentions-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>

// ═══════════════════════════════════════
//  DONNÉES
// ═══════════════════════════════════════

const MENTIONS = [
  {
    id:'m1', num:'MENTION 1', icon:'🫀', couleur:'#4090d0',
    nom:'Pathologies chroniques stabilisées', short:'Chrono · Soins primaires',
    desc:'La mention la plus répandue. L\'IPA assure le suivi des patients porteurs de maladies chroniques stabilisées : diabète, HTA, insuffisance cardiaque, BPCO, maladies auto-immunes...',
    competences:[
      'Examen clinique complet adapté à la pathologie chronique',
      'Renouvellement et adaptation des prescriptions médicamenteuses',
      'Prescription d\'examens complémentaires dans le cadre du suivi',
      'Coordination du parcours de soins avec le médecin traitant',
      'Éducation thérapeutique structurée et suivi à long terme',
    ],
    exercice:'Cabinet libéral, maison de santé pluriprofessionnelle, EHPAD, services hospitaliers de médecine interne.',
    avenant11:'Depuis mars 2026 — accès direct pour certaines consultations sans passage préalable chez le médecin.',
    debouche:'IPA libérale · Coordinatrice de parcours · Asalée · CPTS'
  },
  {
    id:'m2', num:'MENTION 2', icon:'🎗️', couleur:'#d05050',
    nom:'Oncologie et hémato-oncologie', short:'Cancer · Soins de support',
    desc:'Accompagnement des patients atteints de cancer tout au long du parcours de soins — de l\'annonce aux soins de support, en passant par le suivi des traitements.',
    competences:[
      'Consultation d\'annonce et accompagnement psychologique',
      'Suivi des effets secondaires de la chimiothérapie et immunothérapie',
      'Prescription et renouvellement de soins de support',
      'Coordination entre hôpital et domicile (HAD)',
      'Accompagnement en fin de vie et soins palliatifs',
    ],
    exercice:'Service d\'oncologie, hôpital de jour, HAD, soins palliatifs.',
    avenant11:'Consultations de suivi en oncologie en cours d\'ouverture aux IPA.',
    debouche:'IPA en oncologie hospitalière · Coordinatrice en HAD · Soins palliatifs'
  },
  {
    id:'m3', num:'MENTION 3', icon:'💧', couleur:'#4080a0',
    nom:'Maladie rénale chronique, dialyse, transplantation rénale', short:'Néphrologie · Rein',
    desc:'Suivi des patients insuffisants rénaux chroniques, hémodialysés ou transplantés. Rôle clé dans l\'ETP à la dialyse et la préparation aux traitements de suppléance.',
    competences:[
      'Suivi de la maladie rénale chronique aux stades 3 à 5',
      'Éducation thérapeutique pré-dialyse et choix du traitement de suppléance',
      'Surveillance des patients hémodialysés et transplantés',
      'Prescription d\'examens de suivi rénaux',
      'Accompagnement à la greffe — pré et post-transplantation',
    ],
    exercice:'Service de néphrologie, centre de dialyse, consultation de transplantation.',
    avenant11:'Suivi spécialisé IPA en néphrologie en négociation.',
    debouche:'IPA en service de néphrologie · Centre de dialyse · Consultation greffe'
  },
  {
    id:'m4', num:'MENTION 4', icon:'🧠', couleur:'#8050c0',
    nom:'Psychiatrie et santé mentale', short:'Psy · Santé mentale',
    desc:'Suivi des patients stabilisés en psychiatrie, soutien aux aidants, coordination des parcours entre psychiatrie et médico-social.',
    competences:[
      'Suivi des patients stabilisés (schizophrénie, trouble bipolaire, dépression)',
      'Évaluation clinique en psychiatrie et adaptation des traitements',
      'Soutien aux aidants et coordination famille-équipe soignante',
      'Lien avec les structures médico-sociales (ESAT, FAM, foyers)',
      'Prévention des rechutes et gestion des prodromes',
    ],
    exercice:'CMP, CMPP, CATTP, hôpital psychiatrique, EHPAD, libéral.',
    avenant11:'Consultation IPA psychiatrie prévue pour 2028.',
    debouche:'IPA en CMP · Coordinatrice de parcours psy · Psychiatrie communautaire'
  },
  {
    id:'m5', num:'MENTION 5', icon:'⚡', couleur:'#e07030',
    nom:'Urgences', short:'Urgences · Premiers recours',
    desc:'Prise en charge autonome de situations cliniques définies aux urgences, sous supervision médicale. Libère du temps médical pour les cas les plus graves.',
    competences:[
      'Évaluation clinique et triage avancé aux urgences',
      'Prise en charge de situations cliniques définies par arrêté ministériel',
      'Établissement de conclusions cliniques (sous contrôle médical)',
      'Prescription d\'examens complémentaires en urgence',
      'Coordination avec le SMUR et les services spécialisés',
    ],
    exercice:'SAU (Service d\'Accueil des Urgences), SMUR, SAMU — uniquement en établissement autorisé.',
    avenant11:'Accès direct possible depuis 2025 dans les SAU autorisés.',
    debouche:'IPA aux urgences · Coordinatrice de parcours urgentiste · SAMU'
  },
];

const QUIZ = [
  {q:'Pour exercer en tant qu\'IPA, il faut :', opts:['Uniquement le diplôme infirmier','Le diplôme infirmier + 3 ans d\'expérience IDE + master IPA','Le diplôme infirmier + 5 ans + autorisation ARS','Un master infirmier sans condition d\'expérience'], rep:1,
   expl:'L\'**IPA** nécessite : le diplôme d\'État infirmier + **3 années minimum d\'exercice** en équivalent temps plein + le **diplôme d\'État IPA** (grade master, 2 ans, 120 ECTS). On peut enchaîner IDE et master IPA, mais on ne peut exercer en pratique avancée qu\'après les 3 ans d\'expérience.'},
  {q:'La formation IPA dure :', opts:['1 an — 60 ECTS','2 ans — 120 ECTS','3 ans — 180 ECTS','6 mois — DU'], rep:1,
   expl:'Le **DE IPA vaut grade master = 2 ans = 120 ECTS**. La 1ère année (60 ECTS) est commune aux 5 mentions — tronc commun. La 2ème année (60 ECTS) est spécifique à la mention choisie avec stage de 4 mois et mémoire.'},
  {q:'En 2026, l\'IPA peut accéder directement aux patients (sans passage préalable chez le médecin) grâce à :', opts:['La loi Kouchner de 2002','L\'avenant 11 de mars 2026','Le décret Touraine de 2016','La loi de financement de la Sécurité Sociale 2024'], rep:1,
   expl:'L\'**avenant 11 (mars 2026)** ouvre l\'accès direct aux IPA pour certaines consultations — sans obligation de passage préalable chez le médecin. C\'est une évolution majeure qui reconnaît l\'IPA comme professionnel de premier recours pour les pathologies chroniques stabilisées.'},
  {q:'Quelle mention IPA est exercée UNIQUEMENT en établissement disposant d\'une autorisation de soins d\'urgence ?', opts:['Mention 1 — Pathologies chroniques','Mention 2 — Oncologie','Mention 4 — Psychiatrie','Mention 5 — Urgences'], rep:3,
   expl:'La **mention Urgences** (mention 5) est soumise à une condition réglementaire stricte : elle ne peut être exercée que dans un établissement de santé disposant d\'une **autorisation d\'activité de soins de médecine d\'urgence** (décret du 25 octobre 2021, modifié en 2025).'},
  {q:'La 1ère année du master IPA est :', opts:['Spécifique à chaque mention','Commune aux 5 mentions — tronc commun','En alternance avec le stage','100% en distanciel'], rep:1,
   expl:'La **1ère année est un tronc commun** aux 5 mentions — fondamentaux de la pratique avancée, examen clinique, recherche, santé publique, éthique. À la fin de la 1ère année, l\'étudiant choisit sa mention pour la 2ème année. C\'est une force du dispositif : une culture commune à tous les IPA.'},
  {q:'L\'IPA peut renouveler des prescriptions médicales :', opts:['Sans aucune restriction','Dans le cadre d\'un protocole d\'organisation signé avec un médecin','Uniquement pour les médicaments sans ordonnance','Jamais — c\'est une compétence exclusivement médicale'], rep:1,
   expl:'L\'IPA agit dans le cadre d\'un **protocole d\'organisation** co-signé avec un ou plusieurs médecins. Ce protocole définit précisément les actes, les pathologies concernées et les modalités de coopération. L\'IPA ne travaille pas en totale autonomie — il travaille en collaboration structurée avec les médecins.'},
];

const STORE_KEY='simipa';
function loadStore(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||{};}catch(e){return {};}}
function saveStore(d){try{localStorage.setItem(STORE_KEY,JSON.stringify(d));}catch(e){}}
let STORE=loadStore();
function getConsult(i){return STORE['ipa_consult_'+i]||'';}
function setConsult(i,v){STORE['ipa_consult_'+i]=v;saveStore(STORE);}

let S={
  view:'welcome',onglet:'mentions',
  mentionActive:null,
  quizIdx:0,quizSelected:null,quizShown:false,quizScore:0,quizTotal:0,
  analyse:'',loading:false,showKey:false,
  apiKey:localStorage.getItem('simipa_key')||'',

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function renderMd(t){return t.split('\n\n').filter(p=>p.trim()).map(para=>{const parts=para.split(/\*\*([^*]+)\*\*/g);const inner=parts.map((p,i)=>i%2===1?`<strong>${esc(p)}</strong>`:esc(p)).join('');return `<p>${inner}</p>`;}).join('');}

  else if(S.onglet==='analyse'){
    h+=`<div class="fadeup">
    <div class="card" style="border-color:rgba(200,160,96,.15)">
    <div class="card-title" style="color:var(--em)">Analyse IA — Pratique avancée</div>
    <div class="card-sub">Posez une question sur l'IPA, les mentions, le parcours de formation ou la pratique clinique avancée.</div>
    <textarea id="question-ipa" style="width:100%;min-height:80px;background:rgba(0,0,0,.3);border:1.5px solid rgba(200,160,96,.1);border-radius:8px;color:var(--txt);padding:12px;font-size:14px;font-family:'Inter',sans-serif;outline:none;resize:vertical;line-height:1.6;margin-bottom:10px" placeholder="Ex: Comment choisir ma mention IPA selon mon expérience IDE ? Quelle est la différence entre une consultation IPA et une consultation médicale ? Comment fonctionne un protocole d'organisation ?"></textarea>
    <button class="btn-p btn-full" onclick="runAnalyse()">🎓 Analyser →</button>
    ${S.loading?`<div class="dots" style="margin-top:16px"><span></span><span></span><span></span><div class="dots-msg">Analyse en pratique avancée...</div></div>`:''}
    ${!S.loading&&S.analyse?`<div class="analysis fadeup" style="margin-top:16px">${renderMd(S.analyse)}</div>`:''}
    <hr class="div">
    ${!S.apiKeySaved?`<div class="apikey-box"><p>Clé API Anthropic. <a href="https://console.anthropic.com/" target="_blank">Obtenir →</a></p><div class="apikey-row"><input type="text" placeholder="sk-ant-api03-…" value="${esc(S.apiKey)}" oninput="S.apiKey=this.value"><button onclick="saveKey()">Sauver</button></div></div>`:`<div style="color:#60d080;font-family:'Fira Mono',monospace;font-size:11px">✓ Clé API configurée</div>`}
    </div>
    <div class="premium-box">
    <div style="text-align:center;margin-bottom:18px">
      <div style="font-size:32px;margin-bottom:8px">🔒</div>
      <div style="font-family:'Cormorant Garamond',serif;font-size:20px;font-style:italic;color:var(--txt);margin-bottom:5px">Analyse IA — Accès Premium</div>
      <div style="font-size:13px;color:var(--txt2)">Mentions, comparatif, formation, parcours, simulation et quiz sont entièrement gratuits</div>
    </div>
    <div class="grid3" style="margin-bottom:16px">
    ${[{who:'Module seul',price:'4,99€',desc:'SimIPA à vie'},{who:'Suite complète',price:'12,99€',desc:'19 modules à vie',em:true},{who:'Institution',price:'Devis',desc:'IFSI · Syndicat'}].map(t=>`<div style="border:1.5px solid ${t.em?'rgba(200,160,96,.4)':'var(--bdr)'};border-radius:8px;padding:14px;text-align:center;background:${t.em?'rgba(200,160,96,.07)':'rgba(255,255,255,.02)'}"><div style="font-family:'Fira Mono',monospace;font-size:10px;color:${t.em?'var(--em)':'var(--txt2)'};margin-bottom:8px">${t.who}</div><div style="font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--txt)">${t.price}</div><div style="font-size:11px;color:var(--txt2);margin-top:5px">${t.desc}</div></div>`).join('')}
    </div>
    <div style="text-align:center;margin-bottom:10px"><a href="mailto:contact@simcare.fr" style="display:inline-block;padding:12px 28px;border-radius:6px;background:linear-gradient(135deg,var(--em2),var(--em));color:#08080e;font-weight:700;font-size:14px;text-decoration:none">Obtenir l'accès →</a></div>
    <div style="text-align:center;padding-top:10px;border-top:1px solid rgba(255,255,255,.06)"><button onclick="S.showKey=!S.showKey;render()" style="background:none;border:none;color:var(--txt2);font-size:11px;cursor:pointer;font-family:'Fira Mono',monospace">🔑 Espace formateur</button></div>
    ${S.showKey?`<div class="apikey-box" style="margin-top:12px"><p>Clé API — formateur. <a href="https://console.anthropic.com/" target="_blank">Obtenir →</a></p><div class="apikey-row"><input type="text" placeholder="sk-ant-api03-…" value="${esc(S.apiKey)}" oninput="S.apiKey=this.value"><button onclick="saveKey()">Sauver</button></div>${S.apiKeySaved?'<div class="apikey-saved">✓ Clé enregistrée</div>':''}</div>`:''}
    </div></div>`;
  }

  if(S.view!=='welcome'){
    h+=`<div style="margin-top:12px"><button class="btn-g" onclick="go('welcome')" style="color:var(--em);border-color:rgba(200,160,96,.2)">← Accueil SimIPA</button></div>`;
  }
  h+='</div>';
  document.getElementById('app').innerHTML=h;
}

function go(v){S.view=v;render();window.scrollTo({top:0,behavior:'smooth'});}
function setOnglet(o){S.onglet=o;S.analyse='';render();window.scrollTo({top:0,behavior:'smooth'});}
function selectQuiz(i){if(S.quizShown)return;S.quizSelected=i;S.quizShown=true;S.quizTotal++;if(i===QUIZ[S.quizIdx%QUIZ.length].rep)S.quizScore++;render();}
function nextQuiz(){S.quizIdx++;S.quizSelected=null;S.quizShown=false;render();window.scrollTo({top:0,behavior:'smooth'});}
function saveKey(){localStorage.setItem('simipa_key',S.apiKey);S.apiKeySaved=true;render();}

async function runAnalyse(){
  const q=document.getElementById('question-ipa')?.value||'';
  if(!q.trim())return;
  S.loading=true;S.analyse='';render();
  try{
    const headers={'Content-Type':'application/json'};
    if(S.apiKey){headers['x-api-key']=S.apiKey;headers['anthropic-version']='2023-06-01';}
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers,body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:900,messages:[{role:'user',content:`Tu es un formateur expert en infirmerie en pratique avancée (IPA), connais parfaitement le décret du 18 juillet 2018, l'avenant 11 de mars 2026, les 5 mentions IPA, la formation master IPA, et l'exercice clinique en pratique avancée en France en 2026.\n\nQuestion : ${q}\n\nRéponds en 3-4 paragraphes pratiques et précis. Tutoie l'étudiant si la question est personnelle. Cite les textes réglementaires pertinents. Donne des exemples concrets de situations cliniques IPA. Utilise **gras** pour les points clés.`}]})});
    const data=await res.json();
    if(data.error)throw new Error(data.error.message);
    S.analyse=data.content?.find(b=>b.type==='text')?.text||'';
  }catch(e){S.analyse=`**Erreur**\n\n${e.message}`;}
  S.loading=false;render();
}

render();
</script>
</body>
</html>
