<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimConsultation · Outil pédagogique IFSI</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #111118;
  --bg2:    #18181f;
  --card:   rgba(255,255,255,.03);
  --bdr:    rgba(255,255,255,.07);
  --txt:    #f0ede8;
  --txt2:   #7a7068;
  --txt3:   #302820;
  --em:     #d4a853;
  --em2:    #b08030;
  --cream:  #f0e8d0;
  --sage:   #70a880;
  --slate:  #6080a0;
  --rose:   #c06070;
  --teal:   #50a898;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Barlow',sans-serif;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 80% 40% at 50% 0%, rgba(212,168,83,.05) 0%,transparent 60%),
    radial-gradient(ellipse 40% 60% at 100% 100%,rgba(96,128,160,.04) 0%,transparent 50%);
  color:var(--txt);min-height:100vh;padding-bottom:80px;
}
.wrap{max-width:700px;margin:0 auto;padding:0 20px}

/* ── HEADER ── */
.site-header{padding:40px 24px 28px;border-bottom:1px solid rgba(212,168,83,.15);text-align:center;margin-bottom:28px}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(212,168,83,.08);border:1px solid rgba(212,168,83,.2);
  color:var(--em);padding:4px 14px;border-radius:3px;
  font-family:'Barlow Condensed',sans-serif;font-size:11px;
  letter-spacing:2px;text-transform:uppercase;margin-bottom:16px;
}
.site-header h1{
  font-family:'Libre Baskerville',serif;
  font-size:clamp(26px,5vw,42px);font-weight:700;letter-spacing:-.5px;line-height:1.1;
}
.site-header h1 em{font-style:italic;color:var(--em)}
.site-header p{color:var(--txt3);font-size:13px;margin-top:8px;letter-spacing:.5px;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase}

/* ── STEPS ── */
.steps-wrap{padding:0 0 24px}
.steps-row{display:flex;align-items:center;gap:0;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.step-item{display:flex;align-items:center;gap:0;flex-shrink:0}
.step-btn{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 14px;cursor:pointer;border:none;background:none;
  transition:all .2s;-webkit-tap-highlight-color:transparent;
}
.step-num{
  width:28px;height:28px;border-radius:50%;
  border:1.5px solid var(--bdr);background:rgba(255,255,255,.02);
  display:flex;align-items:center;justify-content:center;
  font-family:'Fira Mono',monospace;font-size:11px;color:var(--txt3);
  transition:all .2s;
}
.step-lbl{font-size:10px;color:var(--txt3);font-family:'Barlow Condensed',sans-serif;letter-spacing:.5px;white-space:nowrap}
.step-item.active .step-num{background:rgba(212,168,83,.12);border-color:rgba(212,168,83,.5);color:var(--em)}
.step-item.active .step-lbl{color:var(--txt2)}
.step-item.done .step-num{background:var(--em2);border-color:var(--em2);color:#111118}
.step-line{width:20px;height:1px;background:var(--bdr);flex-shrink:0}

/* ── CARD ── */
.card{
  background:var(--card);border:1px solid var(--bdr);
  border-radius:4px;padding:26px;margin-bottom:14px;
  border-top:2px solid transparent;
}
.card.gold{border-top-color:var(--em)}
.card.sage{border-top-color:var(--sage)}
.card.slate{border-top-color:var(--slate)}
.card.rose{border-top-color:var(--rose)}
.card.teal{border-top-color:var(--teal)}
.card-title{font-family:'Libre Baskerville',serif;font-size:19px;font-weight:700;margin-bottom:4px;line-height:1.2}
.card-sub{color:var(--txt3);font-size:13px;margin-bottom:20px;line-height:1.6;font-style:italic}

/* ── FORM ── */
.lbl{display:block;font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--txt3);margin-bottom:7px}
.lbl-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.lbl-val{font-family:'Fira Mono',monospace;color:var(--em);font-size:13px}

input[type=text],textarea,select{
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:3px;color:var(--txt);padding:10px 14px;
  font-size:14px;font-family:'Barlow',sans-serif;
  outline:none;width:100%;transition:border-color .2s;line-height:1.5;
}
input[type=text]:focus,textarea:focus,select:focus{border-color:rgba(212,168,83,.4)}
textarea{resize:vertical;min-height:70px}
select option{background:#18181f;color:var(--txt)}

input[type=range]{
  -webkit-appearance:none;width:100%;height:8px;
  border-radius:4px;background:rgba(255,255,255,.07);outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:28px;height:28px;
  border-radius:50%;background:var(--em);cursor:pointer;
  border:2px solid rgba(255,255,255,.15);transition:transform .15s;
}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.2)}

.sl-wrap{display:flex;align-items:center;gap:8px}
.sl-wrap input[type=range]{flex:1}
.sl-btn{
  width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  color:rgba(255,255,255,.5);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;user-select:none;-webkit-user-select:none;
}
.sl-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.sl-btn:active{transform:scale(.9)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:flex;flex-direction:column;gap:16px}
.col8{display:flex;flex-direction:column;gap:8px}

/* ── SEL ── */
.sel{
  cursor:pointer;border:1px solid var(--bdr);border-radius:3px;
  padding:11px 14px;background:rgba(255,255,255,.02);
  color:var(--txt2);font-size:14px;transition:all .18s;
  display:flex;align-items:flex-start;gap:10px;user-select:none;
}
.sel:hover{background:rgba(255,255,255,.05);color:var(--txt)}
.sel.on{background:rgba(212,168,83,.07);color:var(--txt);border-color:rgba(212,168,83,.35)}
.sel .si{font-size:18px;flex-shrink:0;margin-top:1px}
.sel .sd{font-size:11px;color:var(--txt3);margin-top:2px}

/* ── BOUTONS ── */
.btn-p{
  background:linear-gradient(135deg,var(--em2),var(--em));
  border:none;border-radius:3px;color:#111118;
  font-family:'Barlow',sans-serif;font-size:15px;font-weight:700;
  padding:13px 28px;cursor:pointer;transition:opacity .2s,transform .1s;
  letter-spacing:.5px;
}
.btn-p:hover{opacity:.9;transform:translateY(-1px)}
.btn-g{
  background:rgba(255,255,255,.03);border:1px solid var(--bdr);
  border-radius:3px;color:var(--txt2);
  font-family:'Barlow',sans-serif;font-size:14px;
  padding:11px 20px;cursor:pointer;transition:all .18s;
}
.btn-g:hover{background:rgba(255,255,255,.06);color:var(--txt)}
.btn-full{width:100%}
.nav-row{display:flex;gap:10px}
.nav-row>*{flex:1}
.nav-col{display:flex;flex-direction:column;gap:10px}

/* ── DIAGNOSTIC ── */
.diag-box{
  background:rgba(0,0,0,.3);border:1px solid rgba(212,168,83,.2);
  border-radius:3px;padding:18px;margin-top:14px;
}
.diag-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--em);margin-bottom:8px}
.diag-formule{
  font-family:'Libre Baskerville',serif;font-style:italic;
  font-size:15px;color:var(--txt);line-height:1.7;
}
.diag-formule strong{font-style:normal;color:var(--em)}

/* ── PRESCRIPTION ── */
.presc-item{
  background:rgba(255,255,255,.03);border:1px solid var(--bdr);
  border-radius:3px;padding:14px 16px;margin-bottom:8px;
  display:flex;align-items:flex-start;gap:12px;
}
.presc-check{
  width:20px;height:20px;border-radius:2px;border:1.5px solid var(--bdr);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  cursor:pointer;transition:all .15s;margin-top:2px;font-size:12px;
}
.presc-check.on{background:var(--em2);border-color:var(--em2);color:#111118}
.presc-name{font-weight:600;font-size:14px;margin-bottom:3px}
.presc-detail{font-size:12px;color:var(--txt2);line-height:1.6}
.presc-tag{
  display:inline-block;padding:2px 8px;border-radius:2px;
  font-family:'Fira Mono',monospace;font-size:9px;letter-spacing:1px;
  text-transform:uppercase;margin-top:5px;
}

/* ── ORDONNANCE ── */
.ordonnance{
  background:#faf7f0;border:1.5px solid #d4a853;border-radius:3px;
  padding:22px 24px;color:#1a1208;font-family:'Libre Baskerville',serif;
  margin-top:14px;
}
.ord-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid rgba(212,168,83,.4);padding-bottom:12px;margin-bottom:14px}
.ord-logo{font-size:16px;font-weight:700;color:#111118}
.ord-logo span{color:#b08030}
.ord-date{font-size:11px;color:#6a5a30;font-family:'Barlow',sans-serif}
.ord-patient{font-size:13px;color:#2a2010;margin-bottom:12px;font-family:'Barlow',sans-serif}
.ord-item{margin-bottom:10px}
.ord-item-name{font-size:14px;font-weight:700;color:#1a1208}
.ord-item-detail{font-size:12px;color:#5a4a20;margin-top:2px;font-family:'Barlow',sans-serif}
.ord-signature{margin-top:16px;padding-top:12px;border-top:1px solid rgba(212,168,83,.3);font-size:12px;color:#8a7040;font-style:italic;font-family:'Barlow',sans-serif}

/* ── INFO ── */
.info{border-radius:3px;padding:12px 15px;font-size:13px;line-height:1.7}
.info-em  {background:rgba(212,168,83,.07); border-left:3px solid rgba(212,168,83,.5); color:var(--em)}
.info-sage{background:rgba(112,168,128,.07);border-left:3px solid rgba(112,168,128,.5);color:var(--sage)}
.info-slate{background:rgba(96,128,160,.07);border-left:3px solid rgba(96,128,160,.5);color:var(--slate)}
.info-rose{background:rgba(192,96,112,.07); border-left:3px solid rgba(192,96,112,.5); color:var(--rose)}

/* ── ANAMNESE ── */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:1px;background:rgba(212,168,83,.2)}
.tl-item{position:relative;margin-bottom:14px}
.tl-dot{position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--em);background:var(--bg)}
.tl-title{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--em);margin-bottom:5px}

/* ── WELCOME ── */
.welcome{text-align:center;padding:4px 0 24px}
.welcome-icon{font-size:56px;display:block;margin-bottom:16px}
.welcome p{color:var(--txt2);font-size:15px;line-height:1.85;max-width:480px;margin:0 auto}
.pts{display:flex;flex-direction:column;gap:12px;margin:22px 0;text-align:left}
.pt{display:flex;gap:12px;align-items:flex-start}
.pt-i{font-size:20px;flex-shrink:0;margin-top:2px}
.pt-t{font-size:14px;color:var(--txt2);line-height:1.65}
.pt-t strong{color:var(--txt)}

/* ── LOADING ── */
.dots{text-align:center;padding:24px 0}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--em);margin:0 3px;animation:dotB 1.4s ease-in-out infinite both}
.dots span:nth-child(2){animation-delay:.16s}
.dots span:nth-child(3){animation-delay:.32s}
.dots-msg{color:var(--txt3);font-size:13px;margin-top:10px;font-style:italic}

/* ── PREMIUM ── */
.premium-box{background:rgba(0,0,0,.3);border:1px solid rgba(212,168,83,.18);border-radius:4px;padding:26px;margin-bottom:14px}
.apikey-box{background:rgba(212,168,83,.04);border:1px solid rgba(212,168,83,.12);border-radius:3px;padding:14px}
.apikey-box p{font-size:13px;color:var(--txt3);margin-bottom:10px;line-height:1.6}
.apikey-box a{color:var(--em)}
.apikey-row{display:flex;gap:8px}
.apikey-row input{flex:1;padding:9px 12px;font-size:13px}
.apikey-row button{padding:9px 16px;border:none;border-radius:3px;background:var(--em2);color:#111118;font-weight:700;cursor:pointer;font-family:'Barlow',sans-serif;font-size:13px}
.apikey-saved{color:var(--sage);font-size:11px;margin-top:5px;font-family:'Fira Mono',monospace}
.analysis p{margin-bottom:14px;color:#a09080;font-size:15px;line-height:1.85}
.analysis strong{color:var(--txt);font-size:16px}

hr.div{border:none;border-top:1px solid rgba(255,255,255,.06);margin:18px 0}
.stat{background:rgba(0,0,0,.25);border:1px solid var(--bdr);border-radius:3px;padding:13px;text-align:center}
.stat-v{font-family:'Fira Mono',monospace;font-size:20px;font-weight:500;color:var(--em);display:block}
.stat-l{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:1.5px;font-family:'Barlow Condensed',sans-serif;display:block;margin-top:4px}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes dotB  {0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
.fadeup{animation:fadeUp .35s ease forwards}
@media(max-width:480px){.grid2{grid-template-columns:1fr}.nav-row{flex-direction:column}.steps-row{gap:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ═══════════════════════════════════════
//  DONNÉES
// ═══════════════════════════════════════

const MOTIFS = [
  {id:'suivi_chronique', label:'Suivi maladie chronique',      icon:'🔄', desc:'HTA, diabète, BPCO, IC — suivi régulier'},
  {id:'plaie',           label:'Surveillance de plaie',         icon:'🩹', desc:'Escarre, plaie chirurgicale, ulcère'},
  {id:'traitement',      label:'Éducation au traitement',       icon:'💊', desc:'Nouveau traitement, vérification observance'},
  {id:'prevention',      label:'Prévention / dépistage',        icon:'🛡️', desc:'Vaccination, dépistage, bilan de santé'},
  {id:'stomie',          label:'Suivi stomie / sonde',          icon:'🏥', desc:'Changement, surveillance, éducation'},
  {id:'douleur',         label:'Évaluation douleur chronique',  icon:'🌡️', desc:'Suivi antalgique, adaptation du plan'},
];

const ANTECEDENTS = [
  {id:'hta',    label:'HTA',                    icon:'🩺'},
  {id:'diab',   label:'Diabète',                icon:'🩸'},
  {id:'card',   label:'Insuffisance cardiaque',  icon:'❤️'},
  {id:'bpco',   label:'BPCO',                   icon:'🫁'},
  {id:'insuf_r',label:'Insuffisance rénale',    icon:'🫘'},
  {id:'cancer', label:'Antécédent cancer',      icon:'🎗️'},
  {id:'depres', label:'Dépression',             icon:'🧠'},
  {id:'aucun',  label:'Aucun antécédent notable',icon:'✓'},
];

// Ce qu'un IDE peut prescrire selon décret 2025-581 et référentiel 2026
const PRESCRIPTIONS_IDE = [
  {
    id:'pansement', cat:'Matériel de soin',
    nom:'Matériel de pansement adapté',
    detail:'Compresses stériles, film transparent, hydrocol­loïde, alginate — selon le type de plaie et sa phase de cicatrisation.',
    cadre:'Prescription autonome IDE selon le type de plaie',
    col:'var(--sage)', bg:'rgba(112,168,128,.1)'
  },
  {
    id:'contention', cat:'Dispositif médical',
    nom:'Bas de contention médicale',
    detail:'Classe I à IV selon l\'évaluation clinique, les mesures et les contre-indications. Inclut la surveillance de la tolérance.',
    cadre:'Prescription autonome IDE — évaluation clinique préalable',
    col:'var(--slate)', bg:'rgba(96,128,160,.1)'
  },
  {
    id:'glycemie', cat:'Biologie',
    nom:'Glycémie capillaire de surveillance',
    detail:'Fréquence adaptée au profil du patient diabétique. Inclut la transmission des résultats au médecin traitant.',
    cadre:'Dans le cadre du suivi infirmier du diabète',
    col:'var(--em)', bg:'rgba(212,168,83,.1)'
  },
  {
    id:'vaccination', cat:'Vaccination',
    nom:'Vaccination grippe saisonnière',
    detail:'Pour les personnes à risque (> 65 ans, pathologie chronique, femme enceinte) — sans ordonnance médicale préalable.',
    cadre:'Prescription et administration autonomes IDE',
    col:'var(--teal)', bg:'rgba(80,168,152,.1)'
  },
  {
    id:'bilan_inf', cat:'Biologie',
    nom:'Bilan infirmier de surveillance',
    detail:'NFS, ionogramme, créatinine, glycémie, bilan hépatique — selon la pathologie et le traitement en cours.',
    cadre:'Sur prescription médicale ou dans le cadre d\'un protocole de coopération',
    col:'var(--rose)', bg:'rgba(192,96,112,.1)'
  },
  {
    id:'education', cat:'Éducation thérapeutique',
    nom:'Programme d\'ETP structuré',
    detail:'Plan d\'éducation thérapeutique personnalisé : objectifs, séances, évaluation. Pathologies chroniques.',
    cadre:'Compétence propre IDE — coordination avec l\'équipe pluridisciplinaire',
    col:'var(--sage)', bg:'rgba(112,168,128,.1)'
  },
];

const DIAG_TEMPLATES = {
  suivi_chronique: { prob:'Gestion inefficace du régime thérapeutique', lien:'liée à la complexité du traitement et à un déficit de connaissances', manifest:'se manifestant par une observance insuffisante et des paramètres biologiques déséquilibrés' },
  plaie:           { prob:'Atteinte à l\'intégrité cutanée', lien:'liée à une pression prolongée / à un trouble vasculaire', manifest:'se manifestant par une plaie de stade [X] avec signes inflammatoires' },
  traitement:      { prob:'Connaissances insuffisantes sur le traitement', lien:'liée à un déficit d\'information et/ou à la complexité du régime', manifest:'se manifestant par des erreurs de prise et une incompréhension des effets attendus' },
  prevention:      { prob:'Mode de vie sédentaire à risque cardiovasculaire', lien:'lié aux habitudes alimentaires et à l\'inactivité physique', manifest:'se manifestant par un périmètre abdominal > norme et une PA limite' },
  stomie:          { prob:'Altération de l\'image corporelle', lien:'liée à la présence de la stomie et aux modifications physiques', manifest:'se manifestant par une verbalisation de gêne et une réticence aux soins d\'entretien' },
  douleur:         { prob:'Douleur chronique', lien:'liée à la pathologie sous-jacente et à une antalgie insuffisamment adaptée', manifest:'se manifestant par un score EVA > 5 et une limitation fonctionnelle majeure' },
};

// ═══════════════════════════════════════
//  ÉTAT
// ═══════════════════════════════════════
const TODAY = new Date();
const DATE_STR = `${TODAY.getDate().toString().padStart(2,'0')}/${(TODAY.getMonth()+1).toString().padStart(2,'0')}/${TODAY.getFullYear()}`;

let S = {
  view: 'welcome',
  step: 1,
  patient: { prenom:'Gisèle', sexe:'F', age:74, poids:68, taille:162 },
  motif: 'suivi_chronique',
  atcd: ['hta','diab'],
  traitements_cours: '',
  allergies: '',
  // Anamnèse
  motif_detail: '',
  histoire_maladie: '',
  signes_fonctionnels: '',
  // Constantes
  fc:'', fr:'', pas:'', spo2:'', temp:'', glyc:'', poids_j:'',
  // Diagnostic
  diag_prob:'', diag_lien:'', diag_manifest:'',
  diag_auto: false,
  // Prescription
  prescriptions_choisies: [],
  notes_prescription: '',
  // Analyse
  analyse:'', loading:false, showKey:false,
  apiKey: localStorage.getItem('simconsult_key')||'',
  apiKeySaved: !!localStorage.getItem('simconsult_key'),
};

function motifObj(){ return MOTIFS.find(m=>m.id===S.motif)||MOTIFS[0] }
function diagTemplate(){ return DIAG_TEMPLATES[S.motif]||DIAG_TEMPLATES.suivi_chronique }

// ═══════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function renderMd(text){
  return text.split('\n\n').filter(p=>p.trim()).map(para=>{
    const parts=para.split(/\*\*([^*]+)\*\*/g);
    const inner=parts.map((p,i)=>i%2===1?`<strong>${esc(p)}</strong>`:esc(p)).join('');
    return `<p>${inner}</p>`;
  }).join('');
}
function ageLabel(a){if(a<12)return 'Enfant';if(a<18)return 'Adolescent';if(a<65)return 'Adulte';return 'Personne âgée'}

// ═══════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════
function render(){
  const pr = S.patient.prenom||'le patient';
  const mo = motifObj();

  const STEPS = [
    {n:1, label:'Patient'},
    {n:2, label:'Anamnèse'},
    {n:3, label:'Clinique'},
    {n:4, label:'Diagnostic'},
    {n:5, label:'Prescription'},
    {n:6, label:'Synthèse'},

                <div style="font-size:20px;font-weight:700;color:var(--txt)">Devis</div>
                <div style="font-size:11px;color:var(--txt3);margin-top:5px">IFSI · Syndicat</div>
              </div>
            </div>
            <div style="text-align:center;margin-bottom:12px">
              <a href="mailto:contact@simcare.fr" style="display:inline-block;padding:12px 28px;border-radius:3px;background:linear-gradient(135deg,var(--em2),var(--em));color:#111118;font-weight:700;font-size:14px;text-decoration:none;font-family:'Barlow',sans-serif">Obtenir l'accès →</a>
            </div>
            <div style="text-align:center;padding-top:12px;border-top:1px solid rgba(255,255,255,.05)">
              <button onclick="S.showKey=!S.showKey;render()" style="background:none;border:none;color:var(--txt3);font-size:11px;cursor:pointer;font-family:'Fira Mono',monospace">🔑 Espace formateur</button>
            </div>
            ${S.showKey?`<div class="apikey-box" style="margin-top:12px">
              <p>Clé API Anthropic — formateur. <a href="https://console.anthropic.com/" target="_blank">Obtenir →</a></p>
              <div class="apikey-row">
                <input type="text" placeholder="sk-ant-api03-…" value="${esc(S.apiKey)}" oninput="S.apiKey=this.value">
                <button onclick="saveKey()">Sauver</button>
              </div>
              ${S.apiKeySaved?'<div class="apikey-saved">✓ Clé enregistrée</div><div style="text-align:center;margin-top:10px"><button class="btn-p" onclick="runAnalyse()">🔍 Lancer l\'analyse</button></div>':''}
            </div>`:''}
          </div>`:''}

        ${!S.loading&&S.analyse?`<div class="analysis fadeup">${renderMd(S.analyse)}</div>`:''}
      </div>
      <div class="nav-col">
        <div class="nav-row">
          <button class="btn-g" onclick="goStep(5)">← Prescription</button>
          <button class="btn-g" onclick="runAnalyse()" style="color:var(--em);border-color:rgba(212,168,83,.25)">↺ Relancer l'analyse</button>
        </div>
        <button class="btn-g btn-full" onclick="reset()" style="color:var(--teal);border-color:rgba(80,168,152,.25)">✦ Nouvelle consultation</button>
      </div>`;
    }
  }

  h+='</div>';
  document.getElementById('app').innerHTML=h;
}

// ═══════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════
function go(v){S.view=v;S.step=1;render();window.scrollTo({top:0,behavior:'smooth'})}
function goStep(n){S.step=n;render();window.scrollTo({top:0,behavior:'smooth'})}
function goAnalyse(){S.step=6;S.analyse='';render();runAnalyse()}
function upPat(k,d){S.patient={...S.patient,[k]:Math.max(0,Math.min(220,S.patient[k]+d))};render()}
function toggleAtcd(id){S.atcd=S.atcd.includes(id)?S.atcd.filter(x=>x!==id):[...S.atcd,id];render()}
function togglePresc(id){S.prescriptions_choisies=S.prescriptions_choisies.includes(id)?S.prescriptions_choisies.filter(x=>x!==id):[...S.prescriptions_choisies,id];render()}
function autoDiag(){const t=diagTemplate();S.diag_prob=t.prob;S.diag_lien=t.lien;S.diag_manifest=t.manifest;render()}
function saveKey(){localStorage.setItem('simconsult_key',S.apiKey);S.apiKeySaved=true;render()}
function reset(){
  S={...S,view:'welcome',step:1,
    patient:{prenom:'',sexe:'F',age:45,poids:65,taille:165},
    motif:'suivi_chronique',atcd:[],traitements_cours:'',allergies:'',
    motif_detail:'',histoire_maladie:'',signes_fonctionnels:'',
    fc:'',fr:'',pas:'',spo2:'',temp:'',glyc:'',obs_clinique:'',
    diag_prob:'',diag_lien:'',diag_manifest:'',
    prescriptions_choisies:[],notes_prescription:'',analyse:''};
  render();
}

// ═══════════════════════════════════════
//  API CLAUDE
// ═══════════════════════════════════════
async function runAnalyse(){
  const mo=motifObj(), tmpl=diagTemplate();
  const pr=S.patient.prenom||'le patient';
  const diag=`${S.diag_prob||tmpl.prob}, ${S.diag_lien||tmpl.lien}, ${S.diag_manifest||tmpl.manifest}`;
  const presc=S.prescriptions_choisies.map(id=>PRESCRIPTIONS_IDE.find(p=>p.id===id)?.nom).filter(Boolean).join(', ');

  S.loading=true;S.analyse='';render();

  const prompt=`Tu es un formateur IFSI expert en consultation infirmière, spécialiste du référentiel 2026. Un étudiant de 3ème année vient de simuler une consultation infirmière complète.

DONNÉES DE LA CONSULTATION :
Patient : ${pr}, ${S.patient.sexe==='H'?'homme':'femme'} de ${S.patient.age} ans, ${S.patient.poids}kg.
Motif : ${mo.label} — ${S.motif_detail||'non précisé'}
ATCD : ${S.atcd.join(', ')||'aucun'}
Traitements en cours : ${S.traitements_cours||'non renseigné'}
Constantes : FC ${S.fc||'—'}, FR ${S.fr||'—'}, PA ${S.pas||'—'}, SpO₂ ${S.spo2||'—'}%, T° ${S.temp||'—'}°C, Glycémie ${S.glyc||'—'} mmol/L
Diagnostic infirmier formulé : ${diag}
Prescriptions IDE choisies : ${presc||'aucune'}
Notes : ${S.notes_prescription||'—'}

Réponds avec EXACTEMENT ces 4 blocs :

**🎯 Cohérence globale de la consultation**
[2-3 phrases. Cette consultation est-elle cohérente ? Le motif, les constantes, le diagnostic et les prescriptions sont-ils bien articulés ?]

**📝 Qualité du diagnostic infirmier**
[2 phrases. La structure PES est-elle bien respectée ? Le diagnostic est-il pertinent pour CE patient et CE motif ?]

**✍️ Pertinence des prescriptions IDE**
[2 phrases. Les prescriptions choisies sont-elles dans le champ de compétences IDE selon le référentiel 2026 ? Y a-t-il des prescriptions oubliées ?]

**🔄 Plan de suivi recommandé**
[3 actions concrètes numérotées. Quelle fréquence de consultation ? Quels critères de réévaluation ? Quand orienter vers le médecin ?]

Tutoie l'étudiant. Sois précis, bienveillant, cliniquement ancré dans le référentiel 2026.`;

  try{
    const headers={'Content-Type':'application/json'};
    if(S.apiKey){headers['x-api-key']=S.apiKey;headers['anthropic-version']='2023-06-01';}
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers,
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1100,messages:[{role:'user',content:prompt}]})
    });
    const data=await res.json();
    if(data.error)throw new Error(data.error.message);
    S.analyse=data.content?.find(b=>b.type==='text')?.text||'';
  }catch(e){
    S.analyse=`**⚠️ Erreur**\n\n${e.message||'Vérifiez votre clé API.'}`;
  }
  S.loading=false;render();
}

render();
</script>
