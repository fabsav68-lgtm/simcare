<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PraxisTACA · Théorie · Outil pédagogique IFSI</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:    #0d1117;
  --bg2:   #161b22;
  --card:  rgba(255,255,255,.03);
  --bdr:   rgba(255,255,255,.08);
  --txt:   #e6edf3;
  --txt2:  #7d8590;
  --txt3:  #21262d;
  --ink:   #1c2128;

  /* Couleurs par semestre */
  --s1: #58a6ff;  /* Bleu guidé */
  --s2: #3fb950;  /* Vert accompagné */
  --s3: #d29922;  /* Ambre semi-autonome */
  --s4: #e07060;  /* Corail autonome */
  --s5: #a371f7;  /* Violet réflexif */
  --s6: #f0c040;  /* Or expert */
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'IBM Plex Sans',sans-serif;
  background:var(--bg);
  color:var(--txt);
  min-height:100vh;
  padding-bottom:80px;
  overflow-x:hidden;
  position:relative;
}

/* Fond papier millimétré subtil */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(88,166,255,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(88,166,255,.03) 1px,transparent 1px);
  background-size:40px 40px;
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(88,166,255,.06) 0%,transparent 60%);
}

.wrap{max-width:720px;margin:0 auto;padding:0 20px;position:relative;z-index:1}

/* ── HEADER ── */
.site-header{padding:40px 24px 32px;text-align:center;position:relative;z-index:1}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(88,166,255,.08);border:1px solid rgba(88,166,255,.2);
  color:var(--s1);padding:5px 16px;border-radius:4px;
  font-family:'IBM Plex Mono',monospace;font-size:11px;
  letter-spacing:2px;text-transform:uppercase;margin-bottom:16px;
}
.site-header h1{
  font-family:'Lora',serif;
  font-size:clamp(26px,5vw,42px);font-weight:600;
  font-style:italic;line-height:1.15;letter-spacing:-.5px;margin-bottom:8px;
}
.site-header h1 em{font-style:normal;color:var(--s1)}
.site-header p{color:var(--txt2);font-size:13px;line-height:1.6}

/* ── CRESCENDO VISUEL ── */
.crescendo{
  display:flex;align-items:flex-end;justify-content:center;
  gap:6px;padding:24px 0 8px;height:80px;
}
.cres-bar{
  display:flex;flex-direction:column;align-items:center;
  gap:6px;cursor:pointer;transition:all .2s;
  -webkit-tap-highlight-color:transparent;
}
.cres-bar-inner{
  width:38px;border-radius:4px 4px 0 0;
  transition:all .25s cubic-bezier(.34,1.56,.64,1);
  opacity:.35;
}
.cres-bar.active .cres-bar-inner{opacity:1;box-shadow:0 0 16px currentColor}
.cres-bar:hover .cres-bar-inner{opacity:.75}
.cres-lbl{
  font-family:'IBM Plex Mono',monospace;font-size:10px;
  color:var(--txt2);letter-spacing:1px;transition:color .2s;
}
.cres-bar.active .cres-lbl{font-weight:600}

/* ── SEMESTRE INFO ── */
.sem-info{
  display:flex;align-items:center;gap:14px;
  background:var(--card);border:1.5px solid var(--bdr);
  border-radius:12px;padding:16px 20px;margin-bottom:20px;
  position:relative;z-index:1;transition:border-color .3s;
}
.sem-badge{
  width:52px;height:52px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;flex-shrink:0;
}
.sem-name{font-family:'Lora',serif;font-size:18px;font-weight:500;font-style:italic}
.sem-posture{font-size:12px;color:var(--txt2);margin-top:2px;font-family:'IBM Plex Mono',monospace;letter-spacing:1px}
.sem-heures{
  margin-left:auto;text-align:right;
  font-family:'IBM Plex Mono',monospace;
}
.sem-heures-v{font-size:28px;font-weight:500;display:block;line-height:1}
.sem-heures-l{font-size:10px;color:var(--txt2);letter-spacing:1.5px;text-transform:uppercase}

/* ── ONGLETS ── */
.tabs{display:flex;gap:4px;padding:0 0 20px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap}
.tab{
  padding:8px 16px;border-radius:6px;
  border:1.5px solid var(--bdr);background:rgba(255,255,255,.02);
  color:var(--txt2);font-size:13px;font-weight:500;cursor:pointer;
  white-space:nowrap;transition:all .18s;font-family:'IBM Plex Sans',sans-serif;
  -webkit-tap-highlight-color:transparent;
}
.tab:hover{color:var(--txt);background:rgba(255,255,255,.04)}
.tab.active{background:rgba(88,166,255,.08);border-color:rgba(88,166,255,.3);color:var(--s1)}

/* ── CARD ── */
.card{background:var(--card);border:1.5px solid var(--bdr);border-radius:12px;padding:22px;margin-bottom:14px;position:relative;z-index:1}
.card-title{font-family:'Lora',serif;font-size:18px;font-weight:500;font-style:italic;margin-bottom:4px}
.card-sub{color:var(--txt2);font-size:13px;margin-bottom:18px;line-height:1.65}

/* ── PLANNING ── */
.planning-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
.plan-day{
  aspect-ratio:1;border-radius:6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'IBM Plex Mono',monospace;font-size:10px;
  cursor:pointer;border:1.5px solid var(--bdr);background:rgba(255,255,255,.02);
  transition:all .15s;-webkit-tap-highlight-color:transparent;
  position:relative;
}
.plan-day:hover{background:rgba(255,255,255,.06)}
.plan-day.done{border-color:transparent}
.plan-day.done::after{
  content:'✓';position:absolute;font-size:14px;
}
.plan-day-n{color:var(--txt2);font-size:9px}
.plan-day-h{font-size:13px;font-weight:500;color:var(--txt)}

.progress-bar-wrap{background:rgba(255,255,255,.06);border-radius:100px;height:10px;overflow:hidden;margin:8px 0}
.progress-bar{height:100%;border-radius:100px;transition:width .6s cubic-bezier(.34,1.2,.64,1)}

/* ── RESSOURCES ── */
.ressource-item{
  display:flex;align-items:flex-start;gap:14px;
  background:rgba(0,0,0,.2);border-radius:10px;padding:14px;
  margin-bottom:8px;border-left:3px solid transparent;
  transition:all .18s;cursor:pointer;
}
.ressource-item:hover{background:rgba(0,0,0,.3)}
.ressource-icon{font-size:22px;flex-shrink:0;margin-top:1px}
.ressource-titre{font-size:14px;font-weight:500;margin-bottom:3px}
.ressource-desc{font-size:12px;color:var(--txt2);line-height:1.6}
.ressource-tag{
  display:inline-block;padding:2px 8px;border-radius:4px;
  font-family:'IBM Plex Mono',monospace;font-size:9px;
  letter-spacing:1px;text-transform:uppercase;margin-top:6px;
}

/* ── AUTO-ÉVAL ── */
.competence-row{margin-bottom:14px}
.comp-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.comp-label{font-size:13px;font-weight:500}
.comp-val{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--txt2)}
.comp-slider{
  -webkit-appearance:none;width:100%;height:8px;
  border-radius:4px;background:rgba(255,255,255,.07);outline:none;cursor:pointer;
}
.comp-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;
  border-radius:50%;background:var(--em-current,var(--s1));
  cursor:pointer;border:2px solid rgba(255,255,255,.15);
  transition:transform .15s;
}
.comp-slider:active::-webkit-slider-thumb{transform:scale(1.2)}
.comp-desc{font-size:11px;color:var(--txt2);margin-top:4px;font-style:italic;line-height:1.5}

/* ── OBJECTIFS ── */
.obj-item{
  display:flex;gap:12px;align-items:flex-start;
  padding:12px 14px;border-radius:8px;margin-bottom:6px;
  background:rgba(255,255,255,.025);border:1px solid var(--bdr);
  transition:all .15s;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.obj-check{
  width:20px;height:20px;border-radius:4px;border:1.5px solid var(--bdr);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  margin-top:1px;transition:all .15s;font-size:12px;
}
.obj-item.done .obj-check{background:var(--em-current,var(--s1));border-color:transparent;color:#0d1117}
.obj-txt{font-size:13px;color:var(--txt2);line-height:1.6}
.obj-item.done .obj-txt{text-decoration:line-through;color:var(--txt3)}

/* ── INFO ── */
.info{border-radius:8px;padding:11px 14px;font-size:13px;line-height:1.75;margin-bottom:12px}
.info-blue {background:rgba(88,166,255,.07);border-left:3px solid rgba(88,166,255,.5);color:var(--s1)}
.info-green{background:rgba(63,185,80,.07); border-left:3px solid rgba(63,185,80,.5); color:var(--s2)}
.info-gold {background:rgba(210,153,34,.07); border-left:3px solid rgba(210,153,34,.5); color:var(--s3)}
.info-coral{background:rgba(224,112,96,.07); border-left:3px solid rgba(224,112,96,.5); color:var(--s4)}
.info-lav  {background:rgba(163,113,247,.07);border-left:3px solid rgba(163,113,247,.5);color:var(--s5)}
.info-sun  {background:rgba(240,192,64,.07); border-left:3px solid rgba(240,192,64,.5); color:var(--s6)}

/* ── BOUTONS ── */
.btn-p{
  border:none;border-radius:8px;color:#0d1117;
  font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;
  padding:12px 24px;cursor:pointer;transition:opacity .2s,transform .1s;
}
.btn-p:hover{opacity:.9;transform:translateY(-1px)}
.btn-g{
  background:rgba(255,255,255,.04);border:1.5px solid var(--bdr);
  border-radius:8px;color:var(--txt2);
  font-family:'IBM Plex Sans',sans-serif;font-size:13px;
  padding:10px 18px;cursor:pointer;transition:all .18s;
}
.btn-g:hover{background:rgba(255,255,255,.07);color:var(--txt)}
.btn-full{width:100%}
.nav-row{display:flex;gap:10px}
.nav-row>*{flex:1}
.col8{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── STAT ── */
.stat{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.05);border-radius:10px;padding:12px;text-align:center}
.stat-v{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:500;display:block}
.stat-l{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:1.5px;font-family:'IBM Plex Mono',monospace;display:block;margin-top:4px}

/* ── LOADING ── */
.dots{text-align:center;padding:24px 0}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 3px;animation:dotB 1.4s ease-in-out infinite both}
.dots span:nth-child(2){animation-delay:.16s}
.dots span:nth-child(3){animation-delay:.32s}
.dots-msg{font-size:13px;margin-top:10px;font-style:italic;color:var(--txt2)}
.analysis p{margin-bottom:14px;font-size:15px;line-height:1.85;color:#8090a0}
.analysis strong{color:var(--txt)}

/* ── PREMIUM ── */
.premium-box{background:rgba(0,0,0,.3);border:1.5px solid rgba(88,166,255,.15);border-radius:12px;padding:24px;margin-bottom:14px}
.apikey-box{background:rgba(88,166,255,.04);border:1px solid rgba(88,166,255,.12);border-radius:8px;padding:12px}
.apikey-box p{font-size:13px;color:var(--txt2);margin-bottom:10px;line-height:1.6}
.apikey-box a{color:var(--s1)}
.apikey-row{display:flex;gap:8px}
.apikey-row input{flex:1;padding:9px 12px;font-size:12px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);border-radius:6px;color:var(--txt);font-family:'IBM Plex Mono',monospace;outline:none}
.apikey-row input:focus{border-color:rgba(88,166,255,.3)}
.apikey-row button{padding:9px 14px;border:none;border-radius:6px;color:#0d1117;font-weight:700;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:12px}
.apikey-saved{color:var(--s2);font-size:11px;margin-top:5px;font-family:'IBM Plex Mono',monospace}

hr.div{border:none;border-top:1px solid rgba(255,255,255,.06);margin:16px 0}

/* ── WELCOME ── */
.welcome{text-align:center;padding:4px 0 20px}
.pts{display:flex;flex-direction:column;gap:10px;margin:18px 0;text-align:left}
.pt{display:flex;gap:12px;align-items:flex-start}
.pt-i{font-size:18px;flex-shrink:0;margin-top:2px}
.pt-t{font-size:14px;color:var(--txt2);line-height:1.65}
.pt-t strong{color:var(--txt)}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes dotB{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
.fadeup{animation:fadeUp .35s ease forwards}
@media(max-width:480px){.grid2{grid-template-columns:1fr}.nav-row{flex-direction:column}.planning-grid{grid-template-columns:repeat(5,1fr)}}
</style>
</head>

const STORE_KEY = 'simtaca_theo';

function loadStore(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY))||{}; } catch(e){ return {}; }
}
function saveStore(data){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch(e){}
}

let STORE = loadStore();

function getHdone(sem){ return STORE[`h_done_${sem}`]||0; }
function setHdone(sem, v){ STORE[`h_done_${sem}`]=v; saveStore(STORE); }
function getObjDone(sem){ return STORE[`obj_done_${sem}`]||[]; }
function toggleObj(sem, i){
  const arr = getObjDone(sem);
  const idx = arr.indexOf(i);
  if(idx>=0) arr.splice(idx,1); else arr.push(i);
  STORE[`obj_done_${sem}`]=arr; saveStore(STORE);
}
function getComp(sem, key){ return STORE[`comp_${sem}_${key}`]||0; }
function setComp(sem, key, v){ STORE[`comp_${sem}_${key}`]=v; saveStore(STORE); }

//  UTILS

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function renderMd(text){
  return text.split('\n\n').filter(p=>p.trim()).map(para=>{
    const parts=para.split(/\*\*([^*]+)\*\*/g);
    const inner=parts.map((p,i)=>i%2===1?`<strong>${esc(p)}</strong>`:esc(p)).join('');
    return `<p>${inner}</p>`;
  }).join('');
}

function semCouleur(){ return semObj().couleur; }

            <div style="font-family:'Lora',serif;font-size:18px;font-style:italic;color:var(--txt);margin-bottom:5px">Accompagnement IA — Accès Premium</div>
            <div style="font-size:13px;color:var(--txt2)">Planning, objectifs, ressources et compétences sont entièrement gratuits</div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px">
            ${[
              {who:'Module seul', price:'4,99€', desc:'PraxisTACA·Théorie à vie'},
              {who:'Suite complète', price:'12,99€', desc:'12 modules + TACA à vie', em:true},
              {who:'Institution', price:'Devis', desc:'IFSI · Syndicat'},
            ].map(t=>`<div style="border:1.5px solid ${t.em?couleur+'50':'var(--bdr)'};border-radius:10px;padding:14px;text-align:center;background:${t.em?couleur+'08':'rgba(255,255,255,.02)'}">
              <div style="font-size:10px;font-family:'IBM Plex Mono',monospace;color:${t.em?couleur:'var(--txt2)'};margin-bottom:8px;letter-spacing:1px">${t.who}</div>
              <div style="font-size:22px;font-weight:700;color:var(--txt);font-family:'Lora',serif">${t.price}</div>
              <div style="font-size:11px;color:var(--txt2);margin-top:5px">${t.desc}</div>
            </div>`).join('')}
          </div>
          <div style="text-align:center;margin-bottom:10px">
            <a href="mailto:contact@praxiscare.fr" style="display:inline-block;padding:11px 26px;border-radius:8px;background:${couleur};color:#0d1117;font-weight:700;font-size:14px;text-decoration:none">Obtenir l'accès →</a>
          </div>
          <div style="text-align:center;padding-top:10px;border-top:1px solid rgba(255,255,255,.05)">
            <button onclick="S.showKey=!S.showKey;render()" style="background:none;border:none;color:var(--txt2);font-size:11px;cursor:pointer;font-family:'IBM Plex Mono',monospace">🔑 Espace formateur</button>
          </div>
          ${S.showKey?`<div class="apikey-box" style="margin-top:12px">
            <p>Clé API Anthropic — formateur. <a href="https://console.anthropic.com/" target="_blank">Obtenir →</a></p>
            <div class="apikey-row">
              <input type="text" placeholder="sk-ant-api03-…" value="${esc(S.apiKey)}" oninput="S.apiKey=this.value">
              <button style="background:${couleur};color:#0d1117" onclick="saveKey()">Sauver</button>
            </div>
            ${S.apiKeySaved?'<div class="apikey-saved">✓ Clé enregistrée</div>':''}
          </div>`:''}
        </div>
      </div>`;
    }

    h+=`<div style="margin-top:12px"><button class="btn-g" onclick="go('welcome')" style="color:${couleur};border-color:${couleur}30">← Accueil PraxisTACA</button></div>`;
  }

  h+='</div>';
  document.getElementById('app').innerHTML = h;
}

// ═══════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════
function go(v){ S.view=v; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function setSem(n){ S.sem=n; S.analyse=''; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function setOnglet(o){ S.onglet=o; S.analyse=''; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function addH(v){
  const sem = semObj();
  const curr = getHdone(S.sem);
  setHdone(S.sem, Math.min(sem.heures, curr + v));
  render();
}
function resetH(){ setHdone(S.sem, 0); render(); }
function toggleObjAction(i){ toggleObj(S.sem, i); render(); }
function setCompAction(key, v){ setComp(S.sem, key, v); render(); }
function saveKey(){ localStorage.setItem('simtaca_key', S.apiKey); S.apiKeySaved=true; render(); }

// ═══════════════════════════════════════
//  API CLAUDE
// ═══════════════════════════════════════
async function runAnalyse(){
  const q = document.getElementById('question-taca')?.value || '';
  if(!q.trim()) return;
  const sem = semObj();
  const hdone = getHdone(S.sem);
  const objDone = getObjDone(S.sem);

  S.loading=true; S.analyse=''; render();
  try{
    const headers={'Content-Type':'application/json'};
    if(S.apiKey){headers['x-api-key']=S.apiKey;headers['anthropic-version']='2023-06-01';}
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST', headers,
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514', max_tokens:900,
        messages:[{role:'user', content:`Tu es un formateur IFSI expert en pédagogie infirmière, spécialiste du TACA (Temps d'Appropriation des Connaissances Acquises) du référentiel 2026. Tu accompagnes un étudiant infirmier dans son travail personnel en autonomie.

Contexte étudiant :
- Semestre actuel : S${S.sem} — posture "${sem.posture} · ${sem.titre}"
- Heures TACA réalisées ce semestre : ${hdone}h / ${sem.heures}h
- Objectifs validés : ${objDone.length} / ${sem.objectifs.length}

Question de l'étudiant : ${q}

Réponds de façon bienveillante et pédagogique en 3 paragraphes maximum. Tutoie l'étudiant. Propose des méthodes concrètes adaptées à sa posture "${sem.posture}". Encourage sans être condescendant. Si pertinent, rappelle-lui les ressources PraxisCare disponibles pour son semestre. Utilise **gras** pour les termes clés.`}]
      })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error.message);
    S.analyse = data.content?.find(b=>b.type==='text')?.text||'';
  }catch(e){
    S.analyse=`**Erreur**\n\n${e.message}`;
  }
  S.loading=false; render();
}

render();
</script>
  <!-- PraxisCare Stats -->
  <script src="praxiscare-stats.js"></script>
  <script>PraxisStats.init('simtacath');</script>
</body>
