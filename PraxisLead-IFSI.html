<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PraxisLead · Outil pédagogique IFSI</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Mulish:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet">
.btn-audio{position:fixed;bottom:16px;right:16px;background:var(--em);color:#1a1408;padding:10px 18px;border-radius:24px;font-size:13px;font-weight:700;cursor:pointer;z-index:1000;box-shadow:0 4px 16px rgba(0,0,0,.4);}
  <style>
:root{
  --bg:    #0a0c10;
  --bg2:   #111318;
  --card:  rgba(255,255,255,.03);
  --bdr:   rgba(255,255,255,.07);
  --txt:   #e8ecf4;
  --txt2:  #8894b4;
  --txt3:  #8c98b8;
  --em:    #f0a030;
  --em2:   #c07818;
  --steel: #4080c0;
  --mint:  #40c090;
  --rose:  #d06080;
  --lav:   #9070d0;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Mulish',sans-serif;
  background:var(--bg);color:var(--txt);
  min-height:100vh;padding-bottom:80px;overflow-x:hidden;position:relative;
}

/* Fond réseau — connexions interpro */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 20% 30%, rgba(240,160,48,.06) 0%,transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(64,128,192,.05) 0%,transparent 40%),
    radial-gradient(circle at 50% 10%, rgba(64,192,144,.03) 0%,transparent 35%);
}
/* Lignes diagonales leadership */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:repeating-linear-gradient(
    -45deg,
    rgba(240,160,48,.015) 0px, rgba(240,160,48,.015) 1px,
    transparent 1px, transparent 60px
  );
}

.wrap{max-width:720px;margin:0 auto;padding:0 20px;position:relative;z-index:1}

/* ── HEADER ── */
.site-header{padding:44px 24px 28px;text-align:center;position:relative;z-index:1}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(240,160,48,.08);border:1px solid rgba(240,160,48,.25);
  color:var(--em);padding:5px 18px;border-radius:2px;
  font-family:'Fira Mono',monospace;font-size:11px;
  letter-spacing:3px;text-transform:uppercase;margin-bottom:18px;
}
.site-header h1{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(52px,10vw,96px);letter-spacing:4px;
  line-height:.95;color:var(--txt);margin-bottom:10px;
}
.site-header h1 span{color:var(--em)}
.site-header p{color:var(--txt2);font-size:13px;letter-spacing:.5px}

/* ── ONGLETS ── */
.tabs{display:flex;gap:4px;padding:0 0 20px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{
  padding:8px 16px;border-radius:2px;
  border:1.5px solid var(--bdr);background:rgba(255,255,255,.02);
  color:var(--txt2);font-size:13px;font-weight:600;cursor:pointer;
  white-space:nowrap;transition:all .18s;font-family:'Mulish',sans-serif;
  letter-spacing:.5px;-webkit-tap-highlight-color:transparent;
}
.tab:hover{color:var(--txt);background:rgba(255,255,255,.04)}
.tab.active{background:rgba(240,160,48,.1);border-color:rgba(240,160,48,.4);color:var(--em)}

/* ── CARD ── */
.card{background:var(--card);border:1.5px solid var(--bdr);border-radius:4px;padding:24px;margin-bottom:14px;position:relative;z-index:1}
.card.gold{border-top:2px solid var(--em)}
.card.steel{border-top:2px solid var(--steel)}
.card.mint{border-top:2px solid var(--mint)}
.card.rose{border-top:2px solid var(--rose)}
.card-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;margin-bottom:5px;line-height:1}
.card-sub{color:var(--txt2);font-size:13px;margin-bottom:20px;line-height:1.65}

/* ── SBAR ── */
.sbar-block{
  border-radius:4px;padding:16px;margin-bottom:8px;
  position:relative;overflow:hidden;
}
.sbar-block::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
}
.sbar-letter{
  font-family:'Bebas Neue',sans-serif;font-size:48px;
  line-height:1;opacity:.15;position:absolute;right:16px;top:50%;
  transform:translateY(-50%);
}
.sbar-titre{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;margin-bottom:6px}
.sbar-q{font-size:12px;color:var(--txt2);font-style:italic;margin-bottom:8px;line-height:1.6}
.sbar-area{
  width:100%;border-radius:3px;padding:10px 12px;
  background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.07);
  color:var(--txt);font-size:13px;font-family:'Mulish',sans-serif;
  outline:none;resize:vertical;min-height:55px;line-height:1.65;
  transition:border-color .2s;
}
.sbar-area:focus{border-color:rgba(240,160,48,.3)}

/* ── RÔLES INTER-PRO ── */
.pro-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pro-card{
  background:rgba(0,0,0,.2);border:1.5px solid var(--bdr);
  border-radius:4px;padding:16px;cursor:pointer;transition:all .2s;
  -webkit-tap-highlight-color:transparent;
}
.pro-card:hover{background:rgba(0,0,0,.35);transform:translateY(-2px)}
.pro-card.active{border-color:var(--em);background:rgba(240,160,48,.07)}
.pro-icon{font-size:28px;margin-bottom:8px;display:block}
.pro-titre{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1.5px;margin-bottom:4px}
.pro-role{font-size:12px;color:var(--txt2);line-height:1.6}
.pro-detail{
  font-size:12px;color:var(--txt2);line-height:1.7;
  display:none;margin-top:10px;padding-top:10px;
  border-top:1px solid rgba(255,255,255,.06);
}
.pro-card.active .pro-detail{display:block}

/* ── SCENARIOS ── */
.scenario-card{
  background:rgba(0,0,0,.25);border-radius:4px;padding:18px;
  margin-bottom:10px;border-left:3px solid var(--em);
  cursor:pointer;transition:all .2s;
}
.scenario-card:hover{background:rgba(0,0,0,.35)}
.scenario-titre{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1.5px;margin-bottom:5px}
.scenario-body{font-size:13px;color:var(--txt2);line-height:1.7;display:none;margin-top:10px}
.scenario-card.open .scenario-body{display:block}
.scenario-tag{
  display:inline-block;padding:2px 10px;border-radius:2px;
  font-family:'Fira Mono',monospace;font-size:9px;
  letter-spacing:2px;text-transform:uppercase;margin-top:8px;
}

/* ── QUIZ ── */
.quiz-opt{
  padding:12px 16px;border-radius:4px;border:1.5px solid var(--bdr);
  background:rgba(255,255,255,.02);color:var(--txt2);
  cursor:pointer;font-size:14px;margin-bottom:8px;
  transition:all .18s;display:flex;align-items:center;gap:12px;
  -webkit-tap-highlight-color:transparent;
}
.quiz-opt:hover{background:rgba(255,255,255,.05);color:var(--txt)}
.quiz-opt.correct{background:rgba(64,192,144,.1);border-color:rgba(64,192,144,.4);color:var(--mint)}
.quiz-opt.wrong  {background:rgba(208,96,128,.1); border-color:rgba(208,96,128,.4); color:var(--rose)}
.quiz-expl{
  background:rgba(240,160,48,.05);border:1px solid rgba(240,160,48,.15);
  border-radius:4px;padding:12px 14px;margin-top:10px;
  font-size:13px;color:var(--txt2);line-height:1.7;
}
.quiz-expl strong{color:var(--txt)}

/* ── INFO ── */
.info{border-radius:3px;padding:12px 15px;font-size:13px;line-height:1.75;margin-bottom:12px}
.info-em   {background:rgba(240,160,48,.07); border-left:3px solid rgba(240,160,48,.6);  color:var(--em)}
.info-steel{background:rgba(64,128,192,.07); border-left:3px solid rgba(64,128,192,.6);  color:var(--steel)}
.info-mint {background:rgba(64,192,144,.07); border-left:3px solid rgba(64,192,144,.6);  color:var(--mint)}
.info-rose {background:rgba(208,96,128,.07); border-left:3px solid rgba(208,96,128,.6);  color:var(--rose)}

/* ── BOUTONS ── */
.btn-p{
  background:linear-gradient(135deg,var(--em2),var(--em));
  border:none;border-radius:3px;color:#0a0c10;
  font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;
  padding:13px 28px;cursor:pointer;transition:opacity .2s,transform .1s;
}
.btn-p:hover{opacity:.9;transform:translateY(-1px)}
.btn-g{
  background:rgba(255,255,255,.03);border:1.5px solid var(--bdr);
  border-radius:3px;color:var(--txt2);
  font-family:'Mulish',sans-serif;font-size:13px;font-weight:600;
  padding:10px 18px;cursor:pointer;transition:all .18s;
}
.btn-g:hover{background:rgba(255,255,255,.06);color:var(--txt)}
.btn-full{width:100%}
.nav-row{display:flex;gap:10px}
.nav-row>*{flex:1}
.col8{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── STAT ── */
.stat{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.06);border-radius:3px;padding:14px;text-align:center}
.stat-v{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--em);display:block;letter-spacing:2px;line-height:1}
.stat-l{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:2px;font-family:'Fira Mono',monospace;display:block;margin-top:4px}

/* ── PROGRESS ── */
.progress-bar-wrap{background:rgba(255,255,255,.06);border-radius:2px;height:8px;overflow:hidden;margin:6px 0}
.progress-bar{height:100%;border-radius:2px;transition:width .6s ease}

/* ── LOADING ── */
.dots{text-align:center;padding:24px 0}
.dots span{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--em);margin:0 3px;animation:dotB 1.4s ease-in-out infinite both}
.dots span:nth-child(2){animation-delay:.16s}
.dots span:nth-child(3){animation-delay:.32s}
.dots-msg{color:var(--txt2);font-size:13px;margin-top:10px;font-style:italic}
.analysis p{margin-bottom:14px;color:#8090b0;font-size:15px;line-height:1.85}
.analysis strong{color:var(--txt)}

/* ── PREMIUM ── */
.premium-box{background:rgba(0,0,0,.3);border:1.5px solid rgba(240,160,48,.15);border-radius:4px;padding:24px;margin-bottom:14px}
.apikey-box{background:rgba(240,160,48,.04);border:1px solid rgba(240,160,48,.12);border-radius:3px;padding:12px}
.apikey-box p{font-size:13px;color:var(--txt2);margin-bottom:10px;line-height:1.6}
.apikey-box a{color:var(--em)}
.apikey-row{display:flex;gap:8px}
.apikey-row input{flex:1;padding:9px 12px;font-size:12px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);border-radius:3px;color:var(--txt);font-family:'Fira Mono',monospace;outline:none}
.apikey-row input:focus{border-color:rgba(240,160,48,.3)}
.apikey-row button{padding:9px 14px;border:none;border-radius:3px;background:var(--em2);color:#0a0c10;font-weight:700;cursor:pointer;font-family:'Mulish',sans-serif;font-size:12px}
.apikey-saved{color:var(--mint);font-size:11px;margin-top:5px;font-family:'Fira Mono',monospace}

hr.div{border:none;border-top:1px solid rgba(255,255,255,.06);margin:16px 0}

/* ── WELCOME ── */
.pts{display:flex;flex-direction:column;gap:12px;margin:20px 0;text-align:left}
.pt{display:flex;gap:14px;align-items:flex-start}
.pt-i{font-size:22px;flex-shrink:0;margin-top:1px}
.pt-t{font-size:14px;color:var(--txt2);line-height:1.65}
.pt-t strong{color:var(--txt)}

/* ── RÉSEAU INTER-PRO SVG ── */
.reseau-svg{display:block;margin:0 auto;max-width:340px}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes dotB{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
.fadeup{animation:fadeUp .35s ease forwards}
@media(max-width:480px){.grid2,.pro-grid{grid-template-columns:1fr}.nav-row{flex-direction:column}}
</style>
</head>
<body>
<div id="app"></div>
<button class="btn-audio" id="btn-audio" onclick="lireOnglet()">🔊 Écouter</button>
<script>

// ═══════════════════════════════════════
//  DONNÉES
// ═══════════════════════════════════════

const PROS = [
  { id:'medecin', icon:'👨‍⚕️', titre:'MÉDECIN', couleur:'#4080c0',
    role:'Prescrit, diagnostique, oriente. L\'IDE est son relais clinique au quotidien.',
    collab:'Communication SBAR en cas de dégradation. Appel structuré : "Dr X, c\'est l\'IDE Dupont, j\'appelle pour M. Martin, 68 ans, dont la PA est tombée à 80/50." Traçabilité systématique des échanges.',
    outil:'SBAR · Transmissions SAED · Appel de nuit structuré'},
  { id:'as', icon:'🧹', titre:'AIDE-SOIGNANT(E)', couleur:'#f0a030',
    role:'Partenaire de soins directs. L\'IDE délègue, supervise, évalue — jamais n\'abandonne.',
    collab:'Délégation claire et encadrée. "Je te délègue la toilette de M. Dupont — surveille son œdème au mollet droit et reviens me voir après." Vérification du résultat. Valorisation du travail.',
    outil:'Délégation QQOCCP · Transmissions ciblées · Débrief'},
  { id:'kine', icon:'🏃', titre:'KINÉSITHÉRAPEUTE', couleur:'#40c090',
    role:'Partenaire de la réhabilitation. L\'IDE coordonne les soins autour des séances de kiné.',
    collab:'Planifier les soins douloureux AVANT la kiné (antalgiques). Partager les évaluations de douleur et de mobilité. Communiquer les contre-indications ou précautions (fracture, plaie, constantes).',
    outil:'Plan de soins coordonné · EVA partagée · Dossier patient commun'},
  { id:'pharma', icon:'💊', titre:'PHARMACIEN', couleur:'#9070d0',
    role:'Expert du médicament. L\'IDE l\'associe pour tout doute sur un traitement ou une interaction.',
    collab:'Signaler toute suspicion d\'interaction médicamenteuse. Valider les dilutions de médicaments injectables. Déclarer les événements indésirables médicamenteux. Ne jamais hésiter à appeler.',
    outil:'Circuit du médicament · REMED · Déclaration ANSM'},
  { id:'ss', icon:'👥', titre:'ASSISTANTE SOCIALE', couleur:'#d06080',
    role:'Partenaire du retour à domicile et de la coordination du parcours social.',
    collab:'Signalement précoce des situations de vulnérabilité (isolement, précarité, maltraitance). Participation aux réunions de synthèse. Anticipation des besoins post-hospitalisation.',
    outil:'Évaluation sociale · HAD · Réunion pluridisciplinaire'},
  { id:'psy', icon:'🧠', titre:'PSYCHOLOGUE / PSYCHIATRE', couleur:'#a371f7',
    role:'Partenaire de la santé mentale. L\'IDE est souvent le premier à repérer une détresse.',
    collab:'Transmission précise des observations comportementales. Utiliser un vocabulaire factuel et non interprétatif. "Le patient a pleuré pendant 20 min, a refusé de manger, et m\'a dit qu\'il ne voyait plus l\'intérêt de se battre."',
    outil:'Observation clinique · Grille RUD si risque suicidaire · Liaison psy'},
];

const SBAR_SESSIONS = [
  'simcase_sbar_s1', 'simcase_sbar_s2', 'simcase_sbar_s3',
];

const SCENARIOS = [
  {
    id:'urgence', couleur:'var(--rose)',
    titre:'Appel nocturne — M. Leroy dégrade',
    context:'Il est 3h du matin. M. Leroy, 72 ans, hospitalisé pour insuffisance cardiaque, présente une SpO₂ à 88%, une FR à 28/min, une orthopnée. Il n\'a pas uriné depuis 8h. Vous devez appeler le médecin de garde.',
    question:'Rédigez votre appel SBAR au médecin de garde.',
    sbar:{
      S:'Situation — Qui êtes-vous ? Qui est le patient ? Quel est le problème urgent ?',
      B:'Background — Quel est le contexte clinique pertinent ?',
      A:'Assessment — Quelle est votre évaluation infirmière ?',
      R:'Recommendation — Que demandez-vous concrètement ?',
    },
    exemple:{
      S:'"Bonsoir Dr Martin, je suis Dupont, IDE de nuit en cardiologie. M. Leroy, 72 ans, chambre 14, insuffisant cardiaque connu, présente une détresse respiratoire aiguë."',
      B:'"Il est hospitalisé depuis 3 jours pour poussée d\'OAP. Sous furosémide IV. Ce soir : SpO₂ 88% sous 2L O₂, FR 28/min, orthopnée. Anurie depuis 8h."',
      A:'"Je pense à une nouvelle poussée d\'OAP — signes de surcharge. Son état se dégrade rapidement."',
      R:'"Je vous demande de venir l\'évaluer maintenant. En attendant, j\'ai mis le patient en position assise haute et augmenté l\'O₂ à 4L."',
    },
    tag:'SBAR · Urgence',
  },
  {
    id:'delegation', couleur:'var(--em)',
    titre:'Délégation à l\'aide-soignant(e)',
    context:'Vous avez 8 patients en charge cette matinée. Vous travaillez avec Julie, AS expérimentée. Vous devez organiser les soins d\'hygiène et de confort en délégant de façon claire et sécurisée.',
    question:'Comment organisez-vous et communiquez-vous la délégation à Julie ?',
    sbar:{
      S:'Quoi — Quelle tâche exactement délégues-tu ?',
      B:'Qui et pourquoi — Pour quel patient ? Quelles précautions spécifiques ?',
      A:'Comment — Y a-t-il des observations particulières à faire ?',
      R:'Retour — Quand et comment Julie doit-elle te rendre compte ?',
    },
    exemple:{
      S:'"Julie, je te délègue la toilette complète de M. Bernard (ch. 8) et Mme Petit (ch. 12)."',
      B:'"M. Bernard a une plaie opératoire au genou droit — ne pas mouiller le pansement. Mme Petit est algique — propose-lui l\'antalgique avant de commencer."',
      A:'"Pour M. Bernard, surveille la coloration de son pied droit — il a une artériopathie. Note aussi s\'il est plus confus qu\'hier."',
      R:'"Reviens me voir après Mme Petit — je passerai évaluer M. Bernard avec toi vers 10h."',
    },
    tag:'Délégation · AS',
  },
  {
    id:'pluridis', couleur:'var(--steel)',
    titre:'Réunion de synthèse pluridisciplinaire',
    context:'Réunion hebdomadaire de l\'équipe. Vous présentez Mme Chen, 84 ans, hospitalisée depuis 10 jours pour fracture du col du fémur opérée. Retour à domicile prévu la semaine prochaine. Vous avez 3 minutes.',
    question:'Structurez votre présentation pour que chaque professionnel puisse agir.',
    sbar:{
      S:'Situation actuelle — Où en est Mme Chen aujourd\'hui ?',
      B:'Contexte social et clinique — Ce que l\'équipe doit savoir',
      A:'Évaluation infirmière — Vos observations et préoccupations',
      R:'Coordination — Ce que vous attendez de chaque professionnel',
    },
    exemple:{
      S:'"Mme Chen, 84 ans, J10 post-PTH droite. Mobilisation avec déambulateur, douleur contrôlée à 3/10. Plaie propre."',
      B:'"Vit seule, 3ème étage sans ascenseur. Fils à Paris. Légère confusion nocturne persistante. Sous AVK — INR à surveiller."',
      A:'"Je suis préoccupée par le retour à domicile : autonomie insuffisante pour les escaliers. Risque de chute. Observance AVK incertaine."',
      R:'"Kiné : évaluation réelle des capacités à monter 3 étages. AS sociale : HAD ou SSR ? Médecin : relais AVK en ville. IDE : éducation au traitement anticoagulant."',
    },
    tag:'Pluridisciplinaire · Coordination',
  },
];

const QUIZ = [
  { q:'Que signifie l\'acronyme SBAR ?', opts:['Situation, Bilan, Analyse, Résolution','Situation, Background, Assessment, Recommendation','Symptômes, Bilan, Antécédents, Résultat','Soins, Bilan, Action, Rapport'], rep:1,
    expl:'**SBAR** (Situation, Background, Assessment, Recommendation) est l\'outil de communication structurée de référence en santé. Il permet de transmettre une information critique de façon claire et complète, quel que soit l\'interlocuteur — médecin, pharmacien, collègue IDE.' },
  { q:'Lors d\'une délégation à l\'aide-soignant(e), l\'IDE doit :', opts:['Déléguer et ne pas intervenir pour ne pas dévaloriser le travail de l\'AS','Déléguer, préciser les précautions, et vérifier le résultat','Uniquement déléguer les tâches non techniques','Déléguer uniquement si l\'AS a demandé explicitement la tâche'], rep:1,
    expl:'La **délégation infirmière** est un acte professionnel complet : on délègue clairement (quoi, à qui, avec quelles précautions), puis on vérifie le résultat. L\'IDE reste responsable de la qualité du soin délégué — déléguer n\'est pas abandonner.' },
  { q:'Le leadership infirmier, selon le référentiel 2026, consiste à :', opts:['Diriger les médecins en cas d\'urgence','Prendre des décisions médicales en autonomie','Accompagner les personnes et les équipes vers des objectifs de santé','Remplacer les cadres de santé dans l\'organisation du service'], rep:2,

const STORE_KEY = 'simlead';
function loadStore(){ try{return JSON.parse(localStorage.getItem(STORE_KEY))||{};}catch(e){return {};} }
function saveStore(d){ try{localStorage.setItem(STORE_KEY,JSON.stringify(d));}catch(e){} }
let STORE = loadStore();

function getSBAR(scenId, partie){ return STORE[`sbar_${scenId}_${partie}`]||''; }
function setSBAR(scenId, partie, v){ STORE[`sbar_${scenId}_${partie}`]=v; saveStore(STORE); }

  apiKeySaved: !!localStorage.getItem('simlead_key'),

// ═══════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function renderMd(text){
  return text.split('\n\n').filter(p=>p.trim()).map(para=>{
    const parts=para.split(/\*\*([^*]+)\*\*/g);
    const inner=parts.map((p,i)=>i%2===1?`<strong>${esc(p)}</strong>`:esc(p)).join('');
    return `<p>${inner}</p>`;
  }).join('');
}

// ═══════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════
var _lecture = false;
function meilleureVoixFr(){
  var voix = speechSynthesis.getVoices().filter(function(v){ return v.lang && v.lang.toLowerCase().indexOf('fr') === 0; });
  if(voix.length === 0) return null;
  var bonsNoms = ['amélie','audrey','thomas','daniel'];
  var meilleure = voix.find(function(v){ return /enhanced|premium|neural/i.test(v.name); });
  if(!meilleure){
    meilleure = voix.find(function(v){ var n=v.name.toLowerCase(); return bonsNoms.some(function(bn){ return n.indexOf(bn)!==-1; }); });
  }
  return meilleure || voix[0];
}
function lireOnglet(){
  if(_lecture){ stopLecture(); return; }
  if(!('speechSynthesis' in window)){ alert('Lecture audio non disponible sur ce navigateur.'); return; }
  var textes = [];
  document.querySelectorAll('#app .card-title, #app .card-sub, #app .info, #app .stat-v, #app .stat-l, #app .pro-titre, #app .pro-role, #app .pro-detail, #app .sbar-titre, #app .sbar-q, #app .scenario-titre, #app .scenario-body, #app .quiz-opt, #app .quiz-expl').forEach(function(el){
    var t = el.innerText.trim();
    if(t.length > 2) textes.push(t);
  });
  if(textes.length === 0) return;
  _lecture = true;
  document.getElementById('btn-audio').textContent = '⏹ Stop';
  var voixChoisie = meilleureVoixFr();
  var i = 0;
  function suivante(){
    if(!_lecture || i >= textes.length){ stopLecture(); return; }
    var u = new SpeechSynthesisUtterance(textes[i++]);
    u.lang = 'fr-FR';
    u.rate = 0.9;
    if(voixChoisie) u.voice = voixChoisie;
    u.onend = suivante;
    u.onerror = suivante;
    speechSynthesis.speak(u);
  }
  speechSynthesis.cancel();
  setTimeout(suivante, 50);
}
function stopLecture(){
  _lecture = false;
  if('speechSynthesis' in window) speechSynthesis.cancel();
  var btn = document.getElementById('btn-audio');
  if(btn) btn.textContent = '🔊 Écouter';
}
  function go(v){ stopLecture(); S.view=v; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function setOnglet(o){ stopLecture(); S.onglet=o; S.analyse=''; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function togglePro(id){ S.proActive=S.proActive===id?null:id; render(); }
function toggleScen(id){
  if(S.scenOpen===id){ S.scenOpen=null; S.scenExemple=null; }
  else { S.scenOpen=id; S.scenExemple=null; }
  render();
}
function setSBARAction(scenId, partie, v){ setSBAR(scenId, partie, v); }
function selectQuiz(i){
  if(S.quizShown) return;
  S.quizSelected=i; S.quizShown=true;
  S.quizTotal++;
  if(i===QUIZ[S.quizIdx%QUIZ.length].rep) S.quizScore++;
  render();
}
function nextQuiz(){ S.quizIdx++; S.quizSelected=null; S.quizShown=false; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function saveKey(){ localStorage.setItem('simlead_key',S.apiKey); S.apiKeySaved=true; render(); }

// ═══════════════════════════════════════
//  API CLAUDE
// ═══════════════════════════════════════
async function runAnalyse(){
  const q = document.getElementById('question-lead')?.value||'';
  if(!q.trim()) return;
  S.loading=true; S.analyse=''; render();
  try{
    const headers={'Content-Type':'application/json'};
    if(S.apiKey){headers['x-api-key']=S.apiKey;headers['anthropic-version']='2023-06-01';}
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers,
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',max_tokens:900,
        messages:[{role:'user',content:`Tu es un formateur IFSI expert en leadership infirmier et communication interprofessionnelle, spécialiste du Domaine D du référentiel 2026. Un étudiant infirmier te soumet une situation de leadership ou de communication interprofessionnelle.

Situation soumise : ${q}

Réponds en 3-4 paragraphes. Structure ta réponse :
1. Analyse de la situation — ce qui se passe réellement
2. Outils concrets — SBAR, délégation, techniques de communication
3. Ce que tu recommandes concrètement pour progresser

Tutoie l'étudiant. Sois direct et pratique — le leadership s'apprend par l'expérience, pas la théorie. Si pertinent, propose une formulation concrète à utiliser. Utilise **gras** pour les points clés.`}]
      })
    });
    const data=await res.json();
    if(data.error) throw new Error(data.error.message);
    S.analyse=data.content?.find(b=>b.type==='text')?.text||'';
  }catch(e){S.analyse=`**Erreur**\n\n${e.message}`;}
  S.loading=false; render();
}

render();
