<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimRévision · Outil pédagogique IFSI</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800&family=Karla:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0d1a;--bg2:#17142a;--card:rgba(255,255,255,.04);--bdr:rgba(255,255,255,.08);
--txt:#e2d8f8;--txt2:#6050a0;--a1:#6090f8;--a2:#f06080;--a3:#40c8a8;
--em:#a080f8;--em2:#7050d0;--lime:#80e860;--warn:#f0b040;
--mono:'Fira Mono',monospace;--sans:'Karla',sans-serif;--head:'Unbounded',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:80px;overflow-x:hidden;position:relative}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(160,128,248,.08) 0%,transparent 60%),radial-gradient(ellipse 40% 30% at 90% 90%,rgba(64,200,168,.05) 0%,transparent 50%)}
.wrap{max-width:720px;margin:0 auto;padding:0 18px;position:relative;z-index:1}
.site-header{padding:40px 22px 24px;text-align:center;position:relative;z-index:1}
.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(160,128,248,.08);border:1px solid rgba(160,128,248,.22);color:var(--em);padding:4px 16px;border-radius:20px;font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px}
.site-header h1{font-family:var(--head);font-size:clamp(26px,5vw,48px);font-weight:800;letter-spacing:-2px;line-height:1;margin-bottom:8px}
.site-header h1 span{color:var(--em)}
.site-header p{color:var(--txt2);font-size:12px;font-family:var(--mono);letter-spacing:1px}
.annee-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.annee-btn{padding:20px 10px;border-radius:10px;border:2px solid var(--bdr);background:rgba(255,255,255,.02);cursor:pointer;text-align:center;transition:all .2s;-webkit-tap-highlight-color:transparent}
.annee-btn:hover{transform:translateY(-2px)}
.annee-icon{font-size:32px;display:block;margin-bottom:8px}
.annee-label{font-family:var(--head);font-size:13px;font-weight:700;letter-spacing:-0.5px;margin-bottom:4px}
.annee-ues{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--txt2);line-height:1.5}
.tabs{display:flex;gap:4px;padding:0 0 18px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:7px 14px;border-radius:20px;border:1.5px solid var(--bdr);background:rgba(255,255,255,.02);color:var(--txt2);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;font-family:var(--mono);letter-spacing:1px;-webkit-tap-highlight-color:transparent}
.tab:hover{color:var(--txt);background:rgba(160,128,248,.05)}
.tab.active{background:rgba(160,128,248,.12);border-color:rgba(160,128,248,.4);color:var(--em)}
.card{background:var(--card);border:1.5px solid var(--bdr);border-radius:12px;padding:22px;margin-bottom:12px;position:relative;z-index:1}
.card-title{font-family:var(--head);font-size:15px;font-weight:700;letter-spacing:-0.5px;margin-bottom:4px}
.card-sub{color:var(--txt2);font-size:12px;margin-bottom:16px;line-height:1.65}
.score-bar{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.score-label{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt2)}
.score-nums{font-family:var(--head);font-size:24px;font-weight:800;letter-spacing:-1px;margin-left:auto}
.progress-wrap{background:rgba(255,255,255,.07);border-radius:100px;height:8px;overflow:hidden;margin-bottom:14px}
.progress-bar{height:100%;border-radius:100px;transition:width .5s ease}
.qcm-card{background:rgba(0,0,0,.25);border-radius:10px;padding:20px;border:1.5px solid var(--bdr)}
.qcm-ue{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;padding:3px 10px;border-radius:20px;display:inline-block}
.qcm-q{font-size:16px;font-weight:600;line-height:1.5;margin-bottom:16px;color:var(--txt)}
.qcm-opts{display:flex;flex-direction:column;gap:7px}
.qcm-opt{padding:11px 14px;border-radius:8px;border:1.5px solid var(--bdr);background:rgba(255,255,255,.02);color:var(--txt2);cursor:pointer;font-size:13px;transition:all .15s;display:flex;align-items:center;gap:10px;-webkit-tap-highlight-color:transparent}
.qcm-opt:hover{background:rgba(160,128,248,.08);color:var(--txt)}
.qcm-opt.correct{background:rgba(128,232,96,.1);border-color:rgba(128,232,96,.4);color:var(--lime)}
.qcm-opt.wrong{background:rgba(240,96,128,.1);border-color:rgba(240,96,128,.4);color:var(--a2)}
.opt-letter{font-family:var(--mono);font-size:11px;flex-shrink:0;width:20px}
.qcm-expl{background:rgba(160,128,248,.06);border:1px solid rgba(160,128,248,.2);border-radius:8px;padding:12px 14px;margin-top:12px;font-size:12px;color:var(--txt2);line-height:1.7}
.qcm-expl strong{color:var(--txt)}
.qcm-nav{display:flex;gap:8px;margin-top:14px}
.qcm-nav>*{flex:1}
.cas-card{background:rgba(0,0,0,.2);border-radius:10px;padding:18px;margin-bottom:10px;border-left:3px solid var(--em)}
.cas-titre{font-family:var(--head);font-size:15px;font-weight:700;color:var(--em);margin-bottom:8px}
.cas-contexte{font-size:13px;color:var(--txt2);line-height:1.75;margin-bottom:12px;background:rgba(0,0,0,.2);border-radius:6px;padding:12px}
.cas-question{font-size:13px;font-weight:600;color:var(--txt);font-style:italic;margin-bottom:10px}
.cas-textarea{width:100%;min-height:60px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);border-radius:6px;color:var(--txt);padding:10px 12px;font-size:13px;font-family:var(--sans);outline:none;resize:vertical;line-height:1.6;transition:border-color .2s}
.cas-textarea:focus{border-color:rgba(160,128,248,.3)}
.cas-reponse{background:rgba(160,128,248,.06);border:1px solid rgba(160,128,248,.2);border-radius:8px;padding:12px 14px;margin-top:10px;font-size:12px;color:var(--txt2);line-height:1.7;display:none}
.cas-reponse strong{color:var(--txt)}
.cas-reponse.visible{display:block}
.fiche{border-radius:10px;padding:16px;margin-bottom:8px;cursor:pointer;transition:all .18s;-webkit-tap-highlight-color:transparent;border-left:3px solid transparent}
.fiche:hover{filter:brightness(1.1)}
.fiche-titre{font-family:var(--head);font-size:13px;font-weight:700;letter-spacing:-0.3px;margin-bottom:4px}
.fiche-body{font-size:12px;line-height:1.7;display:none;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.07);color:var(--txt2)}
.fiche.open .fiche-body{display:block}
.fiche-tag{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;padding:2px 8px;border-radius:20px;margin-bottom:6px;display:inline-block}
.btn-p{background:linear-gradient(135deg,var(--em2),var(--em));border:none;border-radius:8px;color:#fff;font-family:var(--head);font-size:13px;font-weight:700;padding:11px 22px;cursor:pointer;transition:opacity .2s,transform .1s;letter-spacing:-0.3px}
.btn-p:hover{opacity:.9;transform:translateY(-1px)}
.btn-g{background:rgba(255,255,255,.04);border:1.5px solid var(--bdr);border-radius:8px;color:var(--txt2);font-family:var(--sans);font-size:12px;font-weight:600;padding:9px 16px;cursor:pointer;transition:all .15s}
.btn-g:hover{background:rgba(160,128,248,.06);color:var(--txt)}
.btn-full{width:100%}
.info{border-radius:8px;padding:10px 13px;font-size:12px;line-height:1.75;margin-bottom:10px}
.info-em{background:rgba(160,128,248,.07);border-left:3px solid rgba(160,128,248,.5);color:var(--em)}
.dots{text-align:center;padding:22px 0}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--em);margin:0 3px;animation:dotB 1.4s ease-in-out infinite both}
.dots span:nth-child(2){animation-delay:.16s}.dots span:nth-child(3){animation-delay:.32s}
.dots-msg{color:var(--txt2);font-size:12px;margin-top:10px;font-style:italic}
.analysis p{margin-bottom:13px;font-size:14px;line-height:1.85;color:#7068a8}
.analysis strong{color:var(--txt)}
.apikey-box{background:rgba(160,128,248,.04);border:1px solid rgba(160,128,248,.12);border-radius:8px;padding:11px}
.apikey-box p{font-size:12px;color:var(--txt2);margin-bottom:9px;line-height:1.6}
.apikey-box a{color:var(--em)}
.apikey-row{display:flex;gap:6px}
.apikey-row input{flex:1;padding:8px 10px;font-size:11px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);border-radius:6px;color:var(--txt);font-family:var(--mono);outline:none}
.apikey-row input:focus{border-color:rgba(160,128,248,.3)}
.apikey-row button{padding:8px 12px;border:none;border-radius:6px;background:var(--em2);color:#fff;font-weight:700;cursor:pointer;font-size:11px}
hr.div{border:none;border-top:1px solid rgba(255,255,255,.06);margin:14px 0}
.promo-input{width:100%;padding:12px 16px;font-size:15px;background:rgba(255,255,255,.04);border:1.5px solid rgba(160,128,248,.2);border-radius:8px;color:var(--txt);font-family:var(--head);font-weight:600;outline:none;margin-bottom:10px;letter-spacing:-0.5px}
.promo-input:focus{border-color:rgba(160,128,248,.5)}
.pts{display:flex;flex-direction:column;gap:10px;margin:16px 0;text-align:left}
.pt{display:flex;gap:12px;align-items:flex-start}
.pt-i{font-size:18px;flex-shrink:0;margin-top:2px}
.pt-t{font-size:14px;color:var(--txt2);line-height:1.65}
.pt-t strong{color:var(--txt)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes dotB{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
.fadeup{animation:fadeUp .35s ease forwards}
@media(max-width:480px){.annee-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// QCM
var QCM={
  1:[
    {ue:"B.1",q:"Quelle est la valeur normale de la pression arterielle chez un adulte sain ?",opts:["90/60 mmHg","120/80 mmHg","140/90 mmHg","160/100 mmHg"],rep:1,expl:"La PA normale adulte est **120/80 mmHg**. Hypertension : 140/90 mmHg. Hypotension : PAS < 90 mmHg."},
    {ue:"B.1",q:"La frequence cardiaque normale d'un adulte au repos est de :",opts:["40-60 bpm","60-100 bpm","100-120 bpm","120-140 bpm"],rep:1,expl:"La FC normale adulte est **60-100 bpm**. Bradycardie < 60. Tachycardie > 100. Toujours noter le rythme."},
    {ue:"B.1",q:"Lequel N'EST PAS un signe d'hypoglycemie ?",opts:["Sueurs","Tremblements","Soif intense","Confusion"],rep:2,expl:"La **soif intense** est un signe d'hyperglycemie. L'hypoglycemie se manifeste par sueurs, tremblements, tachycardie, paleur, confusion."},
    {ue:"B.3",q:"La regle des 5B en administration medicamenteuse est :",opts:["Bon patient, Bon medicament, Bonne dose, Bonne voie, Bon moment","Bon patient, Bonne prescription, Bon flacon, Bonne posologie, Bonne duree","Bonne infirmiere, Bon medecin, Bon pharmacien, Bonne ordonnance, Bon suivi","Bon protocole, Bonne technique, Bon materiel, Bonne tracabilite, Bon resultat"],rep:0,expl:"Les **5B** : Bon patient, Bon medicament, Bonne dose, Bonne voie, Bon moment. A verifier AVANT toute administration."},
    {ue:"A.1",q:"La SpO2 cible chez un patient BPCO est de :",opts:["95-100%","92-95%","88-92%","80-85%"],rep:2,expl:"Chez le **BPCO**, cible SpO2 **88-92%**. Une hyperoxie peut supprimer le drive respiratoire hypoxique et provoquer une hypercapnie."},
    {ue:"B.1",q:"L'echelle de Glasgow evalue :",opts:["La douleur","La conscience","La saturation en O2","La pression arterielle"],rep:1,expl:"Le **score de Glasgow** evalue la **conscience** : Yeux (1-4) + Verbal (1-5) + Moteur (1-6). Max 15. GCS < 8 = coma."},
    {ue:"A.1",q:"Une solution isotonique a une osmolarite de :",opts:["< 280 mOsm/L","280-320 mOsm/L","320-400 mOsm/L","> 400 mOsm/L"],rep:1,expl:"Une solution **isotonique** a une osmolarite de **280-320 mOsm/L**. Le NaCl 0,9% est la reference."},
    {ue:"B.1",q:"La frequence respiratoire normale d'un adulte au repos est de :",opts:["8-12 /min","12-20 /min","20-30 /min","30-40 /min"],rep:1,expl:"La FR normale adulte est **12-20 /min**. C'est le parametre le plus predictif d'une degradation clinique."},
  ],
  2:[
    {ue:"C.2",q:"L'approche One Health signifie :",opts:["Un protocole de soin unique pour tous","La sante humaine, animale et environnementale sont interconnectees","Une seule infirmiere par chambre","Un dossier patient unique"],rep:1,expl:"**One Health** : la sante humaine est intimement liee a la sante animale et aux ecosystemes. 75% des maladies infectieuses emergentes sont des zoonoses."},
    {ue:"C.2",q:"Lors d'une vague de chaleur, le signe le plus preoccupant chez une personne agee est :",opts:["Une legere transpiration","Une peau chaude et SECHE","Une soif moderee","Un leger mal de tete"],rep:1,expl:"**Peau chaude et seche** = defaillance de la thermoregulation = **coup de chaleur**. Urgence vitale. La transpiration est normale et protectrice."},
    {ue:"B.3",q:"Pour une perfusion de NaCl 0,9% 500mL en 4h, le debit en mL/h est de :",opts:["75 mL/h","100 mL/h","125 mL/h","150 mL/h"],rep:2,expl:"**500 mL / 4h = 125 mL/h**. Debit (mL/h) = Volume / Duree. En gouttes/min : 125 x 20 / 60 = 42 gttes/min."},
    {ue:"B.3",q:"Le debit maximal recommande avec des lunettes nasales est de :",opts:["2 L/min","4 L/min","6 L/min","10 L/min"],rep:2,expl:"Lunettes nasales : maximum **6 L/min**. Au-dela la muqueuse nasale s'asseche. Pour debits plus eleves : masque simple (6-10L) ou haute concentration (10-15L)."},
    {ue:"B.1",q:"L'insuline lente Lantus a une duree d'action d'environ :",opts:["4-6 heures","8-12 heures","18-24 heures","Plus de 36 heures"],rep:2,expl:"La **Lantus** (glargine) est une insuline basale a action **18-24 heures**. 1 injection par jour. Ne JAMAIS melanger avec une autre insuline dans la meme seringue."},
    {ue:"B.3",q:"La contention veineuse de classe II correspond a une pression de :",opts:["10-15 mmHg","15-20 mmHg","20-36 mmHg","Plus de 36 mmHg"],rep:2,expl:"**Classe II : 20-36 mmHg**. I = 10-15 (legere), II = 20-36 (moderee), III = forte, IV = tres forte. Contre-indication absolue : AOMI severe."},
    {ue:"B.3",q:"Le score DOLOPLUS-2 est pathologique a partir de :",opts:["3/30","5/30","8/30","10/30"],rep:1,expl:"**DOLOPLUS-2** : pathologique des **5/30**. Evalue la douleur chez la personne agee non communicante. 10 items comportementaux sur 30."},
    {ue:"B.1",q:"Une kaliemie a 6,2 mmol/L est :",opts:["Hypokaliemie moderee","Valeur normale","Hyperkaliemie moderee","Hyperkaliemie severe"],rep:3,expl:"K+ normal : **3,5-5,0 mmol/L**. Hyperkaliemie severe > 6 mmol/L : **risque d'arythmie et d'arret cardiaque**. Signaler immediatement."},
  ],
  3:[
    {ue:"C.2",q:"Le secteur de la sante represente environ quelle part des emissions francaises de GES ?",opts:["1-2%","3-4%","7-8%","12-15%"],rep:2,expl:"Le secteur de la sante represente environ **7% des emissions francaises** de GES. Plan vert du systeme de sante : objectif -50% d'ici 2030."},
    {ue:"A.1",q:"La demarche clinique infirmiere comprend dans l'ordre :",opts:["Diagnostic, Recueil, Planification, Evaluation","Recueil, Analyse, Planification, Evaluation","Anamnese, Diagnostic, Soins, Bilan","Evaluation, Planification, Action, Recueil"],rep:1,expl:"Demarche clinique IDE : **Recueil** de donnees > **Analyse** et diagnostic infirmier > **Planification** > **Realisation** > **Evaluation**."},
    {ue:"A.2",q:"Le secret professionnel de l'IDE s'impose vis-a-vis de :",opts:["Le patient uniquement","Toute personne non impliquee dans le soin","Les membres de la famille uniquement","Les autres professionnels de sante"],rep:1,expl:"Le secret professionnel (art. L.1110-4 CSP) s'impose envers **toute personne non impliquee dans le soin**. Le partage est autorise dans l'equipe de soins."},
    {ue:"A.1",q:"La prevention des escarres passe en priorite par :",opts:["Les pansements hydrocolloides","La mobilisation et les changements de position","Les matelas anti-escarre uniquement","Les cremes et lotions protectrices"],rep:1,expl:"La **mobilisation et les changements de position** (toutes les 2-4h) sont la principale mesure preventive. Les matelas anti-escarre sont complementaires."},
    {ue:"A.1",q:"L'echelle de Braden evalue le risque d'escarre sur :",opts:["3 items","4 items","6 items","8 items"],rep:2,expl:"Braden : **6 items** : Perception sensorielle, Humidite, Activite, Mobilite, Nutrition, Friction/Cisaillement. Score 6-23. Risque eleve < 12."},
    {ue:"A.2",q:"La loi Claeys-Leonetti (2016) introduit le droit a :",opts:["L'euthanasie active","Une sedation profonde et continue jusqu'au deces","L'assistance medicalisee a mourir","La designation d'un tuteur legal"],rep:1,expl:"Loi Claeys-Leonetti : droit a une **sedation profonde et continue jusqu'au deces** pour les patients en phase terminale avec souffrance refractaire."},
    {ue:"C.1",q:"L'education therapeutique du patient (ETP) vise en priorite a :",opts:["Informer le patient sur sa maladie","Rendre le patient acteur de la gestion de sa maladie","Obtenir l'observance parfaite au traitement","Former les aidants a realiser les soins"],rep:1,expl:"L'**ETP** vise a rendre le patient **acteur et autonome**. 4 etapes : diagnostic educatif > objectifs partages > seances > evaluation."},
    {ue:"A.2",q:"L'IDE peut pratiquer une injection IV directe :",opts:["Toujours en autonomie","Uniquement sur prescription medicale","Jamais, c'est un acte medical","Sur delegation de l'aide-soignant"],rep:1,expl:"L'injection IV directe est un acte du **role sur prescription** (art. R.4311-7 CSP). Necessite une prescription medicale ecrite et datee."},
  ],
};

// CAS CLINIQUES
var CAS={
  1:[
    {id:"c1a1",titre:"M. Martin, 68 ans — Insuffisance cardiaque",
    contexte:"M. Martin est hospitalise pour decompensation d'insuffisance cardiaque. Constantes : PA 148/88 mmHg, FC 98 bpm, FR 22/min, SpO2 93% sous 2L/min O2, T 37,2 C, poids +3kg en 3 jours.",
    question:"Quelles constantes sont anormales ? Quelle est votre priorite d'action ?",
    reponse:"**SpO2 93% anormale** chez un insuffisant cardiaque (cible > 95%). FR 22/min = limite haute. Prise de poids +3kg en 3 jours = retention hydrique et decompensation. **Priorite** : augmenter l'O2, position semi-assise, alerter le medecin, preparer furosemide IV, monitoring continu."},

  2:[
    {id:"c2a1",titre:"Plan canicule — EHPAD",

    reponse:"**Coup de chaleur** = urgence vitale. Peau seche = defaillance de la thermoregulation. Appel SAMU 15, deshabiller et refroidir (eau fraiche, ventilateur), position allongee, VVP, monitoring. Ne pas donner d'antipyretiques."},
    {id:"c2a2",titre:"Mme Dubois, 54 ans — Diabete type 2",
    contexte:"Prescription : Novorapid 8UI SC si glycemie > 1,8 g/L avant le dejeuner. Glycemie : 2,1 g/L. Le stylo dans la chambre est du Lantus (insuline lente).",
    question:"Pouvez-vous administrer l'insuline ? Quelle est votre demarche ?",
    reponse:"**Non** : le stylo present est du Lantus (insuline lente), la prescription porte sur du Novorapid (insuline rapide). Non interchangeables. Contacter le medecin, noter l'anomalie, se procurer le bon stylo Novorapid, verifier les 5B avant injection."},
  ],
  3:[
    {id:"c3a1",titre:"M. Karim, 32 ans — Post-operatoire",
    contexte:"M. Karim, J2 d'appendicectomie. Douleur brutale a l'epaule droite irradiant dans le cou. PA 88/50 mmHg, FC 130 bpm, FR 28/min, peau moite et froide. Pas de fievre.",
    question:"Que pensez-vous de ce tableau clinique ? Quelle est votre conduite a tenir ?",

    {id:"c3a2",titre:"Situation ethique — Directives anticipees",
    contexte:"M. Dupont, 78 ans, cancer pulmonaire en phase terminale, a redige des directives anticipees refusant toute reanimation cardio-respiratoire. Son epouse demande de tout faire pour le sauver.",
    question:"Quelle est votre position legale et ethique ?",
    reponse:"Les **directives anticipees sont juridiquement opposables** depuis la loi Claeys-Leonetti (2016). Le refus de RCR de M. Dupont doit etre respecte. L'epouse n'a pas le pouvoir de les annuler. Repondre avec empathie, expliquer la valeur legale des souhaits du patient, proposer un soutien psychologique."},
  ],
};

// FICHES MEMO
var FICHES={
  1:[
    {titre:"Regle des 5B",couleur:"rgba(96,144,248,.08)",bord:"#6090f8",tag:"B.3",corps:"Bon patient (bracelet + verification verbale) · Bon medicament (DCI + presentation) · Bonne dose (calcul verifie) · Bonne voie (SC/IV/IM/PO) · Bon moment (par rapport aux repas, heure prescrite). 6e B = Bonne tracabilite."},

// ETAT
var SK="simrev";
function load(){try{return JSON.parse(localStorage.getItem(SK))||{};}catch(e){return {};}}
function sav(d){try{localStorage.setItem(SK,JSON.stringify(d));}catch(e){}}
var ST=load();
function getScore(a){return ST["sc"+a]||{ok:0,total:0};}
function addScore(a,ok){var s=getScore(a);s.total++;if(ok)s.ok++;ST["sc"+a]=s;sav(ST);}
function resetScore(a){ST["sc"+a]={ok:0,total:0};sav(ST);}
function getPromo(){return ST["promo"]||"";}
function getCasRep(id){return ST["cas_"+id]||"";}
function setCasRep(id,v){ST["cas_"+id]=v;sav(ST);}
function getQidx(a){return ST["qi"+a]||0;}
function setQidx(a,i){ST["qi"+a]=i;sav(ST);}

var S={view:"welcome",annee:null,onglet:"qcm",ficheOpen:null,casShown:{},
  qShown:false,qSel:null,analyse:"",loading:false,showKey:false,
  apiKey:localStorage.getItem("simrev_key")||"",apiKeySaved:!!localStorage.getItem("simrev_key")};

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function md(t){return t.split("\n\n").filter(function(p){return p.trim();}).map(function(para){
  var parts=para.split(/\*\*([^*]+)\*\*/g);
  var inner=parts.map(function(p,i){return i%2===1?"<strong>"+esc(p)+"</strong>":esc(p);}).join("");
  return "<p>"+inner+"</p>";}).join("");}
function aC(a){return a===1?"var(--a1)":a===2?"var(--a2)":"var(--a3)";}
function aBg(a){return a===1?"rgba(96,144,248,.08)":a===2?"rgba(240,96,128,.08)":"rgba(64,200,168,.08)";}

function render(){
  var h="";
  if(S.view!=="welcome"){
    var ac=aC(S.annee||1);
    h+='<div class="site-header"><div class="badge">📚 A · B · C · D — Revisions IFSI</div>';
    h+='<h1>Sim<span>Revision</span></h1>';
    h+='<p>// '+esc(getPromo()||"Promotion")+" · "+(S.annee?"Annee "+S.annee:"Choisir une annee")+'</p></div>';
    if(S.view==="main"){
      h+='<div class="tabs">';
      [{id:"qcm",l:"QCM"},{id:"cas",l:"Cas cliniques"},{id:"fiches",l:"Fiches memo"},{id:"analyse",l:"IA"}].forEach(function(t){
        h+='<button class="tab '+(S.onglet===t.id?"active":"")+'" onclick="setO(\''+t.id+'\')">'+ t.l+"</button>";});
      h+="</div>";
    }
  } else {
    h+='<div class="site-header" style="padding-top:44px"><div class="badge">📚 A · B · C · D — Revisions IFSI</div>';
    h+="<h1>Sim<span>Revision</span></h1></div>";
  }
  h+='<div class="wrap">';

  if(S.view==="welcome"){
    h+='<div class="card fadeup" style="border-color:rgba(160,128,248,.2)"><div style="text-align:center;padding:8px 0 18px">';
    h+='<div style="font-size:48px;margin-bottom:14px">📚</div>';
    h+='<p style="color:var(--txt2);font-size:14px;line-height:1.85;max-width:460px;margin:0 auto">Reviser autrement — par l\'entrainement actif, pas la relecture passive. QCM, cas cliniques et fiches memo organises par annee.</p>';
    h+='<div class="pts"><div class="pt"><span class="pt-i">🎯</span><span class="pt-t"><strong>QCM par annee</strong> — 8 questions par an, score memorise</span></div>';
    h+='<div class="pt"><span class="pt-i">🏥</span><span class="pt-t"><strong>Cas cliniques</strong> — situations reelles, raisonnement guide</span></div>';
    h+='<div class="pt"><span class="pt-i">📋</span><span class="pt-t"><strong>Fiches memo</strong> — les points cles a retenir par annee</span></div></div>';
    h+='<div style="max-width:400px;margin:16px auto 0"><div style="font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--txt2);margin-bottom:8px;text-align:left">Nom de votre promotion (facultatif)</div>';
    h+='<input class="promo-input" type="text" placeholder="Ex: Promotion Nightingale 2026..." value="'+esc(getPromo())+'" oninput="ST.promo=this.value;sav(ST)"></div>';
    h+='<button class="btn-p btn-full" style="margin-top:16px" onclick="go(\'choix\')">Commencer →</button></div></div>';

  } else if(S.view==="choix"){
    h+='<div class="fadeup"><div class="card" style="border-color:rgba(160,128,248,.15)">';
    h+='<div class="card-title" style="color:var(--em)">Quelle annee revisez-vous ?</div>';
    h+='<div class="card-sub">Chaque annee a ses QCM, cas cliniques et fiches memo adaptes.</div>';
    h+='<div class="annee-grid">';
    [1,2,3].forEach(function(a){
      var sc=getScore(a);var pct=sc.total>0?Math.round(sc.ok/sc.total*100):0;var ac=aC(a);
      h+='<div class="annee-btn" style="border-color:'+ac+'40;background:'+aBg(a)+'" onclick="selA('+a+')">';
      h+='<span class="annee-icon">'+(a===1?"🌱":a===2?"🌿":"🌳")+"</span>";
      h+='<div class="annee-label" style="color:'+ac+'">'+a+'ere annee</div>';
      h+='<div class="annee-ues">'+(a===1?"B.1 · B.3 · A.1":a===2?"C.2 · B.3 · B.1":"A.2 · A.1 · C.1")+"</div>";
      if(sc.total>0){h+='<div style="margin-top:8px;font-family:var(--mono);font-size:11px;color:'+ac+'">'+sc.ok+"/"+sc.total+" ("+pct+"%)</div>";}
      h+="</div>";
    });
    h+="</div></div>";
    h+='<button class="btn-g btn-full" onclick="go(\'welcome\')">← Retour</button></div>';

  } else if(S.view==="main"){
    var ac=aC(S.annee);var sc=getScore(S.annee);

    if(S.onglet==="qcm"){
      var qs=QCM[S.annee];var qi=getQidx(S.annee)%qs.length;var q=qs[qi];
      var pct=sc.total>0?Math.round(sc.ok/sc.total*100):0;
      h+='<div class="fadeup"><div class="card" style="border-top:2px solid '+ac+'">';
      h+='<div class="score-bar"><span class="score-label">Score</span>';
      h+='<span class="score-nums" style="color:'+ac+'">'+sc.ok+"/"+sc.total+"</span>";
      if(sc.total>0){h+='<span style="font-family:var(--mono);font-size:11px;color:'+ac+';margin-left:6px">('+pct+"%)</span>";}
      h+="</div>";
      h+='<div class="progress-wrap"><div class="progress-bar" style="width:'+(sc.total>0?pct:0)+'%;background:'+ac+'"></div></div>';
      h+='<div style="font-family:var(--mono);font-size:10px;color:var(--txt2);margin-bottom:16px">Question '+(qi+1)+" / "+qs.length+"</div>";
      h+='<div class="qcm-card">';
      h+='<span class="qcm-ue" style="background:'+aBg(S.annee)+';color:'+ac+'">'+esc(q.ue)+"</span>";
      h+='<div class="qcm-q">'+esc(q.q)+"</div>";
      h+='<div class="qcm-opts">';
      q.opts.forEach(function(opt,i){
        var cls="";if(S.qShown){if(i===q.rep)cls="correct";else if(i===S.qSel)cls="wrong";}
        h+='<div class="qcm-opt '+cls+'" onclick="'+(S.qShown?"":"selQ("+i+")")+'">';
        h+='<span class="opt-letter">'+["A","B","C","D"][i]+"</span><span>"+esc(opt)+"</span></div>";
      });
      h+="</div>";
      if(S.qShown){
        h+='<div class="qcm-expl">'+q.expl.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")+"</div>";
        h+='<div class="qcm-nav"><button class="btn-g" onclick="rstQ()">Recommencer</button><button class="btn-p" onclick="nxtQ()">Suivante →</button></div>';
      }
      h+='</div></div>';
      h+='<button class="btn-g btn-full" style="margin-top:8px;color:var(--a2);border-color:rgba(240,96,128,.2)" onclick="resetScore('+S.annee+');render()">Remettre le score a zero</button>';
      h+="</div>";

    } else if(S.onglet==="cas"){
      var cases=CAS[S.annee]||[];
      h+='<div class="fadeup"><div class="card" style="border-top:2px solid '+ac+'">';
      h+='<div class="card-title" style="color:'+ac+'">Cas cliniques — Annee '+S.annee+"</div>";
      h+='<div class="card-sub">Redigez votre analyse, puis decouvrez les elements de reponse.</div>';
      cases.forEach(function(cas){
        var shown=S.casShown[cas.id];
        h+='<div class="cas-card"><div class="cas-titre">'+esc(cas.titre)+"</div>";
        h+='<div class="cas-contexte">'+esc(cas.contexte)+"</div>";
        h+='<div class="cas-question">'+esc(cas.question)+"</div>";
        h+='<textarea class="cas-textarea" placeholder="Redigez votre analyse clinique..." oninput="setCasRep(\''+cas.id+'\',this.value)">'+esc(getCasRep(cas.id))+"</textarea>";
        h+='<button class="btn-g btn-full" style="margin-top:8px;color:'+ac+'" onclick="toggleCas(\''+cas.id+'\')">'+
          (shown?"Masquer la correction":"Voir les elements de reponse")+"</button>";
        h+='<div class="cas-reponse'+(shown?" visible":"")+'">';
        h+=cas.reponse.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
        h+="</div></div>";
      });
      h+="</div></div>";

    } else if(S.onglet==="fiches"){
      var fiches=FICHES[S.annee]||[];
      h+='<div class="fadeup"><div class="card" style="border-top:2px solid '+ac+'">';
      h+='<div class="card-title" style="color:'+ac+'">Fiches memo — Annee '+S.annee+"</div>";
      h+='<div class="card-sub">Les points cles a retenir. Cliquez pour developper.</div>';
      fiches.forEach(function(f,i){
        var open=S.ficheOpen===i;
        h+='<div class="fiche '+(open?"open":"")+'" style="background:'+f.couleur+';border-left-color:'+f.bord+'" onclick="toggleF('+i+')">';
        h+='<span class="fiche-tag" style="background:'+f.bord+'22;color:'+f.bord+'">'+esc(f.tag)+"</span>";
        h+='<div class="fiche-titre" style="color:'+f.bord+'">'+esc(f.titre)+"</div>";
        h+='<div class="fiche-body">'+esc(f.corps)+"</div></div>";
      });
      h+="</div>";
      h+='<div class="info info-em">Technique : lisez une fiche, fermez-la et recitez-la a voix haute. La recuperation active est 3x plus efficace que la relecture.</div>';
      h+="</div>";

    } else if(S.onglet==="analyse"){
      h+='<div class="fadeup"><div class="card" style="border-top:2px solid '+ac+'">';
      h+='<div class="card-title" style="color:var(--em)">Analyse IA — Correction personnalisee</div>';
      h+='<div class="card-sub">Soumettez une reponse de cas clinique ou une question.</div>';
      h+='<textarea id="ia-q" style="width:100%;min-height:80px;background:rgba(0,0,0,.35);border:1.5px solid rgba(160,128,248,.15);border-radius:8px;color:var(--txt);padding:11px;font-size:13px;font-family:var(--sans);outline:none;resize:vertical;line-height:1.6;margin-bottom:10px" placeholder="Ex: Pour le cas de M. Martin, j\'ai repondu... Est-ce correct ?"></textarea>';
      h+='<button class="btn-p btn-full" onclick="runIA()">Analyser ma reponse</button>';
      if(S.loading){h+='<div class="dots" style="margin-top:14px"><span></span><span></span><span></span><div class="dots-msg">Correction en cours...</div></div>';}
      if(!S.loading&&S.analyse){h+='<div class="analysis fadeup" style="margin-top:14px">'+md(S.analyse)+"</div>";}
      h+='<hr class="div">';
      if(!S.apiKeySaved){
        h+='<div class="apikey-box"><p>Cle API Anthropic. <a href="https://console.anthropic.com/" target="_blank">Obtenir</a></p>';
        h+='<div class="apikey-row"><input type="password" placeholder="sk-ant-api03-..." value="'+esc(S.apiKey)+'" oninput="S.apiKey=this.value">';
        h+='<button onclick="svKey()">Sauver</button></div></div>';
      } else {
        h+='<div style="color:var(--lime);font-family:var(--mono);font-size:11px">// configured</div>';
      }
      h+="</div>";
      h+='<div style="background:rgba(0,0,0,.3);border:1.5px solid rgba(160,128,248,.15);border-radius:12px;padding:22px;margin-bottom:12px">';
      h+='<div style="text-align:center;margin-bottom:14px"><div style="font-size:28px;margin-bottom:8px">🔒</div>';
      h+='<div style="font-family:var(--head);font-size:15px;font-weight:700;color:var(--txt);margin-bottom:4px">Analyse IA — Acces Premium</div>';
      h+='<div style="font-size:12px;color:var(--txt2)">QCM, cas cliniques et fiches memo sont gratuits</div></div>';
      h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">';
      [{who:"Module seul",price:"4,99 EUR",em:false},{who:"Suite complete",price:"12,99 EUR",em:true},{who:"Institution",price:"Devis",em:false}].forEach(function(t){
        h+='<div style="border:1.5px solid '+(t.em?"rgba(160,128,248,.4)":"var(--bdr)")+';border-radius:8px;padding:12px;text-align:center;background:'+(t.em?"rgba(160,128,248,.07)":"rgba(255,255,255,.02)")+'">';
        h+='<div style="font-family:var(--mono);font-size:9px;color:'+(t.em?"var(--em)":"var(--txt2)")+';margin-bottom:7px">'+t.who+"</div>";
        h+='<div style="font-family:var(--head);font-size:16px;font-weight:800;color:var(--txt)">'+t.price+"</div></div>";
      });
      h+="</div>";
      h+='<div style="text-align:center"><a href="mailto:contact@simcare.fr" style="display:inline-block;padding:11px 24px;border-radius:8px;background:linear-gradient(135deg,var(--em2),var(--em));color:#fff;font-weight:700;font-size:13px;text-decoration:none">Obtenir l\'acces</a></div>';
      h+="</div></div>";
    }

    h+='<div style="display:flex;gap:8px;margin-top:10px">';
    h+='<button class="btn-g" onclick="go(\'choix\')" style="color:'+ac+'">Changer d\'annee</button>';
    h+='<button class="btn-g" onclick="go(\'welcome\')">Accueil</button></div>';
  }
  h+="</div>";
  document.getElementById("app").innerHTML=h;
}

function go(v){S.view=v;S.qShown=false;S.qSel=null;S.analyse="";render();window.scrollTo({top:0,behavior:"smooth"});}
function setO(o){S.onglet=o;S.analyse="";render();window.scrollTo({top:0,behavior:"smooth"});}
function selA(a){S.annee=a;S.view="main";S.onglet="qcm";S.qShown=false;S.qSel=null;render();window.scrollTo({top:0,behavior:"smooth"});}
function toggleF(i){S.ficheOpen=S.ficheOpen===i?null:i;render();}
function toggleCas(id){if(S.casShown[id]){delete S.casShown[id];}else{S.casShown[id]=true;}render();}
function selQ(i){if(S.qShown)return;S.qSel=i;S.qShown=true;addScore(S.annee,i===QCM[S.annee][getQidx(S.annee)%QCM[S.annee].length].rep);render();}
function nxtQ(){setQidx(S.annee,getQidx(S.annee)+1);S.qShown=false;S.qSel=null;render();window.scrollTo({top:0,behavior:"smooth"});}
function rstQ(){setQidx(S.annee,0);S.qShown=false;S.qSel=null;render();}
function svKey(){localStorage.setItem("simrev_key",S.apiKey);S.apiKeySaved=true;render();}

async function runIA(){
  var el=document.getElementById("ia-q");if(!el||!el.value.trim())return;
  S.loading=true;S.analyse="";render();
  try{
    var headers={"Content-Type":"application/json"};
    if(S.apiKey){headers["x-api-key"]=S.apiKey;headers["anthropic-version"]="2023-06-01";}
    var res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:headers,
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:900,
        messages:[{role:"user",content:"Tu es formateur IFSI. Etudiant annee "+S.annee+" : "+el.value+"\n\nCorrige et explique en 3 paragraphes. Tutoie. Utilise **gras** pour les points cles."}]})});
    var data=await res.json();
    if(data.error)throw new Error(data.error.message);
    S.analyse=data.content&&data.content.find(function(b){return b.type==="text";})?data.content.find(function(b){return b.type==="text";}).text:"";
  }catch(e){S.analyse="**Erreur**\n\n"+e.message;}
  S.loading=false;render();
}
render();
</script>
