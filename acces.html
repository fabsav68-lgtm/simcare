<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PraxisCare · Accès</title>
<style>
:root{
  --bg:#07101f; --card:rgba(255,255,255,.03); --bdr:rgba(255,255,255,.1);
  --txt:#e2e8f0; --txt2:#5a6478; --em:#38bdf8; --red:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:system-ui,sans-serif;background:var(--bg);color:var(--txt);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
}
.wrap{max-width:420px;width:100%;text-align:center}
.logo{font-family:Georgia,serif;font-size:34px;font-weight:300;margin-bottom:6px}
.logo b{font-weight:700;color:var(--em)}
.sub{font-size:11px;letter-spacing:2px;color:var(--txt2);text-transform:uppercase;margin-bottom:28px}

.card{background:var(--card);border:1.5px solid var(--em);border-radius:16px;padding:28px 24px}
.card h2{font-size:18px;margin-bottom:10px}
.card p{font-size:13px;color:var(--txt2);line-height:1.6;margin-bottom:20px}

input{
  width:100%;padding:14px;border-radius:10px;border:1.5px solid var(--bdr);
  background:rgba(0,0,0,.3);color:var(--txt);font-size:16px;text-align:center;
  letter-spacing:1px;text-transform:uppercase;font-family:monospace;
  outline:none;margin-bottom:8px;
}
input.err{border-color:var(--red)}
.msg-err{color:var(--red);font-size:12.5px;font-family:monospace;margin-bottom:14px;min-height:16px}

button{
  width:100%;padding:14px;border-radius:10px;border:none;
  background:var(--em);color:#07101f;font-size:15px;font-weight:700;cursor:pointer;
  transition:opacity .15s;
}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:not-allowed}

.hint{font-size:11px;color:var(--txt2);margin-top:16px;font-family:monospace}
.hint b{color:var(--txt2)}

footer{margin-top:30px;font-size:10px;letter-spacing:1px;color:var(--txt2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Praxis<b>Care</b></div>
  <div class="sub">Suite pédagogique IFSI · Accès sécurisé</div>

  <div id="msg-paiement" style="display:none;background:rgba(63,185,80,.1);border:1.5px solid #3fb950;border-radius:10px;padding:14px 16px;margin-bottom:16px;font-size:13px;line-height:1.6;text-align:center"></div>

  <div class="card">
    <h2>🔒 Code d'accès</h2>
    <p>Saisissez le code fourni par votre formateur pour accéder aux modules pédagogiques.</p>

    <input type="text" id="code-input" placeholder="PRAXIS-A1-001" autocomplete="off" autocapitalize="characters">
    <div class="msg-err" id="msg-err"></div>

    <button id="btn-acceder" onclick="tenterAcces()">Accéder à PraxisCare →</button>

    <div class="hint">Format : <b>PRAXIS-A1-001</b> · DEMO-RESPPEDA-2026</div>
    <p style="margin-top:18px;font-size:12.5px">
      <span style="color:var(--txt2)">Pas encore de code ?</span>
      <a href="acheter-simcare.html" style="color:var(--em);text-decoration:none;font-weight:600">Obtenir un accès →</a>
    </p>
  </div>

  <footer>PRAXISCARE · RÉFÉRENTIEL IDE 2026 · MEDEXPERT</footer>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  Vérification d'accès avec cache quotidien (mode hors-ligne)
//  Le code n'est revérifié auprès de Supabase que si la dernière
//  vérification réussie date de plus de 24h. Entre les deux,
//  et en l'absence de réseau, on réutilise le résultat en cache.
// ═══════════════════════════════════════════════════════════
const VERIF_CACHE_KEY = 'praxiscare_verif_cache';
const VERIF_CACHE_DUREE_MS = 24 * 60 * 60 * 1000; // 24h

function lireVerifCache(code){
  try{
    const brut = localStorage.getItem(VERIF_CACHE_KEY);
    if(!brut) return null;
    const data = JSON.parse(brut);
    if(data.code !== code) return null;
    return data;
  }catch(e){ return null; }
}

function ecrireVerifCache(code, resultat){
  try{
    localStorage.setItem(VERIF_CACHE_KEY, JSON.stringify({
      code: code, resultat: resultat, verifiedAt: Date.now(),
    }));
  }catch(e){ /* stockage indisponible : on continue sans cache */ }
}

async function verifierAccesAvecCache(code, app){
  const cache = lireVerifCache(code);
  const cacheEncoreValide = cache && (Date.now() - cache.verifiedAt) < VERIF_CACHE_DUREE_MS;

  if(cacheEncoreValide){
    console.log('Accès vérifié depuis le cache local (moins de 24h)');
    return cache.resultat;
  }

  try{
    const reponse = await fetch('https://fvrfiikrasezlzpaxpqz.supabase.co/functions/v1/verifier-acces', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': 'sb_publishable_TNksbociGaWCY53M4wCAXg_faOxEqKt',
        'Authorization': 'Bearer sb_publishable_TNksbociGaWCY53M4wCAXg_faOxEqKt',
      },
      body: JSON.stringify({ code, app }),
    });
    const resultat = await reponse.json();
    if(resultat.valide){
      ecrireVerifCache(code, resultat);
    }
    return resultat;
  }catch(erreurReseau){
    if(cache){
      console.log('Hors-ligne : reprise du dernier résultat connu, vérification différée');
      return cache.resultat;
    }
    return { valide:false, message:'Connexion requise pour la première vérification de ce code' };
  }
}

// ═══════════════════════════════════════════════════════════
//  Gestion du formulaire d'accès
// ═══════════════════════════════════════════════════════════
async function tenterAcces(){
  const input = document.getElementById('code-input');
  const btn = document.getElementById('btn-acceder');
  const msgErr = document.getElementById('msg-err');
  const code = input.value.trim().toUpperCase();

  msgErr.textContent = '';
  input.classList.remove('err');

  if(!code){
    msgErr.textContent = 'Veuillez saisir un code.';
    input.classList.add('err');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Vérification...';

  const resultat = await verifierAccesAvecCache(code, 'SimCare');

  btn.disabled = false;
  btn.textContent = 'Accéder à PraxisCare →';

  if(!resultat.valide){
    msgErr.textContent = 'Code non reconnu ou inactif';
    input.classList.add('err');
    return;
  }

  // Accès validé : on mémorise le code et les infos renvoyées, puis on entre dans l'appli.
  sessionStorage.setItem('praxiscare_code', code);
  if(resultat.annee) sessionStorage.setItem('praxiscare_annee', resultat.annee);
  if(typeof resultat.temps_cumule !== 'undefined') sessionStorage.setItem('praxiscare_temps_cumule', resultat.temps_cumule);
  if(resultat.temps_max) sessionStorage.setItem('praxiscare_temps_max', resultat.temps_max);

  window.location.href = 'index.html';
}

// Permet de valider avec la touche Entrée
document.getElementById('code-input').addEventListener('keydown', function(e){
  if(e.key === 'Enter') tenterAcces();
});

// ═══════════════════════════════════════════════════════════
//  Message de confirmation après retour de paiement Stripe
//  (creer-paiement.ts redirige vers acces.html?paiement=succes ou annule)
// ═══════════════════════════════════════════════════════════
(function(){
  const params = new URLSearchParams(window.location.search);
  const statut = params.get('paiement');
  const zone = document.getElementById('msg-paiement');
  if(!zone) return;

  if(statut === 'succes'){
    zone.style.display = 'block';
    zone.innerHTML = '✅ <strong>Paiement réussi !</strong><br>Votre code d\'accès arrive par email dans quelques instants — pensez à vérifier vos spams si vous ne le voyez pas.';
  } else if(statut === 'annule'){
    zone.style.display = 'block';
    zone.style.background = 'rgba(255,176,32,.1)';
    zone.style.borderColor = '#ffb020';
    zone.innerHTML = 'Paiement annulé — vous pouvez réessayer quand vous le souhaitez.';
  }

  // Nettoie l'URL pour que le message ne réapparaisse pas à un rechargement de page
  if(statut){
    const urlPropre = window.location.pathname;
    window.history.replaceState({}, document.title, urlPropre);
  }
})();
</script>
</body>
</html>
