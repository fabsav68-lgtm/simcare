<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PraxisNumérique · Outil pédagogique IFSI</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,600;0,700;1,300&family=Syne:wght@400;600;700;800&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet">
.btn-audio{position:fixed;bottom:16px;right:16px;background:var(--em);color:#06080f;padding:10px 18px;border-radius:24px;font-size:13px;font-weight:700;cursor:pointer;z-index:1000;box-shadow:0 4px 16px rgba(0,0,0,.4);}
  <style>
:root{
  --bg:    #06080f;
  --bg2:   #0b0e18;
  --card:  rgba(255,255,255,.028);
  --bdr:   rgba(100,180,255,.08);
  --txt:   #c8d8f0;
  --txt2:  #4868a0;
  --txt3:  #121828;
  --em:    #38c8ff;
  --em2:   #0898cf;
  --green: #30d880;
  --warn:  #f0a830;
  --red:   #f04848;
  --purple:'#a060f0';
  --pur:   #a060f0;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Syne',sans-serif;
  background:var(--bg);color:var(--txt);
  min-height:100vh;padding-bottom:80px;overflow-x:hidden;position:relative;
}
/* Fond circuit imprimé */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 20%, rgba(56,200,255,.07) 0%,transparent 50%),
    radial-gradient(ellipse 40% 30% at 80% 80%, rgba(48,216,128,.05) 0%,transparent 45%);
  background-image:
    linear-gradient(rgba(56,200,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(56,200,255,.03) 1px, transparent 1px);
  background-size:50px 50px, 50px 50px;
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 100% 60% at 50% 0%, rgba(56,200,255,.04) 0%,transparent 60%);
}

.wrap{max-width:720px;margin:0 auto;padding:0 20px;position:relative;z-index:1}

/* ── HEADER ── */
.site-header{padding:44px 24px 28px;text-align:center;position:relative;z-index:1}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(56,200,255,.08);border:1px solid rgba(56,200,255,.2);
  color:var(--em);padding:5px 18px;border-radius:4px;
  font-family:'JetBrains Mono',monospace;font-size:11px;
  letter-spacing:2px;text-transform:uppercase;margin-bottom:16px;
}
.site-header h1{
  font-family:'Syne',sans-serif;
  font-size:clamp(28px,6vw,52px);font-weight:800;
  letter-spacing:-2px;line-height:1.0;margin-bottom:8px;
}
.site-header h1 span{color:var(--em)}
.site-header p{color:var(--txt2);font-size:13px;font-family:'JetBrains Mono',monospace;letter-spacing:.5px}

/* ── ONGLETS ── */
.tabs{display:flex;gap:4px;padding:0 0 20px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{
  padding:8px 16px;border-radius:4px;
  border:1.5px solid var(--bdr);background:rgba(255,255,255,.02);
  color:var(--txt2);font-size:12px;font-weight:600;cursor:pointer;
  white-space:nowrap;transition:all .18s;font-family:'Syne',sans-serif;
  letter-spacing:.5px;-webkit-tap-highlight-color:transparent;
}
.tab:hover{color:var(--txt);background:rgba(56,200,255,.04)}
.tab.active{background:rgba(56,200,255,.1);border-color:rgba(56,200,255,.35);color:var(--em)}

/* ── CARD ── */
.card{background:var(--card);border:1.5px solid var(--bdr);border-radius:10px;padding:24px;margin-bottom:14px;position:relative;z-index:1}
.card.em{border-top:2px solid var(--em)}
.card.green{border-top:2px solid var(--green)}
.card.warn{border-top:2px solid var(--warn)}
.card.pur{border-top:2px solid var(--pur)}
.card-title{font-size:20px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}
.card-sub{color:var(--txt2);font-size:13px;margin-bottom:18px;line-height:1.65;font-family:'JetBrains Mono',monospace}

/* ── DPI NAVIGATOR ── */
.dpi-tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.dpi-tab{
  padding:6px 12px;border-radius:4px;border:1px solid rgba(56,200,255,.15);
  background:rgba(56,200,255,.04);color:var(--txt2);font-size:11px;
  cursor:pointer;font-family:'JetBrains Mono',monospace;transition:all .15s;
  -webkit-tap-highlight-color:transparent;
}
.dpi-tab.on{background:rgba(56,200,255,.12);border-color:rgba(56,200,255,.35);color:var(--em)}
.dpi-screen{
  background:rgba(0,0,0,.4);border:1px solid rgba(56,200,255,.12);
  border-radius:8px;padding:18px;font-family:'JetBrains Mono',monospace;
  font-size:12px;min-height:160px;
}
.dpi-field{
  display:flex;gap:10px;align-items:flex-start;
  padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);
}
.dpi-field:last-child{border-bottom:none}
.dpi-label{color:var(--txt2);font-size:11px;letter-spacing:1px;flex-shrink:0;width:120px}
.dpi-value{color:var(--txt);font-size:12px;line-height:1.5}
.dpi-value.alert{color:var(--warn)}
.dpi-value.ok{color:var(--green)}
.dpi-value.critical{color:var(--red)}

/* ── TÉLÉSURVEILLANCE ── */
.tele-device{
  background:rgba(48,216,128,.05);border:1.5px solid rgba(48,216,128,.2);
  border-radius:10px;padding:16px;margin-bottom:8px;cursor:pointer;
  transition:all .2s;-webkit-tap-highlight-color:transparent;
}
.tele-device:hover{background:rgba(48,216,128,.09)}
.tele-device.active{background:rgba(48,216,128,.1);border-color:rgba(48,216,128,.4)}
.tele-nom{font-size:14px;font-weight:700;color:var(--green);margin-bottom:3px}
.tele-desc{font-size:12px;color:var(--txt2);line-height:1.6}
.tele-detail{display:none;margin-top:10px;padding-top:10px;border-top:1px solid rgba(48,216,128,.1)}
.tele-device.active .tele-detail{display:block}

/* ── RGPD ── */
.rgpd-item{
  padding:14px;border-radius:8px;margin-bottom:8px;
  border-left:3px solid transparent;background:rgba(0,0,0,.2);
  cursor:pointer;transition:all .18s;-webkit-tap-highlight-color:transparent;
}
.rgpd-item:hover{background:rgba(0,0,0,.3)}
.rgpd-titre{font-size:14px;font-weight:700;margin-bottom:3px}
.rgpd-body{font-size:12px;color:var(--txt2);line-height:1.7;display:none;margin-top:8px}
.rgpd-item.open .rgpd-body{display:block}

/* ── IA SANTÉ ── */
.ia-card{
  background:rgba(160,96,240,.05);border:1.5px solid rgba(160,96,240,.18);
  border-radius:10px;padding:18px;margin-bottom:10px;
  cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent;
}
.ia-card:hover{background:rgba(160,96,240,.09)}
.ia-card.active{background:rgba(160,96,240,.1);border-color:rgba(160,96,240,.35)}
.ia-titre{font-size:15px;font-weight:700;color:var(--pur);margin-bottom:4px}
.ia-body{display:none;font-size:12px;color:var(--txt2);line-height:1.7;margin-top:8px}
.ia-card.active .ia-body{display:block}

/* ── QUIZ ── */
.quiz-opt{
  padding:12px 16px;border-radius:8px;border:1.5px solid var(--bdr);
  background:rgba(255,255,255,.02);color:var(--txt2);
  cursor:pointer;font-size:14px;margin-bottom:8px;
  transition:all .18s;display:flex;align-items:center;gap:12px;
  -webkit-tap-highlight-color:transparent;
}
.quiz-opt:hover{background:rgba(56,200,255,.05);color:var(--txt)}
.quiz-opt.correct{background:rgba(48,216,128,.1);border-color:rgba(48,216,128,.4);color:var(--green)}
.quiz-opt.wrong  {background:rgba(240,72,72,.1); border-color:rgba(240,72,72,.4); color:var(--red)}
.quiz-expl{background:rgba(56,200,255,.05);border:1px solid rgba(56,200,255,.15);border-radius:8px;padding:12px 14px;margin-top:10px;font-size:13px;color:var(--txt2);line-height:1.7}
.quiz-expl strong{color:var(--txt)}

/* ── INFO ── */
.info{border-radius:6px;padding:11px 14px;font-size:13px;line-height:1.75;margin-bottom:12px}
.info-em  {background:rgba(56,200,255,.07); border-left:3px solid rgba(56,200,255,.5);  color:var(--em)}
.info-green{background:rgba(48,216,128,.07);border-left:3px solid rgba(48,216,128,.5);  color:var(--green)}
.info-warn {background:rgba(240,168,48,.07); border-left:3px solid rgba(240,168,48,.5);  color:var(--warn)}
.info-pur  {background:rgba(160,96,240,.07); border-left:3px solid rgba(160,96,240,.5);  color:var(--pur)}

/* ── BOUTONS ── */
.btn-p{background:linear-gradient(135deg,var(--em2),var(--em));border:none;border-radius:6px;color:#06080f;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;padding:12px 26px;cursor:pointer;transition:opacity .2s,transform .1s;}
.btn-p:hover{opacity:.9;transform:translateY(-1px)}
.btn-g{background:rgba(255,255,255,.03);border:1.5px solid var(--bdr);border-radius:6px;color:var(--txt2);font-family:'Syne',sans-serif;font-size:13px;font-weight:600;padding:10px 18px;cursor:pointer;transition:all .18s;}
.btn-g:hover{background:rgba(56,200,255,.05);color:var(--txt)}
.btn-full{width:100%}
.col8{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
hr.div{border:none;border-top:1px solid rgba(100,180,255,.07);margin:16px 0}

/* ── STAT ── */
.stat{background:rgba(0,0,0,.3);border:1px solid rgba(56,200,255,.07);border-radius:8px;padding:12px;text-align:center}
.stat-v{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;color:var(--em);display:block}
.stat-l{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:1.5px;font-family:'JetBrains Mono',monospace;display:block;margin-top:4px}

/* ── PROGRESS ── */
.progress-bar-wrap{background:rgba(255,255,255,.06);border-radius:100px;height:7px;overflow:hidden;margin:6px 0}
.progress-bar{height:100%;border-radius:100px;transition:width .6s ease}

/* ── LOADING ── */
.dots{text-align:center;padding:24px 0}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--em);margin:0 3px;animation:dotB 1.4s ease-in-out infinite both}
.dots span:nth-child(2){animation-delay:.16s}
.dots span:nth-child(3){animation-delay:.32s}
.dots-msg{color:var(--txt2);font-size:13px;margin-top:10px;font-family:'JetBrains Mono',monospace}
.analysis p{margin-bottom:14px;font-size:15px;line-height:1.85;color:#6080a0}
.analysis strong{color:var(--txt)}

/* ── PREMIUM ── */
.premium-box{background:rgba(0,0,0,.3);border:1.5px solid rgba(56,200,255,.12);border-radius:10px;padding:24px;margin-bottom:14px}
.apikey-box{background:rgba(56,200,255,.04);border:1px solid rgba(56,200,255,.12);border-radius:6px;padding:12px}
.apikey-box p{font-size:13px;color:var(--txt2);margin-bottom:10px;line-height:1.6}
.apikey-box a{color:var(--em)}
.apikey-row{display:flex;gap:8px}
.apikey-row input{flex:1;padding:9px 12px;font-size:12px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);border-radius:6px;color:var(--txt);font-family:'JetBrains Mono',monospace;outline:none}
.apikey-row input:focus{border-color:rgba(56,200,255,.3)}
.apikey-row button{padding:9px 14px;border:none;border-radius:6px;background:var(--em2);color:#06080f;font-weight:700;cursor:pointer;font-size:12px}
.apikey-saved{color:var(--green);font-size:11px;margin-top:5px;font-family:'JetBrains Mono',monospace}

/* ── WELCOME ── */
.pts{display:flex;flex-direction:column;gap:10px;margin:18px 0;text-align:left}
.pt{display:flex;gap:12px;align-items:flex-start}
.pt-i{font-size:18px;flex-shrink:0;margin-top:2px}
.pt-t{font-size:14px;color:var(--txt2);line-height:1.65}
.pt-t strong{color:var(--txt)}

/* ── TAG ── */
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;margin-top:5px}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes dotB{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.fadeup{animation:fadeUp .35s ease forwards}
.cursor{animation:blink 1s step-end infinite}
@media(max-width:480px){.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>

<div id="app"></div>
<button class="btn-audio" id="btn-audio" onclick="lireOnglet()">🔊 Écouter</button>
<script>

// ═══════════════════════════════════════
//  DONNÉES
// ═══════════════════════════════════════

const DPI_SCREENS = {

      {l:'SpO₂',v:'97%',ok:true},
      {l:'T°',v:'37,2°C',ok:true},
      {l:'Glycémie cap.',v:'1,82 g/L (post-prandial)',alert:true},

  },

      {l:'Dernière admin.',v:'✓ Vérifiée 08h45 — IDE: Dupont',ok:true},
    ]
  },
  transmissions:{
    titre:'Transmissions ciblées',
    fields:[
      {l:'Date/Heure',v:'15/05/2026 — 14h20',ok:true},

      {l:'Données',v:'Patient se plaint douleur mollet G 6/10. Œdème tibia gauche augmenté vs matin.',ok:true},
      {l:'Actions',v:'Écho-doppler demandée. Médecin prévenu. Alitement membre surélevé.',ok:true},
      {l:'Résultats',v:'En attente radio. Prochain contrôle 16h.',alert:true},
      {l:'IDE',v:'Dupont Marie — Signature électronique',ok:true},
    ]
  }
};

const TELE_DEVICES = [
  {id:'balance', nom:'Balance connectée', icon:'⚖️', couleur:'#30d880',
   desc:'Mesure quotidienne du poids — envoi automatique au DPI et alertes IDE si +2kg en 3 jours.',
   usage:'Insuffisance cardiaque, insuffisance rénale, obésité. L\'IDE programme les seuils d\'alerte personnalisés. Données accessibles via l\'application mobile sécurisée.',
   avantages:'Détection précoce décompensation. Évite l\'hospitalisation si alerte rapide. Autonomise le patient.',
   limites:'Connexion Internet nécessaire. Nécessite l\'éducation du patient. Données doivent être intégrées dans le DPI.'},
  {id:'tension', nom:'Tensiomètre connecté', icon:'🫀', couleur:'#e06040',
   desc:'Automesure à domicile — 3 mesures matin et soir pendant 3 jours (règle des 3).',
   usage:'HTA, suivi post-AVC, insuffisance cardiaque. Données transmises au médecin et IDE en temps réel. Règle des 3 : 3 mesures, 3 moments, 3 jours.',
   avantages:'Élimination de l\'effet blouse blanche. Suivi en conditions réelles. Aide à l\'observance.',
   limites:'Brassard mal positionné = mesure fausse. L\'IDE doit vérifier la technique lors des visites.'},
  {id:'glycemie', nom:'Capteur glucose continu (CGM)', icon:'🩸', couleur:'#e8a840',
   desc:'Capteur sous-cutané mesurant la glycémie toutes les 5 minutes — courbe continue partagée avec l\'IDE.',
   usage:'Diabète type 1 et 2 sous insuline. Patch changé tous les 14 jours. L\'IDE vérifie la pose, la courbe (TIR : temps dans la cible), les hypoglycémies nocturnes.',
   avantages:'Supprime la douleur des dextros répétitifs. Détecte les hypos nocturnes. Motive le patient par visualisation.',
   limites:'Décalage de 5-15 min vs glycémie capillaire. Coût. Calibration nécessaire pour certains modèles.'},
  {id:'spo2', nom:'Oxymètre connecté', icon:'🫁', couleur:'#4090b8',
   desc:'SpO₂ et FC en continu — alertes automatiques si SpO₂ < seuil programmé.',
   usage:'BPCO, insuffisance respiratoire, oxygénothérapie à domicile, apnée du sommeil. L\'IDE programme les seuils d\'alerte selon la pathologie (ex: SpO₂ < 88% en BPCO).',
   avantages:'Surveillance nocturne. Détection exacerbations précoces. Sécurisation des patients à risque.',
   limites:'Vernis à ongles, mouvements = artefacts. Ne remplace pas l\'évaluation clinique.'},
];

const RGPD_ITEMS = [
  {id:'consentement', couleur:'#38c8ff', titre:'Consentement éclairé et droit à l\'information',
   corps:'Le patient doit être informé de façon claire et compréhensible de : quelles données sont collectées, pourquoi (finalité), qui y a accès, combien de temps elles sont conservées. Il doit consentir explicitement. En santé, le consentement peut être présumé pour les données nécessaires aux soins, mais pas pour la recherche ou les assurances.'},
  {id:'minimisation', couleur:'#30d880', titre:'Principe de minimisation des données',

  {id:'securite', couleur:'#f0a830', titre:'Sécurité et confidentialité des données',
   corps:'Mot de passe DPI personnel et non partagé — jamais laisser une session ouverte. MSSanté (Messagerie Sécurisée de Santé) obligatoire pour tout envoi de données de santé par courriel. Interdiction formelle d\'envoyer des données patients par Gmail, WhatsApp ou tout service non agréé. Chiffrement des données stockées.'},

const IA_USAGES = [
  {id:'detection', titre:'Détection précoce de dégradation', couleur:'#38c8ff',

  {id:'aide_decision', titre:'Aide à la décision clinique', couleur:'#30d880',

  {id:'admin', titre:'IA et tâches administratives', couleur:'#a060f0',

  {id:'limites', titre:'Limites et risques de l\'IA en santé', couleur:'#f0a830',
   corps:'Biais algorithmiques (sous-représentation de certaines populations dans les données d\'entraînement). Hallucinations : l\'IA peut générer des informations fausses avec confiance. L\'IDE ne doit JAMAIS déléguer un jugement clinique à une IA. Responsabilité : en cas d\'erreur basée sur une recommandation IA, la responsabilité reste celle du professionnel de santé.'},

//  UTILS
// ═══════════════════════════════════════
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function renderMd(t){
  return t.split('\n\n').filter(p=>p.trim()).map(para=>{
    const parts=para.split(/\*\*([^*]+)\*\*/g);
    const inner=parts.map((p,i)=>i%2===1?`<strong>${esc(p)}</strong>`:esc(p)).join('');
    return `<p>${inner}</p>`;
  }).join('');
}

    </div>
    <div style="text-align:center;margin-bottom:10px"><a href="mailto:contact@praxiscare.fr" style="display:inline-block;padding:12px 28px;border-radius:6px;background:linear-gradient(135deg,var(--em2),var(--em));color:#06080f;font-weight:800;font-size:14px;text-decoration:none">Obtenir l'accès →</a></div>
    <div style="text-align:center;padding-top:10px;border-top:1px solid rgba(100,180,255,.07)"><button onclick="S.showKey=!S.showKey;render()" style="background:none;border:none;color:var(--txt2);font-size:11px;cursor:pointer;font-family:'JetBrains Mono',monospace">// formateur_key</button></div>
    ${S.showKey?`<div class="apikey-box" style="margin-top:12px"><p>Clé API — formateur. <a href="https://console.anthropic.com/" target="_blank">Obtenir →</a></p><div class="apikey-row"><input type="text" placeholder="sk-ant-api03-…" value="${esc(S.apiKey)}" oninput="S.apiKey=this.value"><button onclick="saveKey()">Sauver</button></div>${S.apiKeySaved?'<div class="apikey-saved">// configured ✓</div>':''}</div>`:''}
    </div></div>`;
  }

  if(S.view!=='welcome'){
    h+=`<div style="margin-top:12px"><button class="btn-g" onclick="go('welcome')" style="color:var(--em);border-color:rgba(56,200,255,.2)">← Accueil PraxisNumérique</button></div>`;
  }
  h+='</div>';
  document.getElementById('app').innerHTML=h;
}

// ═══════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════
var _lecture = false;
function meilleureVoixFr(){
  var voix = speechSynthesis.getVoices().filter(function(v){ return v.lang && v.lang.toLowerCase().indexOf('fr') === 0; });
  if(voix.length === 0) return null;
  var bonsNoms = ['amélie','audrey','thomas','daniel'];
  var meilleure = voix.find(function(v){ return /enhanced|premium|neural/i.test(v.name); });
  if(!meilleure){
    meilleure = voix.find(function(v){ var n=v.name.toLowerCase(); return bonsNoms.some(function(bn){ return n.indexOf(bn)!==-1; }); });
  }
  return meilleure || voix[0];
}
function lireOnglet(){
  if(_lecture){ stopLecture(); return; }
  if(!('speechSynthesis' in window)){ alert('Lecture audio non disponible sur ce navigateur.'); return; }
  var textes = [];
  document.querySelectorAll('#app .card-title, #app .card-sub, #app .info, #app .dpi-label, #app .dpi-value, #app .tele-nom, #app .tele-desc, #app .tele-detail, #app .rgpd-titre, #app .rgpd-body, #app .ia-titre, #app .ia-body, #app .stat-v, #app .stat-l, #app .quiz-opt, #app .quiz-expl').forEach(function(el){
    var t = el.innerText.trim();
    if(t.length > 2) textes.push(t);
  });
  if(textes.length === 0) return;
  _lecture = true;
  document.getElementById('btn-audio').textContent = '⏹ Stop';
  var voixChoisie = meilleureVoixFr();
  var i = 0;
  function suivante(){
    if(!_lecture || i >= textes.length){ stopLecture(); return; }
    var u = new SpeechSynthesisUtterance(textes[i++]);
    u.lang = 'fr-FR';
    u.rate = 0.9;
    if(voixChoisie) u.voice = voixChoisie;
    u.onend = suivante;
    u.onerror = suivante;
    speechSynthesis.speak(u);
  }
  speechSynthesis.cancel();
  setTimeout(suivante, 50);
}
function stopLecture(){
  _lecture = false;
  if('speechSynthesis' in window) speechSynthesis.cancel();
  var btn = document.getElementById('btn-audio');
  if(btn) btn.textContent = '🔊 Écouter';
}
  function go(v){stopLecture();S.view=v;render();window.scrollTo({top:0,behavior:'smooth'});}
function setOnglet(o){stopLecture();S.onglet=o;S.analyse='';render();window.scrollTo({top:0,behavior:'smooth'});}
function selectQuiz(i){if(S.quizShown)return;S.quizSelected=i;S.quizShown=true;S.quizTotal++;if(i===QUIZ[S.quizIdx%QUIZ.length].rep)S.quizScore++;render();}
function nextQuiz(){S.quizIdx++;S.quizSelected=null;S.quizShown=false;render();window.scrollTo({top:0,behavior:'smooth'});}
function saveKey(){localStorage.setItem('simnum_key',S.apiKey);S.apiKeySaved=true;render();}

async function runAnalyse(){
  const q=document.getElementById('question-num')?.value||'';
  if(!q.trim())return;
  S.loading=true;S.analyse='';render();
  try{
    const headers={'Content-Type':'application/json'};
    if(S.apiKey){headers['x-api-key']=S.apiKey;headers['anthropic-version']='2023-06-01';}
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers,body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:900,messages:[{role:'user',content:`Tu es un formateur IFSI expert en numérique en santé, RGPD, DPI, télésurveillance et IA clinique. Tu connais le programme Ségur du numérique, MSSanté, Mon Espace Santé, e-CPS et les enjeux de la transformation numérique du système de santé français en 2026.\n\nQuestion : ${q}\n\nRéponds en 3-4 paragraphes pratiques. Tutoie l'étudiant. Donne des exemples concrets issus de la pratique IDE. Cite les textes réglementaires si pertinent (RGPD, Ségur, CNIL). Utilise **gras** pour les points clés.`}]})});
    const data=await res.json();
    if(data.error)throw new Error(data.error.message);
    S.analyse=data.content?.find(b=>b.type==='text')?.text||'';
  }catch(e){S.analyse=`**Erreur**\n\n${e.message}`;}
  S.loading=false;render();
}

render();
</script>
