<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avis — Dashboard formateur Praxis</title>
<style>
:root{
  --bg:#070c14; --bg2:#0c1420; --card:rgba(255,255,255,.035); --bdr:rgba(255,255,255,.09);
  --txt:#eef2f6; --txt2:#8a99a8; --em:#38bdf8; --green:#40c878; --amber:#e8a840; --red:#e85050;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--txt);font-family:-apple-system,'Segoe UI',sans-serif;min-height:100vh;padding:20px 16px 60px}
.wrap{max-width:680px;margin:0 auto}

/* LOGIN */
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:20px}
.login-box{background:var(--card);border:1px solid var(--bdr);border-radius:18px;padding:32px 28px;width:100%;max-width:360px;text-align:center}
.login-box h2{font-size:20px;font-weight:800;margin-bottom:6px}
.login-box p{color:var(--txt2);font-size:13px;margin-bottom:24px}
.login-box input{width:100%;background:rgba(255,255,255,.06);border:1.5px solid var(--bdr);border-radius:10px;color:var(--txt);font-size:15px;font-weight:700;letter-spacing:2px;padding:12px 16px;text-align:center;margin-bottom:14px;outline:none}
.login-box input:focus{border-color:var(--em)}
.login-box input::placeholder{letter-spacing:0;font-weight:400;color:var(--txt2)}
.btn-login{width:100%;background:linear-gradient(135deg,#0284c7,var(--em));border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:800;padding:13px;cursor:pointer}
.login-err{color:var(--red);font-size:12.5px;margin-top:8px;min-height:18px}
.login-logo{font-size:36px;margin-bottom:4px}

/* DASHBOARD */
#dashboard{display:none}
h1{font-size:22px;font-weight:800;margin-bottom:4px}
.sub{color:var(--txt2);font-size:13px;margin-bottom:20px}
.filiere-badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-left:8px;vertical-align:middle}
.fb-ifsi{background:rgba(56,189,248,.15);color:var(--em)}
.fb-cafasv{background:rgba(64,200,120,.15);color:var(--green)}
.fb-ifas{background:rgba(232,168,64,.15);color:var(--amber)}
.fb-ap{background:rgba(200,100,220,.15);color:#c864dc}
.fb-admin{background:rgba(255,255,255,.1);color:var(--txt)}

/* STATS GLOBALES */
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--txt2);margin:20px 0 10px}
.global-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.gstat{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:10px 8px;text-align:center}
.gstat-emoji{font-size:16px}
.gstat-label{font-size:9.5px;color:var(--txt2);margin:2px 0}
.gstat-val{font-size:16px;font-weight:800;color:var(--em)}
.gstat-sub{font-size:9px;color:var(--txt2)}

/* GRAPHIQUES */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.chart-box{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:14px}
.chart-title{font-size:11px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bar-label{font-size:10.5px;color:var(--txt2);width:52px;flex-shrink:0;text-align:right}
.bar-track{flex:1;background:rgba(255,255,255,.05);border-radius:4px;height:14px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .6s ease}
.bar-val{font-size:10.5px;font-weight:700;width:32px;flex-shrink:0}
.bar-ifsi{background:linear-gradient(90deg,#0284c7,#38bdf8)}
.bar-cafasv{background:linear-gradient(90deg,#16a34a,#40c878)}
.bar-ifas{background:linear-gradient(90deg,#b45309,#e8a840)}
.bar-ap{background:linear-gradient(90deg,#9333ea,#c864dc)}

/* ONGLETS */
.tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:2px solid var(--bdr);overflow-x:auto}
.tab{flex-shrink:0;background:transparent;border:none;border-bottom:3px solid transparent;color:var(--txt2);padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;margin-bottom:-2px;transition:color .2s,border-color .2s;display:flex;align-items:center;gap:6px}
.tab:hover:not(.locked){color:var(--txt)}
.tab.active{color:var(--em);border-bottom-color:var(--em)}
.tab.locked{cursor:not-allowed;opacity:.45}
.tab .badge{background:rgba(232,168,64,.25);color:var(--amber);font-size:10px;font-weight:800;padding:1px 6px;border-radius:8px}
.tab.active .badge{background:rgba(56,189,248,.2);color:var(--em)}

/* FILTRE MODULE */
.mod-filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.mod-filter{flex-shrink:0;background:rgba(255,255,255,.04);border:1px solid var(--bdr);color:var(--txt2);padding:6px 12px;border-radius:20px;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.mod-filter.active{background:rgba(56,189,248,.15);border-color:rgba(56,189,248,.4);color:var(--em)}

/* STATS FILIÈRE */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:12px;text-align:center}
.stat-v{font-size:20px;font-weight:800;color:var(--em);display:block}
.stat-l{font-size:10.5px;color:var(--txt2);margin-top:2px}

/* CARTES AVIS */
.avis-card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:16px;margin-bottom:12px}
.avis-card.non-lu{border-color:rgba(232,168,64,.4)}
.avis-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:10px}
.avis-meta{font-size:11px;color:var(--txt2);font-family:'Fira Mono',monospace}
.avis-app{display:inline-block;background:rgba(56,189,248,.12);color:var(--em);padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;margin-right:6px}
.avis-stars{font-size:13px;flex-shrink:0}
.avis-tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.avis-tag{background:rgba(255,255,255,.05);border:1px solid var(--bdr);color:var(--txt2);font-size:10.5px;padding:3px 9px;border-radius:12px}
.avis-tag.diff{background:rgba(232,168,64,.1);border-color:rgba(232,168,64,.3);color:var(--amber)}
.avis-comment{font-size:13.5px;color:var(--txt);line-height:1.6;margin:10px 0;padding:10px 12px;background:rgba(0,0,0,.2);border-radius:10px}
.avis-reponse-existante{font-size:13px;color:var(--green);line-height:1.6;margin:10px 0;padding:10px 12px;background:rgba(64,200,120,.08);border:1px solid rgba(64,200,120,.25);border-radius:10px}
.avis-reponse-existante b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.reply-zone textarea{width:100%;min-height:60px;background:rgba(255,255,255,.04);border:1.5px solid var(--bdr);border-radius:8px;color:var(--txt);padding:10px;font-size:13px;resize:vertical;margin-top:8px}
.reply-actions{display:flex;gap:8px;margin-top:8px}
.btn-reply{background:linear-gradient(135deg,#0284c7,var(--em));border:none;border-radius:8px;color:#fff;font-size:12.5px;font-weight:700;padding:9px 16px;cursor:pointer}
.btn-lu{background:transparent;border:1px solid var(--bdr);border-radius:8px;color:var(--txt2);font-size:12px;padding:9px 14px;cursor:pointer}
.btn-logout{background:transparent;border:1px solid var(--bdr);border-radius:8px;color:var(--txt2);font-size:11px;padding:6px 12px;cursor:pointer;float:right;margin-top:-4px}
.locked-msg{text-align:center;padding:40px 20px;color:var(--txt2);font-size:14px}
.locked-msg .lock-icon{font-size:40px;margin-bottom:12px}
.empty{text-align:center;padding:40px 20px;color:var(--txt2);font-size:13.5px}
.loading{text-align:center;padding:30px;color:var(--txt2);font-size:13px}
.config-warn{background:rgba(232,80,80,.1);border:1px solid rgba(232,80,80,.35);color:var(--red);border-radius:10px;padding:14px 16px;font-size:13px;margin-bottom:16px}
</style>
</head>
<body>

<!-- ÉCRAN LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">🏥</div>
    <h2>Espace formateur</h2>
    <p>Entrez votre code d'accès pour accéder au dashboard des avis étudiants</p>
    <input type="password" id="code-input" placeholder="Code formateur" autocomplete="off" onkeydown="if(event.key==='Enter') validerCode()">
    <button class="btn-login" onclick="validerCode()">Accéder au dashboard</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
<div class="wrap">
  <h1>💬 Avis étudiants <span id="filiere-badge" class="filiere-badge"></span></h1>
  <div class="sub" id="sub-text"></div>
  <button class="btn-logout" onclick="deconnecter()">⇠ Déconnexion</button>

  <!-- STATS GLOBALES + GRAPHS -->
  <div class="section-title">Vue globale — toutes filières</div>
  <div class="global-stats" id="global-stats"></div>
  <div class="charts-grid" id="charts-grid"></div>

  <!-- ONGLETS FILIÈRES -->
  <div class="section-title">Messages par filière</div>
  <div class="tabs" id="tabs"></div>
  <div class="mod-filters" id="mod-filters"></div>
  <div id="stats-zone"></div>
  <div id="liste"></div>
</div>
</div>

<script>
const SUPABASE_URL  = 'https://fvrfiikrasezlzpaxpqz.supabase.co';
const SUPABASE_ANON = 'sb_publishable_TNksbociGaWCY53M4wCAXg_faOxEqKt';

const CODES = {
  'FORM-IFSI':    'SimCare',
  'FORM-CAFASV':  'SimVeto',
  'FORM-IFAS':    'SimAs',
  'FORM-AP':      'SimAP',
  'MEDEXPERT-ADMIN': 'admin',
};

const FILIERES = {
  'SimCare': { label:'IFSI',   emoji:'💊', cls:'ifsi',   badge:'fb-ifsi'   },
  'SimVeto': { label:'CAFASV', emoji:'🐾', cls:'cafasv', badge:'fb-cafasv' },
  'SimAs':   { label:'IFAS',   emoji:'🏥', cls:'ifas',   badge:'fb-ifas'   },
  'SimAP':   { label:'AP',     emoji:'👶', cls:'ap',     badge:'fb-ap'     },
};
const TAB_ORDER = ['tous','SimCare','SimVeto','SimAs','SimAP'];

let AVIS       = [];
let ROLE       = null;  // 'SimCare' | 'SimVeto' | 'SimAs' | 'SimAP' | 'admin'
let FILTRE_APP = 'tous';
let FILTRE_MOD = 'tous';

function esc(s){ return (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---- LOGIN ---- */
function validerCode(){
  const code = document.getElementById('code-input').value.trim().toUpperCase();
  const role = CODES[code];
  if(!role){
    document.getElementById('login-err').textContent = 'Code incorrect. Réessayez.';
    return;
  }
  sessionStorage.setItem('praxis_role', role);
  sessionStorage.setItem('praxis_code', code);
  demarrer(role);
}

function demarrer(role){
  ROLE = role;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';

  // Badge filière dans le titre
  const badge = document.getElementById('filiere-badge');
  if(role === 'admin'){
    badge.textContent = 'Admin';
    badge.className = 'filiere-badge fb-admin';
    document.getElementById('sub-text').textContent = 'Accès complet — toutes filières Praxis';
    FILTRE_APP = 'tous';
  } else {
    const f = FILIERES[role];
    badge.textContent = f.emoji + ' ' + f.label;
    badge.className = 'filiere-badge ' + f.badge;
    document.getElementById('sub-text').textContent = 'Accès restreint à votre filière · Stats globales visibles';
    FILTRE_APP = role;
  }

  charger();
}

function deconnecter(){
  sessionStorage.removeItem('praxis_role');
  sessionStorage.removeItem('praxis_code');
  ROLE = null; AVIS = []; FILTRE_APP = 'tous'; FILTRE_MOD = 'tous';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('code-input').value = '';
  document.getElementById('login-err').textContent = '';
}

/* ---- CHARGEMENT ---- */
async function charger(){
  document.getElementById('liste').innerHTML = '<div class="loading">Chargement des avis…</div>';
  try{
    const res = await fetch(SUPABASE_URL+'/rest/v1/avis?select=*&order=created_at.desc',{
      headers:{'apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON}
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    AVIS = await res.json();
    render();
  } catch(e){
    document.getElementById('liste').innerHTML = '<div class="config-warn">⚠️ Impossible de charger les avis ('+esc(e.message)+').</div>';
  }
}

/* ---- RENDER ---- */
function render(){
  renderGlobalStats();
  renderCharts();
  renderTabs();
  renderMessages();
}

function renderGlobalStats(){
  const apps = Object.keys(FILIERES);
  const total = AVIS.length;
  const nonLus = AVIS.filter(a=>!a.lu).length;
  const avecReponse = AVIS.filter(a=>a.reponse).length;
  const tauxReponse = total ? Math.round(avecReponse/total*100) : 0;

 document.getElementById('global-stats').innerHTML = `
    <div class="gstat"><div class="gstat-emoji">📨</div><div class="gstat-label">Total avis</div><div class="gstat-val">${total}</div></div>
    <div class="gstat"><div class="gstat-emoji">🔔</div><div class="gstat-label">Non lus</div><div class="gstat-val">${nonLus}</div></div>
    <div class="gstat"><div class="gstat-emoji">💬</div><div class="gstat-label">Réponses</div><div class="gstat-val">${avecReponse}</div></div>
    <div class="gstat"><div class="gstat-emoji">✅</div><div class="gstat-label">Taux réponse</div><div class="gstat-val">${tauxReponse}%</div></div>
  `;
}

function renderCharts(){
  const apps = ['SimCare','SimVeto','SimAs','SimAP'];
  const data = apps.map(app => {
    const avis = AVIS.filter(a=>a.app===app);
    const avecNote = avis.filter(a=>a.note);
    const note = avecNote.length ? (avecNote.reduce((s,a)=>s+a.note,0)/avecNote.length) : 0;
    const repondu = avis.filter(a=>a.reponse).length;
    const taux = avis.length ? Math.round(repondu/avis.length*100) : 0;
    return { app, f: FILIERES[app], count: avis.length, note, taux };
  });

  const maxCount = Math.max(...data.map(d=>d.count), 1);

  const barVolume = data.map(d=>`
    <div class="bar-row">
      <span class="bar-label">${d.f.emoji} ${d.f.label}</span>
      <div class="bar-track"><div class="bar-fill bar-${d.f.cls}" style="width:${Math.round(d.count/maxCount*100)}%"></div></div>
      <span class="bar-val" style="color:var(--em)">${d.count}</span>
    </div>`).join('');

  const barNote = data.map(d=>`
    <div class="bar-row">
      <span class="bar-label">${d.f.emoji} ${d.f.label}</span>
      <div class="bar-track"><div class="bar-fill bar-${d.f.cls}" style="width:${Math.round(d.note/5*100)}%"></div></div>
      <span class="bar-val" style="color:var(--amber)">${d.note ? d.note.toFixed(1)+'★' : '—'}</span>
    </div>`).join('');

  const barTaux = data.map(d=>`
    <div class="bar-row">
      <span class="bar-label">${d.f.emoji} ${d.f.label}</span>
      <div class="bar-track"><div class="bar-fill bar-${d.f.cls}" style="width:${d.taux}%"></div></div>
      <span class="bar-val" style="color:var(--green)">${d.taux}%</span>
    </div>`).join('');

  const barNonLus = data.map(d=>{
    const nl = AVIS.filter(a=>a.app===d.app&&!a.lu).length;
    const pct = d.count ? Math.round(nl/d.count*100) : 0;
    return `
    <div class="bar-row">
      <span class="bar-label">${d.f.emoji} ${d.f.label}</span>
      <div class="bar-track"><div class="bar-fill bar-${d.f.cls}" style="width:${pct}%"></div></div>
      <span class="bar-val" style="color:var(--amber)">${nl}</span>
    </div>`;}).join('');

  document.getElementById('charts-grid').innerHTML = `
    <div class="chart-box"><div class="chart-title">📊 Volume d'avis</div>${barVolume}</div>
    <div class="chart-box"><div class="chart-title">⭐ Note moyenne</div>${barNote}</div>
    <div class="chart-box"><div class="chart-title">✅ Taux de réponse</div>${barTaux}</div>
    <div class="chart-box"><div class="chart-title">🔔 Non lus</div>${barNonLus}</div>
  `;
}

function renderTabs(){
  document.getElementById('tabs').innerHTML = TAB_ORDER.map(key => {
    const canAccess = ROLE==='admin' || key==='tous' || key===ROLE;
    const avisKey = key==='tous' ? AVIS : AVIS.filter(a=>a.app===key);
    const nl = avisKey.filter(a=>!a.lu).length;
    const label = key==='tous' ? 'Tous' : `${FILIERES[key].emoji} ${FILIERES[key].label}`;
    const locked = !canAccess;
    return `<button class="tab ${FILTRE_APP===key&&!locked?'active':''} ${locked?'locked':''}"
      onclick="${locked ? `showLocked('${key}')` : `setFiliere('${key}')`}">
      ${locked ? '🔒 ' : ''}${label}
      ${nl>0&&canAccess ? `<span class="badge">${nl}</span>` : ''}
    </button>`;
  }).join('');
}

function showLocked(key){
  const f = FILIERES[key];
  document.getElementById('mod-filters').innerHTML = '';
  document.getElementById('stats-zone').innerHTML = '';
  document.getElementById('liste').innerHTML = `
    <div class="locked-msg">
      <div class="lock-icon">🔒</div>
      <div>Accès restreint</div>
      <div style="font-size:12px;margin-top:8px">Les messages de la filière <b>${f.emoji} ${f.label}</b><br>sont réservés au formateur de cette filière.</div>
    </div>`;
}

function renderMessages(){
  const parFiliere = FILTRE_APP==='tous' ? AVIS : AVIS.filter(a=>a.app===FILTRE_APP);
  const modules = ['tous',...new Set(parFiliere.map(a=>a.module).filter(Boolean))];

  document.getElementById('mod-filters').innerHTML = FILTRE_APP!=='tous' && modules.length>2
    ? modules.map(m=>`<button class="mod-filter ${FILTRE_MOD===m?'active':''}" onclick="setModule('${m.replace(/'/g,"\\'")}')">
        ${m==='tous'?'Tous les modules':esc(m)}</button>`).join('')
    : '';

  const visibles = FILTRE_MOD==='tous' ? parFiliere : parFiliere.filter(a=>a.module===FILTRE_MOD);
  const nonLus = visibles.filter(a=>!a.lu).length;
  const avecNote = visibles.filter(a=>a.note);
  const moyenneNote = avecNote.length ? (avecNote.reduce((s,a)=>s+a.note,0)/avecNote.length).toFixed(1) : '—';

  document.getElementById('stats-zone').innerHTML = `
    <div class="stats">
      <div class="stat"><span class="stat-v">${visibles.length}</span><span class="stat-l">Avis reçus</span></div>
      <div class="stat"><span class="stat-v">${nonLus}</span><span class="stat-l">Non lus</span></div>
      <div class="stat"><span class="stat-v">${moyenneNote!=='—'?moyenneNote+'★':'—'}</span><span class="stat-l">Note moyenne</span></div>
    </div>`;

  if(visibles.length===0){
    document.getElementById('liste').innerHTML='<div class="empty">Aucun avis pour cette filière.</div>';
    return;
  }

  document.getElementById('liste').innerHTML = visibles.map(a=>`
    <div class="avis-card ${a.lu?'':'non-lu'}">
      <div class="avis-top">
        <div class="avis-meta">
          <span class="avis-app">${esc(a.app)}</span>${esc(a.module)}<br>
          ${esc(a.code||'?')} · ${esc(a.promo||'?')} · ${new Date(a.created_at).toLocaleString('fr-FR')}
        </div>
        <div class="avis-stars">${a.note?'⭐'.repeat(a.note):'—'}</div>
      </div>
      ${(a.aide&&a.aide.length)||a.difficulte?`
        <div class="avis-tags">
          ${(a.aide||[]).map(t=>`<span class="avis-tag">${esc(t)}</span>`).join('')}
          ${a.difficulte?`<span class="avis-tag diff">${esc(a.difficulte)}</span>`:''}
        </div>`:''}
      ${a.commentaire?`<div class="avis-comment">${esc(a.commentaire)}</div>`:''}
      ${a.reponse?`<div class="avis-reponse-existante"><b>Votre réponse</b>${esc(a.reponse)}</div>`:`
        <div class="reply-zone">
          <textarea id="reply-${a.id}" placeholder="Écrire une réponse visible par l'étudiant…"></textarea>
          <div class="reply-actions">
            <button class="btn-reply" onclick="repondre('${a.id}')">Envoyer la réponse</button>
            ${!a.lu?`<button class="btn-lu" onclick="marquerLu('${a.id}')">Marquer comme lu</button>`:''}
          </div>
        </div>`}
    </div>`).join('');
}

function setFiliere(app){ FILTRE_APP=app; FILTRE_MOD='tous'; renderTabs(); renderMessages(); }
function setModule(mod){ FILTRE_MOD=mod; renderMessages(); }

async function repondre(id){
  const texte=document.getElementById('reply-'+id).value.trim();
  if(!texte) return;
  await fetch(SUPABASE_URL+'/rest/v1/avis?id=eq.'+id,{
    method:'PATCH',
    headers:{'apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON,'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify({reponse:texte,reponse_at:new Date().toISOString(),lu:true}),
  });
  const a=AVIS.find(x=>x.id===id);
  if(a){a.reponse=texte;a.lu=true;}
  render();
}

}
