<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avis étudiants — Dashboard Praxis</title>
<style>
:root{
  --bg:#070c14; --bg2:#0c1420; --card:rgba(255,255,255,.035); --bdr:rgba(255,255,255,.09);
  --txt:#eef2f6; --txt2:#8a99a8; --em:#38bdf8; --green:#40c878; --amber:#e8a840; --red:#e85050;
  --ifsi:#38bdf8; --cafasv:#40c878; --ifas:#a78bfa; --ap:#f472b6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--txt);font-family:-apple-system,'Segoe UI',sans-serif;min-height:100vh}

/* ═══ LOGIN ═══ */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:rgba(255,255,255,.04);border:1px solid var(--bdr);border-radius:20px;padding:36px 32px;width:100%;max-width:380px;text-align:center}
.login-logo{font-size:40px;margin-bottom:12px}
.login-title{font-size:20px;font-weight:800;margin-bottom:6px}
.login-sub{font-size:13px;color:var(--txt2);margin-bottom:28px;line-height:1.5}
.login-input{width:100%;background:rgba(255,255,255,.06);border:1.5px solid var(--bdr);border-radius:10px;color:var(--txt);font-size:15px;font-weight:700;letter-spacing:2px;padding:14px 16px;text-align:center;text-transform:uppercase;outline:none;transition:border-color .2s}
.login-input:focus{border-color:var(--em)}
.login-btn{margin-top:14px;width:100%;background:linear-gradient(135deg,#0284c7,var(--em));border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:800;padding:14px;cursor:pointer;letter-spacing:.5px}
.login-err{margin-top:12px;color:var(--red);font-size:13px;min-height:18px}
.login-hint{margin-top:20px;font-size:11px;color:rgba(255,255,255,.2);line-height:1.6}

/* ═══ DASHBOARD ═══ */
#dashboard{display:none;padding:20px 16px 60px}
.wrap{max-width:720px;margin:0 auto}
.dash-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
h1{font-size:22px;font-weight:800}
.logout-btn{background:transparent;border:1px solid var(--bdr);border-radius:8px;color:var(--txt2);font-size:11px;padding:6px 12px;cursor:pointer}
.logout-btn:hover{color:var(--txt)}
.sub{color:var(--txt2);font-size:13px;margin-bottom:24px}

/* ═══ STATS GLOBALES ═══ */
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--txt2);margin-bottom:12px}
.global-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
.global-stat{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:14px 16px}
.gs-label{font-size:11px;color:var(--txt2);margin-bottom:10px;font-weight:600}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bar-row:last-child{margin-bottom:0}
.bar-filiere{font-size:10.5px;color:var(--txt2);width:52px;flex-shrink:0;font-weight:600}
.bar-track{flex:1;background:rgba(255,255,255,.06);border-radius:4px;height:7px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .6s ease}
.bar-val{font-size:10.5px;color:var(--txt);width:28px;text-align:right;flex-shrink:0;font-weight:700}
.taux-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.taux-row:last-child{margin-bottom:0}
.taux-label{font-size:11px;color:var(--txt2);font-weight:600}
.taux-bar-wrap{flex:1;margin:0 10px;background:rgba(255,255,255,.06);border-radius:4px;height:7px;overflow:hidden}
.taux-bar{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--green),#86efac)}
.taux-pct{font-size:11px;font-weight:700;color:var(--green);width:32px;text-align:right}
.nonlu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.nonlu-cell{background:rgba(255,255,255,.04);border:1px solid var(--bdr);border-radius:10px;padding:10px 8px;text-align:center}
.nonlu-v{font-size:18px;font-weight:800;display:block}
.nonlu-l{font-size:9.5px;color:var(--txt2);margin-top:2px;line-height:1.3}

/* ═══ ONGLETS ═══ */
.tabs{display:flex;gap:0;margin:24px 0 0;border-bottom:2px solid var(--bdr);overflow-x:auto}
.tab{flex-shrink:0;background:transparent;border:none;border-bottom:3px solid transparent;color:var(--txt2);padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;margin-bottom:-2px;transition:color .2s,border-color .2s;position:relative}
.tab:hover:not(.locked){color:var(--txt)}
.tab.active{color:var(--em);border-bottom-color:var(--em)}
.tab.locked{opacity:.45;cursor:not-allowed}
.tab .badge{display:inline-block;background:rgba(232,168,64,.25);color:var(--amber);font-size:10px;font-weight:800;padding:1px 6px;border-radius:8px;margin-left:5px;vertical-align:middle}
.tab.active .badge{background:rgba(56,189,248,.2);color:var(--em)}
.lock-icon{font-size:10px;margin-left:4px;opacity:.7}

/* ═══ FILTRE MODULE ═══ */
.mod-filters{display:flex;gap:6px;overflow-x:auto;margin:14px 0 10px;padding-bottom:4px}
.mod-filter{flex-shrink:0;background:rgba(255,255,255,.04);border:1px solid var(--bdr);color:var(--txt2);padding:6px 12px;border-radius:20px;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.mod-filter.active{background:rgba(56,189,248,.15);border-color:rgba(56,189,248,.4);color:var(--em)}

/* ═══ STATS FILIÈRE ═══ */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 16px}
.stat{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:12px;text-align:center}
.stat-v{font-size:20px;font-weight:800;color:var(--em);display:block}
.stat-l{font-size:10.5px;color:var(--txt2);margin-top:2px}

/* ═══ CARTES AVIS ═══ */
.avis-card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:16px;margin-bottom:12px}
.avis-card.non-lu{border-color:rgba(232,168,64,.4)}
.avis-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:10px}
.avis-meta{font-size:11px;color:var(--txt2);font-family:'Fira Mono',monospace;line-height:1.6}
.avis-app{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;margin-right:6px}
.app-SimCare{background:rgba(56,189,248,.12);color:var(--ifsi)}
.app-SimVeto{background:rgba(64,200,120,.12);color:var(--cafasv)}
.app-SimAs{background:rgba(167,139,250,.12);color:var(--ifas)}
.app-SimAP{background:rgba(244,114,182,.12);color:var(--ap)}
.avis-stars{font-size:13px;flex-shrink:0}
.avis-tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.avis-tag{background:rgba(255,255,255,.05);border:1px solid var(--bdr);color:var(--txt2);font-size:10.5px;padding:3px 9px;border-radius:12px}
.avis-tag.diff{background:rgba(232,168,64,.1);border-color:rgba(232,168,64,.3);color:var(--amber)}
.avis-comment{font-size:13.5px;color:var(--txt);line-height:1.6;margin:10px 0;padding:10px 12px;background:rgba(0,0,0,.2);border-radius:10px}
.avis-reponse-existante{font-size:13px;color:var(--green);line-height:1.6;margin:10px 0;padding:10px 12px;background:rgba(64,200,120,.08);border:1px solid rgba(64,200,120,.25);border-radius:10px}
.avis-reponse-existante b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.reply-zone textarea{width:100%;min-height:60px;background:rgba(255,255,255,.04);border:1.5px solid var(--bdr);border-radius:8px;color:var(--txt);padding:10px;font-size:13px;resize:vertical;margin-top:8px}
.reply-actions{display:flex;gap:8px;margin-top:8px}
.btn-reply{background:linear-gradient(135deg,#0284c7,var(--em));border:none;border-radius:8px;color:#fff;font-size:12.5px;font-weight:700;padding:9px 16px;cursor:pointer}
.btn-lu{background:transparent;border:1px solid var(--bdr);border-radius:8px;color:var(--txt2);font-size:12px;padding:9px 14px;cursor:pointer}
.empty{text-align:center;padding:40px 20px;color:var(--txt2);font-size:13.5px}
.loading{text-align:center;padding:30px;color:var(--txt2);font-size:13px}
.config-warn{background:rgba(232,80,80,.1);border:1px solid rgba(232,80,80,.35);color:var(--red);border-radius:10px;padding:14px 16px;font-size:13px;margin-bottom:16px}

/* ═══ LOCKED TAB CONTENT ═══ */
.locked-msg{text-align:center;padding:48px 20px;color:var(--txt2)}
.locked-msg .lock-big{font-size:40px;margin-bottom:12px}
.locked-msg p{font-size:13.5px;line-height:1.6}
</style>
</head>
<body>

<!-- ════════════════ ÉCRAN LOGIN ════════════════ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">🔐</div>
    <div class="login-title">Dashboard Praxis</div>
    <div class="login-sub">Espace formateur — avis &amp; questions étudiants<br>Saisissez votre code d'accès</div>
    <input class="login-input" id="code-input" type="password" placeholder="FORM-XXXX"
      autocomplete="off" spellcheck="false"
      onkeydown="if(event.key==='Enter')validerCode()">
    <button class="login-btn" onclick="validerCode()">Accéder au dashboard</button>
    <div class="login-err" id="login-err"></div>
    <div class="login-hint">Code communiqué par MedExpert<br>Un code par filière · Accès sécurisé</div>
  </div>
</div>

<!-- ════════════════ DASHBOARD ════════════════ -->
<div id="dashboard">
  <div class="wrap">
    <div class="dash-header">
      <div>
        <h1>💬 Avis étudiants</h1>
        <div class="sub" id="dash-sub">Toutes filières Praxis</div>
      </div>
      <button class="logout-btn" onclick="logout()">⎋ Déconnexion</button>
    </div>

    <!-- STATS GLOBALES -->
    <div class="section-title">Vue globale — toutes filières</div>
    <div class="global-stats" id="global-stats">
      <div class="loading" style="grid-column:span 2">Chargement…</div>
    </div>

    <!-- ONGLETS -->
    <div class="tabs" id="tabs"></div>

    <!-- CONTENU ONGLET -->
    <div id="tab-content"></div>
  </div>
</div>

<script>
const SUPABASE_URL  = 'https://fvrfiikrasezlzpaxpqz.supabase.co';
const SUPABASE_ANON = 'sb_publishable_TNksbociGaWCY53M4wCAXg_faOxEqKt';

const CODES = {
  'FORM-IFSI':    'SimCare',
  'FORM-CAFASV':  'SimVeto',
  'FORM-IFAS':    'SimAs',
  'FORM-AP':      'SimAP',
  'MEDEXPERT-ADMIN': 'ALL',
};

const FILIERES = [
  { key:'SimCare', label:'IFSI',   emoji:'💊', color:'var(--ifsi)'   },
  { key:'SimVeto', label:'CAFASV', emoji:'🐾', color:'var(--cafasv)' },
  { key:'SimAs',   label:'IFAS',   emoji:'🏥', color:'var(--ifas)'   },
  { key:'SimAP',   label:'AP',     emoji:'👶', color:'var(--ap)'     },
];

let AVIS = [];
let FILTRE_APP = 'tous';
let FILTRE_MOD = 'tous';
let ACCES = null; // 'ALL' ou 'SimCare' etc.

function esc(s){ return (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ── LOGIN ── */
function validerCode(){
  const val = document.getElementById('code-input').value.trim().toUpperCase();
  if(CODES[val] !== undefined){
    ACCES = CODES[val];
    sessionStorage.setItem('praxis_form_acces', ACCES);
    sessionStorage.setItem('praxis_form_code', val);
    lancerDashboard();
  } else {
    document.getElementById('login-err').textContent = 'Code incorrect — contactez MedExpert';
    document.getElementById('code-input').value = '';
    document.getElementById('code-input').focus();
  }
}

function logout(){
  sessionStorage.removeItem('praxis_form_acces');
  sessionStorage.removeItem('praxis_form_code');
  AVIS=[]; FILTRE_APP='tous'; FILTRE_MOD='tous'; ACCES=null;
  document.getElementById('dashboard').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('code-input').value='';
  document.getElementById('login-err').textContent='';
}

function lancerDashboard(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('dashboard').style.display='block';
  // Sous-titre selon accès
  const sub = ACCES==='ALL'
    ? 'Accès administrateur — toutes filières'
    : `Filière ${FILIERES.find(f=>f.key===ACCES)?.label||ACCES} — messages &amp; statistiques globales`;
  document.getElementById('dash-sub').innerHTML = sub;
  // Onglet par défaut = sa filière (ou "tous" pour admin)
  FILTRE_APP = ACCES==='ALL' ? 'tous' : ACCES;
  charger();
}

/* ── CHARGEMENT SUPABASE ── */
async function charger(){
  document.getElementById('tab-content').innerHTML='<div class="loading">Chargement des avis…</div>';
  try{
    const res = await fetch(SUPABASE_URL+'/rest/v1/avis?select=*&order=created_at.desc',{
      headers:{'apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON}
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    AVIS = await res.json();
    renderGlobalStats();
    renderTabs();
    renderContent();
  }catch(e){
    document.getElementById('tab-content').innerHTML=
      `<div class="config-warn">⚠️ Impossible de charger les avis (${esc(e.message)}).</div>`;
  }
}

/* ── STATS GLOBALES ── */
function renderGlobalStats(){
  const maxAvis = Math.max(...FILIERES.map(f=>AVIS.filter(a=>a.app===f.key).length),1);
  const maxNote = 5;

  const notesHTML = FILIERES.map(f=>{
    const liste = AVIS.filter(a=>a.app===f.key && a.note);
    const moy = liste.length ? (liste.reduce((s,a)=>s+a.note,0)/liste.length) : 0;
    const pct = (moy/maxNote*100).toFixed(0);
    return `<div class="bar-row">
      <span class="bar-filiere">${f.emoji} ${f.label}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${f.color}"></div></div>
      <span class="bar-val">${moy?moy.toFixed(1)+'★':'—'}</span>
    </div>`;
  }).join('');

  const volumeHTML = FILIERES.map(f=>{
    const n = AVIS.filter(a=>a.app===f.key).length;
    const pct = (n/maxAvis*100).toFixed(0);
    return `<div class="bar-row">
      <span class="bar-filiere">${f.emoji} ${f.label}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${f.color}"></div></div>
      <span class="bar-val">${n}</span>
    </div>`;
  }).join('');

  const tauxHTML = FILIERES.map(f=>{
    const liste = AVIS.filter(a=>a.app===f.key);
    const rep = liste.filter(a=>a.reponse).length;
    const pct = liste.length ? Math.round(rep/liste.length*100) : 0;
    return `<div class="taux-row">
      <span class="taux-label">${f.emoji} ${f.label}</span>
      <div class="taux-bar-wrap"><div class="taux-bar" style="width:${pct}%"></div></div>
      <span class="taux-pct">${pct}%</span>
    </div>`;
  }).join('');

  const nonLuHTML = FILIERES.map(f=>{
    const nl = AVIS.filter(a=>a.app===f.key && !a.lu).length;
    return `<div class="nonlu-cell">
      <span class="nonlu-v" style="color:${nl>0?'var(--amber)':'var(--green)'}">${nl}</span>
      <span class="nonlu-l">${f.emoji}<br>${f.label}</span>
    </div>`;
  }).join('');

  document.getElementById('global-stats').innerHTML = `
    <div class="global-stat">
      <div class="gs-label">⭐ Notes moyennes</div>${notesHTML}
    </div>
    <div class="global-stat">
      <div class="gs-label">📊 Volume d'avis</div>${volumeHTML}
    </div>
    <div class="global-stat" style="grid-column:span 2">
      <div class="gs-label">💬 Taux de réponse</div>${tauxHTML}
    </div>
    <div class="global-stat" style="grid-column:span 2">
      <div class="gs-label">🔔 Non lus par filière</div>
      <div class="nonlu-grid">${nonLuHTML}</div>
    </div>`;
}

/* ── ONGLETS ── */
function renderTabs(){
  const tabs = [
    {key:'tous', label:'Tous', emoji:'📋'},
    ...FILIERES
  ];
  document.getElementById('tabs').innerHTML = tabs.map(t=>{
    const isLocked = ACCES!=='ALL' && t.key!=='tous' && t.key!==ACCES;
    const nl = t.key==='tous'
      ? AVIS.filter(a=>!a.lu).length
      : AVIS.filter(a=>a.app===t.key && !a.lu).length;
    const badge = nl>0 && !isLocked ? `<span class="badge">${nl}</span>` : '';
    const lock  = isLocked ? `<span class="lock-icon">🔒</span>` : '';
    const label = t.key==='tous' ? 'Tous' : `${t.emoji} ${t.label}`;
    return `<button class="tab ${FILTRE_APP===t.key?'active':''} ${isLocked?'locked':''}"
      onclick="${isLocked?'alertCadenas()':'setFiliere(\''+t.key+'\')'}"
    >${label}${badge}${lock}</button>`;
  }).join('');
}

function alertCadenas(){
  // petit feedback discret, pas d'alert()
  const err = document.createElement('div');
  err.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(232,80,80,.15);border:1px solid rgba(232,80,80,.4);color:var(--red);padding:10px 20px;border-radius:10px;font-size:13px;z-index:999;pointer-events:none';
  err.textContent='🔒 Accès réservé au formateur de cette filière';
  document.body.appendChild(err);
  setTimeout(()=>err.remove(), 2500);
}

/* ── CONTENU ONGLET ── */
function renderContent(){
  // Onglet verrouillé ?
  if(ACCES!=='ALL' && FILTRE_APP!=='tous' && FILTRE_APP!==ACCES){
    document.getElementById('tab-content').innerHTML=`
      <div class="locked-msg">
        <div class="lock-big">🔒</div>
        <p>Les messages de cette filière sont réservés<br>au formateur habilité.</p>
      </div>`;
    return;
  }

  const parFiliere = FILTRE_APP==='tous' ? AVIS : AVIS.filter(a=>a.app===FILTRE_APP);

  // Filtre module (sauf onglet Tous)
  const modules = ['tous',...new Set(parFiliere.map(a=>a.module).filter(Boolean))];
  const modFiltersHTML = FILTRE_APP!=='tous' && modules.length>2
    ? `<div class="mod-filters">${modules.map(m=>
        `<button class="mod-filter ${FILTRE_MOD===m?'active':''}" onclick="setModule(${JSON.stringify(m)})">${m==='tous'?'Tous les modules':esc(m)}</button>`
      ).join('')}</div>`
    : '';

  const visibles = FILTRE_MOD==='tous' ? parFiliere : parFiliere.filter(a=>a.module===FILTRE_MOD);

  const nonLus = visibles.filter(a=>!a.lu).length;
  const avecNote = visibles.filter(a=>a.note);
  const moy = avecNote.length ? (avecNote.reduce((s,a)=>s+a.note,0)/avecNote.length).toFixed(1) : '—';

  const statsHTML=`<div class="stats">
    <div class="stat"><span class="stat-v">${visibles.length}</span><span class="stat-l">Avis reçus</span></div>
    <div class="stat"><span class="stat-v">${nonLus}</span><span class="stat-l">Non lus</span></div>
    <div class="stat"><span class="stat-v">${moy!=='—'?moy+'★':'—'}</span><span class="stat-l">Note moyenne</span></div>
  </div>`;

  const listeHTML = visibles.length===0
    ? '<div class="empty">Aucun avis pour le moment.</div>'
    : visibles.map(a=>`
      <div class="avis-card ${a.lu?'':'non-lu'}">
        <div class="avis-top">
          <div class="avis-meta">
            <span class="avis-app app-${esc(a.app)}">${esc(a.app)}</span>${esc(a.module)}<br>
            ${esc(a.code||'?')} · ${esc(a.promo||'?')} · ${new Date(a.created_at).toLocaleString('fr-FR')}
          </div>
          <div class="avis-stars">${a.note?'⭐'.repeat(a.note):'—'}</div>
        </div>
        ${(a.aide&&a.aide.length)||a.difficulte?`
          <div class="avis-tags">
            ${(a.aide||[]).map(t=>`<span class="avis-tag">${esc(t)}</span>`).join('')}
            ${a.difficulte?`<span class="avis-tag diff">${esc(a.difficulte)}</span>`:''}
          </div>`:''}
        ${a.commentaire?`<div class="avis-comment">${esc(a.commentaire)}</div>`:''}
        ${a.reponse?`<div class="avis-reponse-existante"><b>Votre réponse</b>${esc(a.reponse)}</div>`:`
          <div class="reply-zone">
            <textarea id="reply-${a.id}" placeholder="Écrire une réponse visible par l'étudiant à sa prochaine visite…"></textarea>
            <div class="reply-actions">
              <button class="btn-reply" onclick="repondre('${a.id}')">Envoyer la réponse</button>
              ${!a.lu?`<button class="btn-lu" onclick="marquerLu('${a.id}')">Marquer comme lu</button>`:''}
            </div>
          </div>`}
      </div>`).join('');

  document.getElementById('tab-content').innerHTML = modFiltersHTML + statsHTML + listeHTML;
}

function setFiliere(app){
  FILTRE_APP=app; FILTRE_MOD='tous';
  renderTabs(); renderContent();
}
function setModule(mod){ FILTRE_MOD=mod; renderContent(); }

/* ── RÉPONSE & LU ── */
async function repondre(id){
  const texte=document.getElementById('reply-'+id).value.trim();
  if(!texte) return;
  await fetch(SUPABASE_URL+'/rest/v1/avis?id=eq.'+id,{
    method:'PATCH',
    headers:{'apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON,
      'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify({reponse:texte,reponse_at:new Date().toISOString(),lu:true}),
  });
  const a=AVIS.find(x=>x.id===id);
  if(a){a.reponse=texte;a.lu=true;}
  renderTabs(); renderContent(); renderGlobalStats();
}

async function marquerLu(id){
  await fetch(SUPABASE_URL+'/rest/v1/avis?id=eq.'+id,{
    method:'PATCH',
    headers:{'apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON,
      'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify({lu:true}),
  });
  const a=AVIS.find(x=>x.id===id);
  if(a) a.lu=true;
  renderTabs(); renderContent(); renderGlobalStats();
}
