<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PraxisConstantes · Outil pédagogique IFSI</title>
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@300;400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1018;--bg2:#121820;--card:rgba(255,255,255,.04);--bdr:rgba(255,255,255,.08);
  --txt:#d8e4f0;--txt2:#4a6080;--em:#40c8e0;--em2:#2090a8;
  --ok:#30d880;--warn:#f0b030;--crit:#f04040;
  --mono:'Azeret Mono',monospace;--sans:'Instrument Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);
  min-height:100vh;padding-bottom:80px;overflow-x:hidden;position:relative}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70% 40% at 50% 0%,rgba(64,200,224,.06) 0%,transparent 55%),
    radial-gradient(ellipse 40% 30% at 20% 90%,rgba(48,216,128,.04) 0%,transparent 45%);
  background-image:linear-gradient(rgba(64,200,224,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(64,200,224,.025) 1px,transparent 1px);
  background-size:48px 48px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px;position:relative;z-index:1}
.site-header{padding:40px 22px 24px;text-align:center;position:relative;z-index:1}
.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(64,200,224,.08);
  border:1px solid rgba(64,200,224,.2);color:var(--em);padding:4px 16px;border-radius:3px;
  font-family:var(--mono);font-size:10px;letter-spacing:3px;text-transform:uppercase;margin-bottom:14px}
.site-header h1{font-family:var(--mono);font-size:clamp(28px,5vw,52px);font-weight:700;
  letter-spacing:-2px;line-height:1;margin-bottom:8px}
.site-header h1 span{color:var(--em)}
.site-header p{color:var(--txt2);font-size:12px;font-family:var(--mono);letter-spacing:1px}
.tabs{display:flex;gap:3px;padding:0 0 18px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:7px 14px;border-radius:3px;border:1.5px solid var(--bdr);background:rgba(255,255,255,.02);
  color:var(--txt2);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;
  font-family:var(--mono);letter-spacing:1px;-webkit-tap-highlight-color:transparent}
.tab:hover{color:var(--txt);background:rgba(64,200,224,.05)}
.tab.active{background:rgba(64,200,224,.1);border-color:rgba(64,200,224,.35);color:var(--em)}
.card{background:var(--card);border:1.5px solid var(--bdr);border-radius:8px;padding:22px;
  margin-bottom:12px;position:relative;z-index:1}
.card.em{border-top:2px solid var(--em)}
.card-title{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:1px;margin-bottom:4px}
.card-sub{color:var(--txt2);font-size:12px;margin-bottom:16px;line-height:1.65;font-family:var(--mono)}
.profil-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.profil-btn{padding:10px 8px;border-radius:4px;border:1.5px solid var(--bdr);
  background:rgba(255,255,255,.02);cursor:pointer;text-align:center;transition:all .2s;
  -webkit-tap-highlight-color:transparent}
.profil-btn:hover{background:rgba(64,200,224,.06)}
.profil-btn.active{background:rgba(64,200,224,.12);border-color:rgba(64,200,224,.4)}
.profil-icon{font-size:22px;display:block;margin-bottom:5px}
.profil-label{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--txt2)}
.profil-btn.active .profil-label{color:var(--em)}
.cst-card{background:rgba(0,0,0,.25);border:1.5px solid var(--bdr);border-radius:6px;
  padding:16px;margin-bottom:8px;display:grid;grid-template-columns:auto 1fr auto;
  align-items:center;gap:14px;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
.cst-card:hover{background:rgba(0,0,0,.35)}
.cst-card.open{border-color:rgba(64,200,224,.3)}
.cst-icon{font-size:26px;flex-shrink:0}
.cst-nom{font-family:var(--mono);font-size:14px;font-weight:600;margin-bottom:3px}
.cst-abbr{font-family:var(--mono);font-size:10px;color:var(--txt2);letter-spacing:2px}
.cst-zone{text-align:right;font-family:var(--mono);font-size:11px;padding:4px 10px;
  border-radius:20px;font-weight:600}
.zone-ok{background:rgba(48,216,128,.12);color:var(--ok);border:1px solid rgba(48,216,128,.25)}
.cst-detail{grid-column:1/-1;font-size:12px;color:var(--txt2);line-height:1.7;display:none;
  margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06)}
.cst-card.open .cst-detail{display:block}
.zones-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.zone-item{background:rgba(0,0,0,.3);border-radius:4px;padding:8px;text-align:center}
.zone-val{font-family:var(--mono);font-size:12px;font-weight:700;margin-bottom:2px}
.zone-lbl{font-family:var(--mono);font-size:9px;color:var(--txt2);letter-spacing:1px;text-transform:uppercase}
.bio-section{margin-bottom:16px}
.bio-title{font-family:var(--mono);font-size:10px;letter-spacing:3px;text-transform:uppercase;
  color:var(--em);margin-bottom:8px}
.bio-row{display:grid;grid-template-columns:1.2fr 1fr;align-items:center;gap:10px;
  padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px}
.bio-row:last-child{border-bottom:none}
.bio-row:hover{background:rgba(255,255,255,.02);border-radius:4px}
.bio-norm{font-family:var(--mono);font-size:11px;color:var(--txt2)}
.news-param{background:rgba(0,0,0,.2);border-radius:4px;padding:12px;margin-bottom:8px}
.news-lbl{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--txt2);margin-bottom:8px}
.news-opts{display:flex;gap:4px;flex-wrap:wrap}
.news-opt{padding:5px 11px;border-radius:3px;font-family:var(--mono);font-size:11px;
  border:1.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);
  color:var(--txt2);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.news-opt:hover{border-color:rgba(64,200,224,.3);color:var(--txt)}
.sel0{border-color:var(--ok)!important;color:var(--ok)!important;background:rgba(48,216,128,.1)!important}
.sel1,.sel2{border-color:var(--warn)!important;color:var(--warn)!important;background:rgba(240,176,48,.1)!important}
.sel3{border-color:var(--crit)!important;color:var(--crit)!important;background:rgba(240,64,64,.12)!important}
.score-box{border-radius:6px;padding:18px;text-align:center;border:2px solid var(--bdr);transition:border-color .4s}
.score-num{font-family:var(--mono);font-size:64px;font-weight:700;line-height:1;margin-bottom:6px}
.score-lbl{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:1px;margin-bottom:6px}
.score-act{font-size:12px;color:var(--txt2);line-height:1.65}
.quiz-opt{padding:11px 14px;border-radius:4px;border:1.5px solid var(--bdr);
  background:rgba(255,255,255,.02);color:var(--txt2);cursor:pointer;font-size:13px;
  margin-bottom:7px;transition:all .15s;display:flex;align-items:center;gap:10px;
  -webkit-tap-highlight-color:transparent}
.quiz-opt:hover{background:rgba(64,200,224,.05);color:var(--txt)}
.quiz-opt.correct{background:rgba(48,216,128,.1);border-color:rgba(48,216,128,.4);color:var(--ok)}
.quiz-opt.wrong{background:rgba(240,64,64,.1);border-color:rgba(240,64,64,.4);color:var(--crit)}
.quiz-expl{background:rgba(64,200,224,.05);border:1px solid rgba(64,200,224,.15);border-radius:4px;
  padding:11px 13px;margin-top:10px;font-size:12px;color:var(--txt2);line-height:1.7}
.quiz-expl strong{color:var(--txt)}
.info{border-radius:4px;padding:10px 13px;font-size:12px;line-height:1.75;margin-bottom:10px}
.info-em{background:rgba(64,200,224,.06);border-left:3px solid rgba(64,200,224,.5);color:var(--em)}
.info-ok{background:rgba(48,216,128,.06);border-left:3px solid rgba(48,216,128,.5);color:var(--ok)}
.info-warn{background:rgba(240,176,48,.06);border-left:3px solid rgba(240,176,48,.5);color:var(--warn)}
.info-crit{background:rgba(240,64,64,.06);border-left:3px solid rgba(240,64,64,.5);color:var(--crit)}
.btn-p{background:linear-gradient(135deg,var(--em2),var(--em));border:none;border-radius:4px;
  color:#0c1018;font-family:var(--mono);font-size:13px;font-weight:700;padding:11px 24px;
  cursor:pointer;transition:opacity .2s,transform .1s;letter-spacing:1px}
.btn-p:hover{opacity:.9;transform:translateY(-1px)}
.btn-g{background:rgba(255,255,255,.03);border:1.5px solid var(--bdr);border-radius:4px;
  color:var(--txt2);font-family:var(--sans);font-size:12px;font-weight:600;
  padding:9px 16px;cursor:pointer;transition:all .15s}
.btn-g:hover{background:rgba(64,200,224,.05);color:var(--txt)}
.btn-full{width:100%}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.col8{display:flex;flex-direction:column;gap:8px}
.progress-wrap{background:rgba(255,255,255,.06);border-radius:2px;height:7px;overflow:hidden;margin:6px 0}
.progress-bar{height:100%;border-radius:2px;transition:width .5s ease}
.dots{text-align:center;padding:22px 0}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--em);
  margin:0 3px;animation:dotB 1.4s ease-in-out infinite both}
.dots span:nth-child(2){animation-delay:.16s}.dots span:nth-child(3){animation-delay:.32s}
.dots-msg{color:var(--txt2);font-size:12px;margin-top:10px;font-family:var(--mono)}
.analysis p{margin-bottom:13px;font-size:14px;line-height:1.85;color:#5878a0}
.analysis strong{color:var(--txt)}
.apikey-box{background:rgba(64,200,224,.04);border:1px solid rgba(64,200,224,.12);
  border-radius:4px;padding:11px}
.apikey-box p{font-size:12px;color:var(--txt2);margin-bottom:9px;line-height:1.6}
.apikey-box a{color:var(--em)}
.apikey-row{display:flex;gap:6px}
.apikey-row input{flex:1;padding:8px 10px;font-size:11px;background:rgba(255,255,255,.04);
  border:1.5px solid rgba(255,255,255,.08);border-radius:4px;color:var(--txt);
  font-family:var(--mono);outline:none}
.apikey-row input:focus{border-color:rgba(64,200,224,.3)}
.apikey-row button{padding:8px 12px;border:none;border-radius:4px;background:var(--em2);
  color:#0c1018;font-weight:700;cursor:pointer;font-size:11px}
hr.div{border:none;border-top:1px solid rgba(255,255,255,.06);margin:14px 0}
.pts{display:flex;flex-direction:column;gap:10px;margin:16px 0;text-align:left}
.pt{display:flex;gap:12px;align-items:flex-start}
.pt-i{font-size:18px;flex-shrink:0;margin-top:2px}
.pt-t{font-size:14px;color:var(--txt2);line-height:1.65}
.pt-t strong{color:var(--txt)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes dotB{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
.fadeup{animation:fadeUp .3s ease forwards}
@media(max-width:480px){.profil-grid{grid-template-columns:repeat(2,1fr)}.zones-grid{grid-template-columns:1fr 1fr}}

</style>
</head>
<body>
<div id="app"></div>
<button class="btn-audio" id="btn-audio" onclick="lireOnglet()">🔊 Écouter</button>
<script>
// Données profils
var PROFILS = [
  {id:'adulte',icon:'🧑',label:'Adulte',age:'18-64 ans'},
  {id:'senior',icon:'👴',label:'65 ans+',age:'Senior'},
  {id:'enfant',icon:'🧒',label:'Enfant',age:'6-12 ans'},
  {id:'neonat',icon:'👶',label:'Nourrisson',age:'0-28 jours'},
];

// Constantes vitales
var CONSTANTES = [
  {
    id:'pa',icon:'❤️',nom:'Pression Artérielle',abbr:'PA',unite:'mmHg',
    normes:{
      adulte:{ok:'120/80 mmHg',alerte:'> 140/90 ou < 90/60',critique:'> 180/110 ou < 80/50',
        info:'Mesurer en position assise après 5 min de repos. Brassard au niveau du coeur. Toujours noter les deux chiffres (systolique/diastolique). Comparer les deux bras lors du premier examen.',
        zones:[{v:'< 80/50',l:'Choc',c:'crit'},{v:'90-120',l:'Normal',c:'ok'},{v:'> 140/90',l:'HTA',c:'warn'},{v:'> 180',l:'Urgence HTA',c:'crit'}]},
      senior:{ok:'130-150/70-90 mmHg',alerte:'> 160/90 ou < 100/60',critique:'> 180/110 ou < 80/50',
        info:'Chez la personne âgée, une PAS entre 130 et 150 mmHg est souvent acceptable. Attention aux hypotensions orthostatiques. Mesurer couché ET debout (delta > 20 mmHg = hypotension orthostatique).',
        zones:[]},
      enfant:{ok:'100-120/60-80 mmHg',alerte:'< 80/50 ou > 130/80',critique:'< 60/40',
        info:'La PA normale chez l\'enfant : PAS = 80 + (2 x âge en années). Utiliser un brassard adapté (largeur = 2/3 de la longueur du bras).',
        zones:[]},
      neonat:{ok:'60-90/30-60 mmHg',alerte:'< 40/20 ou > 90/60',critique:'< 30/20',
        info:'PA mesurée au membre inférieur ou supérieur. PAS normale environ 60-80 mmHg. Monitorage continu en néonatalogie.',
        zones:[]},
    }
  },
  {
    id:'fc',icon:'💓',nom:'Fréquence Cardiaque',abbr:'FC',unite:'bpm',
    normes:{
      adulte:{ok:'60-100 bpm',alerte:'< 50 ou > 100',critique:'< 40 ou > 130',
        info:'Mesurer au pouls radial pendant 60 secondes. Noter le rythme (régulier/irrégulier) et la force du pouls. Tachycardie > 100 bpm. Bradycardie < 60 bpm.',
        zones:[{v:'< 40',l:'Bradycardie sévère',c:'crit'},{v:'40-60',l:'Bradycardie',c:'warn'},{v:'60-100',l:'Normal',c:'ok'},{v:'100-130',l:'Tachycardie',c:'warn'},{v:'> 130',l:'Tachycardie sévère',c:'crit'}]},
      senior:{ok:'55-90 bpm',alerte:'< 50 ou > 100',critique:'< 40 ou > 120',
        info:'Une bradycardie modérée peut être liée aux beta-bloquants. Toujours corréler avec la clinique et les traitements.',
        zones:[]},
      enfant:{ok:'70-120 bpm',alerte:'< 60 ou > 130',critique:'< 50 ou > 180',
        info:'La FC diminue avec l\'âge. Nourrisson 120-160 bpm. Enfant 6 ans 75-115 bpm. La fièvre augmente la FC de 10-15 bpm par degré.',
        zones:[]},
      neonat:{ok:'120-160 bpm',alerte:'< 100 ou > 160',critique:'< 80 ou > 180',
        info:'FC normale du nouveau-né 120-160 bpm. En dessous de 100 bpm : bradycardie à signaler immédiatement.',
        zones:[]},
    }
  },
  {
    id:'fr',icon:'🌬️',nom:'Fréquence Respiratoire',abbr:'FR',unite:'/min',
    normes:{
      adulte:{ok:'12-20 /min',alerte:'< 10 ou > 24',critique:'< 8 ou > 30',
        info:'La FR est le paramètre vital le plus prédictif d\'une dégradation — et le plus souvent omis. Compter pendant 60 secondes complètes. Ne pas prévenir le patient pour éviter le biais conscient.',
        zones:[{v:'< 8',l:'Apnée',c:'crit'},{v:'8-12',l:'Bradypnée',c:'warn'},{v:'12-20',l:'Normal',c:'ok'},{v:'20-25',l:'Polypnée',c:'warn'},{v:'> 25',l:'Détresse',c:'crit'}]},
      senior:{ok:'14-22 /min',alerte:'< 10 ou > 25',critique:'< 8 ou > 30',
        info:'Une FR à 20/min chez la personne âgée peut signer une pneumopathie. Les réserves respiratoires sont diminuées. FR > 25/min = signe d\'alarme sérieux.',
        zones:[]},
      enfant:{ok:'20-30 /min',alerte:'< 15 ou > 40',critique:'< 10 ou > 50',
        info:'La FR normale est plus élevée chez l\'enfant. Nourrisson 40-60/min. La polypnée est le premier signe de détresse respiratoire pédiatrique.',
        zones:[]},
      neonat:{ok:'40-60 /min',alerte:'< 30 ou > 60',critique:'< 20 ou > 80',
        info:'Des pauses de 5-10 secondes sont normales. L\'apnée (> 20 secondes) est pathologique. Le geignement (grunting) = détresse respiratoire.',
        zones:[]},
    }
  },
  {
    id:'spo2',icon:'🩺',nom:'Saturation en O₂',abbr:'SpO₂',unite:'%',
    normes:{
      adulte:{ok:'95-100%',alerte:'92-94%',critique:'< 92%',
        info:'Mesure au bout du doigt, sans vernis. La SpO₂ ne mesure pas la ventilation — un patient en hypercapnie peut avoir une SpO₂ normale sous O₂. Chez le BPCO : cible 88-92%, jamais 100%.',
        zones:[{v:'< 88%',l:'Hypoxémie sévère',c:'crit'},{v:'88-92%',l:'BPCO cible',c:'warn'},{v:'92-94%',l:'Alerte',c:'warn'},{v:'95-100%',l:'Normal',c:'ok'}]},
      senior:{ok:'94-100%',alerte:'90-93%',critique:'< 90%',
        info:'Les personnes âgées BPCO : cible 88-92%. Ne pas chercher la saturation à 100%.',
        zones:[]},
      enfant:{ok:'97-100%',alerte:'94-96%',critique:'< 94%',
        info:'SpO₂ < 94% chez un enfant = signe d\'alerte. Toujours corréler avec la fréquence respiratoire.',
        zones:[]},
      neonat:{ok:'95-100%',alerte:'90-94%',critique:'< 90%',
        info:'Se normalise en 10-15 min après la naissance. Mesure au poignet droit (SpO₂ pré-ductale).',
        zones:[]},
    }
  },
  {
    id:'temp',icon:'🌡️',nom:'Température',abbr:'T°',unite:'°C',
    normes:{
      adulte:{ok:'36,5 - 37,5°C',alerte:'38-38,5°C ou 35-36,4°C',critique:'> 39°C ou < 35°C',
        info:'Varie selon le site : axillaire -0,5°C, rectale +0,5°C. Fièvre = T > 38°C. L\'hypothermie (< 36°C) est sous-diagnostiquée, notamment dans les sepsis et chez les personnes âgées.',
        zones:[{v:'< 35°C',l:'Hypothermie',c:'crit'},{v:'35-36,4°C',l:'Subfébrile',c:'warn'},{v:'36,5-37,5°C',l:'Normal',c:'ok'},{v:'38-39°C',l:'Fièvre',c:'warn'},{v:'> 39°C',l:'Hyperthermie',c:'crit'}]},
      senior:{ok:'36 - 37,4°C',alerte:'> 37,5°C ou < 35,5°C',critique:'> 39°C ou < 35°C',
        info:'La réponse thermique est atténuée chez la personne âgée. Un sepsis peut se manifester sans fièvre. T° > 37,5°C = signe à ne pas négliger.',
        zones:[]},
      enfant:{ok:'36,5 - 37,5°C',alerte:'38-40°C ou < 36°C',critique:'> 40°C ou < 35°C',
        info:'Convulsions fébriles liées à la rapidité de montée. Mesure rectale de référence avant 2 ans.',
        zones:[]},
      neonat:{ok:'36,5 - 37,5°C',alerte:'< 36,5°C ou > 37,8°C',critique:'< 35,5°C ou > 38,5°C',
        info:'L\'hypothermie est la principale cause de mortalité néonatale évitable. Contact peau à peau et bonnet dès la naissance.',
        zones:[]},
    }
  },
  {
    id:'glyc',icon:'🩸',nom:'Glycémie capillaire',abbr:'HGT',unite:'g/L',
    normes:{
      adulte:{ok:'0,7 - 1,4 g/L (à jeun)',alerte:'0,5-0,69 ou > 1,8',critique:'< 0,5 ou > 3,0',
        info:'Nettoyer le doigt à l\'eau (pas à l\'alcool). Essuyer la première goutte, utiliser la deuxième. Vérifier la date de péremption des bandelettes.',
        zones:[{v:'< 0,5',l:'Hypo sévère',c:'crit'},{v:'0,5-0,7',l:'Hypoglycémie',c:'warn'},{v:'0,7-1,4',l:'Normal',c:'ok'},{v:'1,4-2,0',l:'Post-prandial',c:'warn'},{v:'> 2,0',l:'Hyperglycémie',c:'crit'}]},
      senior:{ok:'0,7 - 1,6 g/L',alerte:'< 0,6 ou > 2,0',critique:'< 0,5 ou > 3,0',
        info:'Chez la personne âgée diabétique, les signes d\'hypoglycémie peuvent être atypiques : confusion, chute, malaise sans sueurs.',
        zones:[]},
      enfant:{ok:'0,7 - 1,2 g/L',alerte:'< 0,6 ou > 1,5',critique:'< 0,4 ou > 2,5',
        info:'Seuil d\'alerte : < 0,6 g/L. Resucrage immédiat si conscient.',
        zones:[]},
      neonat:{ok:'0,4 - 0,7 g/L',alerte:'< 0,4 ou > 0,8',critique:'< 0,25',
        info:'Hypoglycémie néonatale définie par < 0,4 g/L dans les 48 premières heures. Allaitement précoce et fréquent.',
        zones:[]},
    }
  },
  {
    id:'gcs',icon:'🧠',nom:'Conscience — GCS',abbr:'GCS',unite:'/15',
    normes:{
      adulte:{ok:'15/15',alerte:'13-14/15',critique:'< 13/15',
        info:'3 composantes : Yeux (1-4) + Verbal (1-5) + Moteur (1-6). GCS 15 = conscient. GCS < 8 = coma, risque d\'obstruction des voies aériennes → PLS si ventilation présente.',

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function md(t){
  return t.split('\n\n').filter(function(p){return p.trim();}).map(function(para){
    var parts=para.split(/\*\*([^*]+)\*\*/g);
    var inner=parts.map(function(p,i){return i%2===1?'<strong>'+esc(p)+'</strong>':esc(p);}).join('');
    return '<p>'+inner+'</p>';
  }).join('');
}
function nc(s){
  if(s<=1)return 'var(--ok)';
  if(s<=4)return 'var(--ok)';
  if(s<=6)return 'var(--warn)';
  return 'var(--crit)';
}
function nl(s){
  if(s<=1)return 'Faible risque';
  if(s<=4)return 'Risque modéré';
  if(s<=6)return 'Risque élevé';
  if(s<=8)return 'RISQUE MAJEUR';
  return 'URGENCE VITALE';
}
function na(s){
  if(s<=1)return 'Surveillance standard. Mesures toutes les 6-12h.';
  if(s<=4)return 'Alerte équipe soignante. Réévaluation toutes les 4-6h.';
  if(s<=6)return 'Appel médecin urgent. Réévaluation toutes les 30 min.';
  if(s<=8)return 'Urgence — appel médecin IMMÉDIAT. Monitoring continu.';
  return 'URGENCE VITALE — activation équipe réanimation. Ne pas laisser seul.';
}

  try{
    var h={'Content-Type':'application/json'};
    if(S.apiKey){h['x-api-key']=S.apiKey;h['anthropic-version']='2023-06-01';}
    var res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:h,
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:900,
        messages:[{role:'user',content:'Tu es formateur IFSI expert en semiologie et surveillance clinique. Analyse ce bilan de constantes :\n\n'
          +el.value+'\n\nAnalyse en 3 parties :\n**Lecture du bilan** — valeurs normales, alertes, critiques\n**Interpretation clinique** — signification de ce tableau\n**Conduite IDE** — actions dans ordre de priorite\n\nTutoie l etudiant. Sois direct. Utilise **gras** pour les points cles.'}]})
    });
    var data=await res.json();
    if(data.error)throw new Error(data.error.message);
    S.analyse=data.content&&data.content.find(function(b){return b.type==='text';})?data.content.find(function(b){return b.type==='text';}).text:'';
  }catch(e){S.analyse='**Erreur**\n\n'+e.message;}
  S.loading=false;render();
}
var _lecture = false;
function lireOnglet(){
  if(_lecture){ stopLecture(); return; }
  if(!('speechSynthesis' in window)){ alert('Lecture audio non disponible sur ce navigateur.'); return; }
  var textes = [];
  if(S.onglet === 'constantes'){
    CONSTANTES.forEach(function(cst){
      var n = cst.normes[S.profil] || cst.normes['adulte'];
      textes.push(cst.nom + '. Valeur normale : ' + n.ok + '.');
      if(n.alerte) textes.push('Seuil d\'alerte : ' + n.alerte + '.');
      if(n.critique) textes.push('Seuil critique : ' + n.critique + '.');
    });
  } else if(S.onglet === 'biologie'){
    document.querySelectorAll('#app .bio-title, #app .bio-row, #app .info').forEach(function(el){
      var t = el.innerText.trim();
      if(t.length > 2) textes.push(t);
    });
  } else if(S.onglet === 'quiz'){
    var qc = QUIZ[S.qIdx % QUIZ.length];
    textes.push(qc.q);
    qc.opts.forEach(function(opt, i){
      textes.push(['A','B','C','D'][i] + '. ' + opt);
    });
    if(S.qShown){
      textes.push('Réponse : ' + ['A','B','C','D'][qc.rep] + '.');
      textes.push(qc.expl.replace(/\*\*/g, ''));
    }
  } else if(S.onglet === 'news2'){
    var f = nFilled();
    if(f < NEWS2.length){
      textes.push('Veuillez remplir les ' + NEWS2.length + ' paramètres pour obtenir le score NEWS2.');
      NEWS2.forEach(function(p){ textes.push(p.lbl); });
    } else {
      var t = nTotal();
      textes.push('Score NEWS2 : ' + t + '. ' + nl(t) + '.');
      textes.push(na(t));
    }
    textes.push('Rappel : score supérieur ou égal à 5, alerte médicale sans attendre. Score supérieur ou égal à 7, urgence majeure.');
  } else if(S.onglet === 'analyse'){
    if(S.loading){
      textes.push('Analyse en cours, veuillez patienter.');
    } else if(S.analyse){
      textes.push(S.analyse.replace(/\*\*/g, ''));
    } else {
      textes.push('Décrivez un bilan de constantes dans la zone de texte, puis cliquez sur Analyser ce bilan pour obtenir une interprétation.');
    }
  } else {
  
    return;
  }
  if(textes.length === 0) return;

  _lecture = true;
  document.getElementById('btn-audio').textContent = '⏹ Stop';
  var i = 0;
  function suivante(){
    if(!_lecture || i >= textes.length){ stopLecture(); return; }
    var u = new SpeechSynthesisUtterance(textes[i++]);
    u.lang = 'fr-FR';
    u.rate = 1;
    u.onend = suivante;
    u.onerror = suivante;
    speechSynthesis.speak(u);
  }
  speechSynthesis.cancel();
  suivante();
}
function stopLecture(){
  _lecture = false;
  if('speechSynthesis' in window) speechSynthesis.cancel();
  var btn = document.getElementById('btn-audio');
  if(btn) btn.textContent = '🔊 Écouter';
}

render();
</script>
