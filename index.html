<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PraxisCare · Suite pédagogique IFSI</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PraxisCare">
<meta name="theme-color" content="#04090f">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#04090f}
#home{position:fixed;inset:0;background:linear-gradient(160deg,#04090f 0%,#071220 55%,#04090f 100%);color:#e8edf2;overflow-y:auto;-webkit-overflow-scrolling:touch;font-family:'Syne',system-ui,sans-serif;display:flex;flex-direction:column;}
#module-frame{position:fixed;inset:0;width:100%;height:100%;border:none;display:none;background:#04090f;z-index:100;}
#btn-retour{position:fixed;top:env(safe-area-inset-top, 12px);left:16px;z-index:200;display:none;background:rgba(4,9,15,.9);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:8px 16px;color:#e8edf2;font-size:14px;font-weight:600;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-family:system-ui,sans-serif;}
nav{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(4,9,15,.9);position:sticky;top:0;z-index:10;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.nav-logo{font-size:22px;font-weight:700;color:#f0f4f8;font-family:Georgia,serif}
.nav-logo span{color:#38bdf8}
.nav-tag{font-size:10px;letter-spacing:2px;color:#2a3a45;border:1px solid rgba(255,255,255,.07);padding:3px 10px;border-radius:20px;font-family:monospace}
.hero{text-align:center;padding:48px 24px 36px}
.hero-badge{display:inline-block;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.25);color:#38bdf8;padding:4px 14px;border-radius:20px;font-size:11px;letter-spacing:2px;font-family:monospace;margin-bottom:18px}
.hero h1{font-family:Georgia,serif;font-size:clamp(36px,7vw,64px);font-weight:300;line-height:1.1;letter-spacing:-1px;margin-bottom:14px}
.hero h1 em{font-style:italic;color:#38bdf8}
.hero h1 strong{font-weight:700}
.hero p{font-size:15px;color:#5a7080;line-height:1.75;max-width:440px;margin:0 auto}
.modules-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px 40px;max-width:680px;margin:0 auto;width:100%;}
@media(max-width:380px){.modules-grid{grid-template-columns:1fr}}
.module-card{position:relative;border-radius:16px;padding:18px 16px;border:1.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);display:flex;flex-direction:column;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s,opacity .15s;user-select:none;-webkit-user-select:none;}
.module-card:active{transform:scale(.97);opacity:.85}
.module-card.locked{opacity:0.4;cursor:not-allowed;filter:grayscale(80%);}
.module-card.locked .module-btn{background:rgba(255,255,255,.05) !important;color:rgba(255,255,255,.2) !important;border-color:rgba(255,255,255,.05) !important;}
.module-card.locked::after{content:'🔒';position:absolute;top:12px;right:12px;font-size:16px;}
.module-num{font-family:monospace;font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.2);margin-bottom:10px}
.module-icon{font-size:28px;margin-bottom:8px}
.module-name{font-size:22px;font-weight:700;letter-spacing:-1px;margin-bottom:3px;line-height:1}
.module-sub{font-size:11px;color:#5a7080;margin-bottom:8px}
.module-desc{font-size:12px;color:#5a7080;line-height:1.6;flex:1;margin-bottom:12px}
.module-btn{display:block;text-align:center;padding:9px;border-radius:8px;font-size:12px;font-weight:700;border:1.5px solid transparent;}
footer{border-top:1px solid rgba(255,255,255,.07);padding:24px 20px;text-align:center;font-size:11px;color:#2a3a45;font-family:monospace;}
</style>

<script>
(function(){
var CODES = ['PRAXIS-A1-001','PRAXIS-A1-002','PRAXIS-A1-003','PRAXIS-A1-004','PRAXIS-A1-005',
'PRAXIS-A1-006','PRAXIS-A1-007','PRAXIS-A1-008','PRAXIS-A1-009','PRAXIS-A1-010',
'PRAXIS-A2-001','PRAXIS-A2-002','PRAXIS-A2-003','PRAXIS-A2-004','PRAXIS-A2-005',
'PRAXIS-A2-006','PRAXIS-A2-007','PRAXIS-A2-008','PRAXIS-A2-009','PRAXIS-A2-010',
'PRAXIS-A3-001','PRAXIS-A3-002','PRAXIS-A3-003','PRAXIS-A3-004','PRAXIS-A3-005',
'PRAXIS-A3-006','PRAXIS-A3-007','PRAXIS-A3-008','PRAXIS-A3-009','PRAXIS-A3-010',
'PRAXIS-FORM-01'];
var code = sessionStorage.getItem('praxiscare_code');
if(!code || CODES.indexOf(code) === -1){
window.location.replace('acces.html');
}
})();
document.addEventListener('visibilitychange', function(){
if(document.visibilityState === 'hidden'){
sessionStorage.removeItem('praxiscare_code');
sessionStorage.removeItem('praxiscare_promo');
}
});
</script>
