<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PraxisUrgences · Outil pédagogique IFSI</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Barlow:wght@300;400;500;600&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:    #0a0a08;
  --bg2:   #121210;
  --card:  rgba(255,255,255,.03);
  --bdr:   rgba(255,255,255,.07);
  --txt:   #e8e8d8;
  --txt2:  #707060;
  --txt3:  #202018;
  --red:   #e83030;
  --red2:  #b01818;
  --amber: #f0b030;
  --green: #40c060;
  --blue:  #3080e0;
  --white: #f0f0e8;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Barlow',sans-serif;
  background:var(--bg);color:var(--txt);
  min-height:100vh;padding-bottom:80px;overflow-x:hidden;position:relative;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(232,48,48,.07) 0%,transparent 50%),
    radial-gradient(ellipse 40% 30% at 20% 90%, rgba(48,128,224,.04) 0%,transparent 45%);
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    repeating-linear-gradient(0deg,rgba(232,48,48,.02) 0px,rgba(232,48,48,.02) 1px,transparent 1px,transparent 40px);
}

.wrap{max-width:720px;margin:0 auto;padding:0 20px;position:relative;z-index:1}

/* ── HEADER ── */
.site-header{padding:44px 24px 24px;text-align:center;position:relative;z-index:1}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(232,48,48,.1);border:1px solid rgba(232,48,48,.3);
  color:var(--red);padding:5px 18px;border-radius:2px;
  font-family:'Fira Mono',monospace;font-size:11px;
  letter-spacing:3px;text-transform:uppercase;margin-bottom:16px;
}
.site-header h1{
  font-family:'Barlow Condensed',sans-serif;
  font-size:clamp(48px,10vw,96px);font-weight:800;
  letter-spacing:4px;text-transform:uppercase;
  line-height:.95;margin-bottom:8px;color:var(--white);
}
.site-header h1 span{color:var(--red)}
.site-header p{color:var(--txt2);font-size:13px;font-family:'Fira Mono',monospace;letter-spacing:1px}

/* ── ONGLETS ── */
.tabs{display:flex;gap:3px;padding:0 0 20px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{
  padding:8px 14px;border-radius:2px;
  border:1.5px solid var(--bdr);background:rgba(255,255,255,.02);
  color:var(--txt2);font-size:12px;font-weight:600;cursor:pointer;
  white-space:nowrap;transition:all .15s;
  font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;
  -webkit-tap-highlight-color:transparent;
}
.tab:hover{color:var(--txt);background:rgba(232,48,48,.06)}
.tab.active{background:rgba(232,48,48,.12);border-color:rgba(232,48,48,.4);color:var(--red)}

/* ── CARD ── */
.card{background:var(--card);border:1.5px solid var(--bdr);border-radius:4px;padding:22px;margin-bottom:14px;position:relative;z-index:1}
.card.red{border-top:3px solid var(--red)}
.card.amber{border-top:3px solid var(--amber)}
.card.green{border-top:3px solid var(--green)}
.card.blue{border-top:3px solid var(--blue)}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.card-sub{color:var(--txt2);font-size:13px;margin-bottom:18px;line-height:1.6}

/* ── ABCDE ── */
.abcde-row{
  display:flex;align-items:flex-start;gap:14px;
  padding:14px;border-radius:3px;margin-bottom:6px;
  border-left:4px solid transparent;background:rgba(0,0,0,.3);
  cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;
}
.abcde-row:hover{background:rgba(0,0,0,.45)}
.abcde-letter{
  font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:800;
  flex-shrink:0;width:36px;line-height:1;
}
.abcde-titre{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.abcde-desc{font-size:13px;color:var(--txt2);line-height:1.65}
.abcde-detail{font-size:12px;color:var(--txt2);line-height:1.7;display:none;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06)}
.abcde-row.open .abcde-detail{display:block}

/* ── SITUATIONS ── */
.situation-card{
  background:rgba(232,48,48,.06);border:1.5px solid rgba(232,48,48,.2);
  border-radius:4px;padding:18px;margin-bottom:10px;cursor:pointer;
  transition:all .2s;-webkit-tap-highlight-color:transparent;
}
.situation-card:hover{background:rgba(232,48,48,.1)}
.situation-card.open{border-color:rgba(232,48,48,.45)}
.situation-titre{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--red);margin-bottom:5px}
.situation-body{display:none;margin-top:12px}
.situation-card.open .situation-body{display:block}

/* ── CHOCS ── */
.choc-card{
  border-radius:4px;padding:16px;margin-bottom:8px;border-left:3px solid transparent;
  background:rgba(0,0,0,.25);cursor:pointer;transition:all .18s;-webkit-tap-highlight-color:transparent;
}
.choc-card:hover{background:rgba(0,0,0,.35)}
.choc-titre{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.choc-body{font-size:12px;color:var(--txt2);line-height:1.7;display:none;margin-top:8px}
.choc-card.open .choc-body{display:block}

/* ── SCORE NEWS2 ── */
.news-param{margin-bottom:14px}
.news-label{font-size:12px;font-family:'Fira Mono',monospace;color:var(--txt2);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}
.news-options{display:flex;gap:4px;flex-wrap:wrap}
.news-opt{
  padding:6px 12px;border-radius:2px;font-family:'Fira Mono',monospace;font-size:12px;
  border:1.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);
  color:var(--txt2);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;
}
.news-opt:hover{border-color:rgba(232,48,48,.3);color:var(--txt)}
.news-opt.on{border-color:var(--red);color:var(--red);background:rgba(232,48,48,.1)}
.news-opt.s0{border-color:var(--green);color:var(--green);background:rgba(64,192,96,.1)}
.news-opt.on.s1{border-color:var(--amber)}
.news-opt.on.s2{border-color:var(--red)}
.news-opt.on.s3{border-color:var(--red);background:rgba(232,48,48,.2)}

/* ── QUIZ ── */
.quiz-opt{
  padding:12px 16px;border-radius:3px;border:1.5px solid var(--bdr);
  background:rgba(255,255,255,.02);color:var(--txt2);
  cursor:pointer;font-size:14px;margin-bottom:8px;
  transition:all .18s;display:flex;align-items:center;gap:12px;
  -webkit-tap-highlight-color:transparent;
}
.quiz-opt:hover{background:rgba(232,48,48,.06);color:var(--txt)}
.quiz-opt.correct{background:rgba(64,192,96,.1);border-color:rgba(64,192,96,.4);color:var(--green)}
.quiz-opt.wrong  {background:rgba(232,48,48,.1); border-color:rgba(232,48,48,.4); color:var(--red)}
.quiz-expl{background:rgba(232,48,48,.05);border:1px solid rgba(232,48,48,.15);border-radius:3px;padding:12px 14px;margin-top:10px;font-size:13px;color:var(--txt2);line-height:1.7}
.quiz-expl strong{color:var(--txt)}

/* ── INFO ── */
.info{border-radius:3px;padding:11px 14px;font-size:13px;line-height:1.75;margin-bottom:12px}
.info-red  {background:rgba(232,48,48,.07);  border-left:3px solid rgba(232,48,48,.6);   color:var(--red)}
.info-amber{background:rgba(240,176,48,.07); border-left:3px solid rgba(240,176,48,.6);  color:var(--amber)}
.info-green{background:rgba(64,192,96,.07);  border-left:3px solid rgba(64,192,96,.6);   color:var(--green)}
.info-blue {background:rgba(48,128,224,.07); border-left:3px solid rgba(48,128,224,.6);  color:var(--blue)}

/* ── BOUTONS ── */
.btn-p{background:linear-gradient(135deg,var(--red2),var(--red));border:none;border-radius:3px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;padding:12px 26px;cursor:pointer;transition:opacity .2s,transform .1s;letter-spacing:2px;text-transform:uppercase;}
.btn-p:hover{opacity:.9;transform:translateY(-1px)}
.btn-g{background:rgba(255,255,255,.03);border:1.5px solid var(--bdr);border-radius:3px;color:var(--txt2);font-family:'Barlow',sans-serif;font-size:13px;font-weight:500;padding:10px 18px;cursor:pointer;transition:all .18s;}
.btn-g:hover{background:rgba(255,255,255,.06);color:var(--txt)}
.btn-full{width:100%}
.col8{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
hr.div{border:none;border-top:1px solid rgba(255,255,255,.06);margin:16px 0}

/* ── STAT ── */
.stat{background:rgba(0,0,0,.35);border:1px solid rgba(232,48,48,.1);border-radius:3px;padding:12px;text-align:center}
.stat-v{font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:800;color:var(--red);display:block;line-height:1;letter-spacing:2px}
.stat-l{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:1.5px;font-family:'Fira Mono',monospace;display:block;margin-top:4px}

/* ── PROGRESS ── */
.progress-bar-wrap{background:rgba(255,255,255,.06);border-radius:2px;height:8px;overflow:hidden;margin:6px 0}
.progress-bar{height:100%;border-radius:2px;transition:width .5s ease}

/* ── LOADING ── */
.dots{text-align:center;padding:24px 0}
.dots span{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin:0 3px;animation:dotB 1.4s ease-in-out infinite both}
.dots span:nth-child(2){animation-delay:.16s}
.dots span:nth-child(3){animation-delay:.32s}
.dots-msg{color:var(--txt2);font-size:13px;margin-top:10px;font-family:'Fira Mono',monospace}
.analysis p{margin-bottom:14px;font-size:15px;line-height:1.85;color:#806858}
.analysis strong{color:var(--txt)}

/* ── PREMIUM ── */
.premium-box{background:rgba(0,0,0,.3);border:1.5px solid rgba(232,48,48,.15);border-radius:4px;padding:24px;margin-bottom:14px}
.apikey-box{background:rgba(232,48,48,.04);border:1px solid rgba(232,48,48,.12);border-radius:3px;padding:12px}
.apikey-box p{font-size:13px;color:var(--txt2);margin-bottom:10px;line-height:1.6}
.apikey-box a{color:var(--red)}
.apikey-row{display:flex;gap:8px}
.apikey-row input{flex:1;padding:9px 12px;font-size:12px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);border-radius:3px;color:var(--txt);font-family:'Fira Mono',monospace;outline:none}
.apikey-row input:focus{border-color:rgba(232,48,48,.3)}
.apikey-row button{padding:9px 14px;border:none;border-radius:3px;background:var(--red2);color:#fff;font-weight:700;cursor:pointer;font-size:12px}
.apikey-saved{color:var(--green);font-size:11px;margin-top:5px;font-family:'Fira Mono',monospace}

/* ── WELCOME ── */
.pts{display:flex;flex-direction:column;gap:10px;margin:18px 0;text-align:left}
.pt{display:flex;gap:12px;align-items:flex-start}
.pt-i{font-size:18px;flex-shrink:0;margin-top:2px}
.pt-t{font-size:14px;color:var(--txt2);line-height:1.65}
.pt-t strong{color:var(--txt)}

/* ── ALERTE ROUGE ── */
.alerte-rouge{
  background:rgba(232,48,48,.12);border:2px solid rgba(232,48,48,.5);
  border-radius:4px;padding:14px 16px;margin-bottom:14px;
  display:flex;gap:12px;align-items:flex-start;
}
.alerte-icon{font-size:24px;flex-shrink:0}
.alerte-txt{font-size:13px;color:var(--red);line-height:1.7}
.alerte-txt strong{font-family:'Barlow Condensed',sans-serif;font-size:16px;letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:3px}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes dotB{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.fadeup{animation:fadeUp .35s ease forwards}
.pulse{animation:blink 1.5s ease infinite}
@media(max-width:480px){.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>

// ═══════════════════════════════════════
//  DONNÉES
// ═══════════════════════════════════════

const ABCDE = [
  {l:'A', col:'var(--red)',   titre:'Airway — Voies aériennes',
   check:['Parole possible ? (voies aériennes libres)','Bruit anormal ? (stridor, ronflement, silence)','Corps étranger visible ?','Position tête-cou-tronc alignée ?'],
   actions:'Libérer les voies aériennes (LVA). Subluxation mandibulaire. Aspirations si sécrétions. Canule de Guedel si inconscient. Position latérale de sécurité (PLS) si respiration présente.',
   mnemo:'A = Airway — Toujours en premier. Un patient qui parle a les voies aériennes libres.'},
  {l:'B', col:'var(--amber)', titre:'Breathing — Ventilation',
   check:['Fréquence respiratoire (normale 12-20/min)','Amplitude, symétrie des mouvements thoraciques','SpO₂','Signes de détresse : tirage, balancement thoraco-abdominal, cyanose'],
   actions:'O₂ si SpO₂ < 95% ou détresse. Masque haute concentration si SpO₂ < 90%. Ventilation au masque si apnée. Position ½ assise (orthopnée). Alerter SAMU.',
   mnemo:'B = Breathing — Regarder, écouter, sentir. 10 secondes max.'},
  {l:'C', col:'var(--red)',   titre:'Circulation — Circulation',
   check:['Pouls (présent ? rapide ? filant ?)','PA (chute = choc ?)','Signes de choc : pâleur, marbrures, extrémités froides, TRC > 3s','Saignement extériorisé'],
   actions:'Compression directe sur toute hémorragie. Garrot si membre. Position allongée jambes surélevées (sauf trauma, OAP). VVP si possible. O₂. Ne pas mobiliser si suspicion trauma.',
   mnemo:'C = Circulation — Chercher une hémorragie. Tout saignement visible = comprimer immédiatement.'},
  {l:'D', col:'var(--amber)', titre:'Disability — État neurologique',
   check:['Score de Glasgow (GCS) ou échelle AVPU (Alerte/Voix/Douleur/Aucune)','Pupilles (taille, symétrie, réactivité)','Glycémie capillaire systématique','Déficit moteur ou sensitif ?'],
   actions:'Glycémie < 0,6g/L → sucre per os si conscient, glucagon si inconscient. GCS < 8 → risque d\'inhalation → position PLS. Crise convulsive → protection, latéraliser, ne pas contraindre.',
   mnemo:'D = Disability — Toujours faire une glycémie. Un coma peut être une hypoglycémie.'},
  {l:'E', col:'var(--green)',  titre:'Exposure — Exposition',
   check:['Déshabiller le patient (chercher trauma caché, éruption, plaie)','Température (hypothermie, hyperthermie)','Contexte : médicaments, allergies, antécédents','Environnement : CO, chute, intoxication ?'],
   actions:'Couvrir après exposition pour éviter l\'hypothermie. Identifier le contexte (médicaments, intoxication). Récupérer l\'ordonnancier. Alerter l\'entourage pour contexte.',
   mnemo:'E = Exposure — Chercher ce qui se voit pas. Déshabiller = voir. Couvrir = protéger.'},
];

const SITUATIONS = [
  {
    id:'ac', titre:'ARRÊT CARDIAQUE', icon:'💔', couleur:'var(--red)',
    contexte:'M. Dupont, 58 ans, s\'effondre devant vous en unité de soins. Il est inconscient, ne respire pas (ou gasps). Vous êtes seul.',
    abcde:'A : voies aériennes libres (inconscient → PLS non, RCP) · B : absent · C : pas de pouls carotidien',
    actions:[
      '1. Appeler à l\'aide — alerter immédiatement (15, code urgence établissement)',
      '2. RCP 30 compressions thoraciques / 2 insufflations — fréquence 100-120/min — profondeur 5-6 cm',
      '3. Préparer le défibrillateur automatisé (DEA/DSA) — analyser le rythme',
      '4. Si rythme choquable (FV/TV) → choc électrique → reprendre RCP 2 min immédiatement',
      '5. Si rythme non choquable → RCP 2 min → réévaluer',
      '6. VVP si possible SANS interrompre la RCP',
      '7. Ne pas arrêter la RCP avant l\'arrivée du médecin ou après 20 min d\'asystolie inexpliquée',
    ],
    regle:'Ne jamais interrompre la RCP plus de 10 secondes pour quelque raison que ce soit.',
    ref:'SFMU — Recommandations IDE seul devant arrêt cardiaque',
  },
  {
    id:'dr', titre:'DÉTRESSE RESPIRATOIRE AIGUË', icon:'🫁', couleur:'var(--amber)',
    contexte:'Mme Chen, 72 ans, BPCO connue. FR 32/min, SpO₂ 84%, tirage sus-claviculaire, impossible de finir ses phrases. Elle est assise, penchée en avant.',
    abcde:'A : libres · B : FR 32, SpO₂ 84%, tirage, orthopnée · C : PA 148/90, FC 118 · D : consciente, anxieuse · E : BPCO, tabac 40 PA',
    actions:[
      '1. Position ½ assise ou orthopnéique — ne pas allonger',
      '2. O₂ — chez BPCO : lunettes nasales 2L/min, cible SpO₂ 88-92% (pas 100%)',
      '3. Appeler le SAMU 15 — SBAR immédiat',
      '4. Monitoring : SpO₂, FC, PA, FR en continu',
      '5. VVP de sécurité si possible',
      '6. Ne pas laisser seule — surveiller l\'évolution toutes les 5 minutes',
      '7. Préparer les aérosols bronchodilatateurs si prescription disponible',
    ],
    regle:'Chez le BPCO : JAMAIS 15L/min. L\'hypercapnie peut s\'aggraver si SpO₂ > 94%.',
    ref:'SFMU — Recommandations détresse respiratoire IDE seul',
  },
  {
    id:'choc', titre:'ÉTAT DE CHOC', icon:'🩸', couleur:'var(--red)',
    contexte:'M. Martin, 45 ans, post-opératoire J1 cholécystectomie. Il appelle : "Je ne me sens pas bien". PA 78/40 mmHg, FC 128 bpm, pâle, marbrures aux genoux, extrémités froides.',
    abcde:'A : libres · B : FR 24, SpO₂ 96% · C : PA 78/40, FC 128, pâleur, marbrures, TRC > 3s · D : conscient, agité · E : post-op J1',
    actions:[
      '1. Alerter immédiatement le médecin — appel urgent',
      '2. Position allongée, jambes surélevées à 45° (Trendelenburg modifié)',
      '3. O₂ haute concentration (masque 15L/min)',
      '4. VVP — si déjà posée, vérifier perméabilité et débit libre',
      '5. Arrêter tout médicament vasodilatateur en cours',
      '6. Monitoring complet (PA, FC, SpO₂, FR) toutes les 5 min',
      '7. Ne pas laisser seul — chercher la cause : hémorragie, allergie, infection ?',
    ],
    regle:'Un choc est une urgence vitale. Ne pas attendre pour appeler. Toujours chercher la cause.',
    ref:'SFMU — États de choc · IDE seul devant détresse médicale',
  },
  {
    id:'avc', titre:'SUSPICION D\'AVC', icon:'🧠', couleur:'var(--blue)',
    contexte:'Mme Leblanc, 68 ans. Son voisin de chambre appelle : "Elle parle bizarre et son bras gauche ne bouge plus." Début des symptômes il y a 20 minutes.',
    abcde:'A : libres · B : FR 18, SpO₂ 97% · C : PA 180/100, FC 82 · D : consciente, aphasie, déficit moteur hémicorps gauche, déviation tête vers la droite · E : HTA, anticoagulants',
    actions:[
      '1. FAST immédiat : Face (déviation), Arm (déficit), Speech (aphasie), Time (noter l\'heure exacte)',
      '2. APPELER SAMU 15 EN URGENCE — AVC = urgence temps-dépendante (thrombolyse possible < 4h30)',
      '3. Position demi-assise 30° — NE PAS ALLONGER (risque d\'inhalation)',
      '4. Monitoring : PA (ne pas traiter l\'HTA sauf ordre médical), FC, SpO₂, glycémie',
      '5. O₂ si SpO₂ < 94%',
      '6. NE PAS DONNER À BOIRE OU À MANGER (fausses routes si aphasie)',
      '7. Rassurer — répéter son prénom, expliquer calmement',
    ],
    regle:'LE TEMPS, C\'EST DU CERVEAU. 1,9 million de neurones meurent chaque minute sans traitement.',
    ref:'Sociétés Françaises de Neurologie · HAS — AVC ischémique · Thrombolyse < 4h30',
  },
  {
    id:'anaphylaxie', titre:'CHOC ANAPHYLACTIQUE', icon:'⚠️', couleur:'var(--red)',
    contexte:'M. Renard, 34 ans, reçoit une perfusion d\'amoxicilline depuis 5 min. Il se plaint de prurit, vous voyez une urticaire diffuse, il commence à avoir du mal à respirer. PA 85/50 mmHg.',
    abcde:'A : stridor débutant · B : SpO₂ 92%, sibilances · C : PA 85/50, FC 132, urticaire · D : conscient, angoissé · E : amoxicilline en cours → STOPPER',
    actions:[
      '1. ARRÊTER IMMÉDIATEMENT la perfusion (ou supprimer l\'allergène)',
      '2. APPELER LE MÉDECIN EN URGENCE — code rouge',
      '3. Position allongée jambes surélevées (SAUF si détresse respiratoire → ½ assise)',
      '4. O₂ 15L/min masque haute concentration',
      '5. VVP (ou utiliser celle en place) — sérum physiologique en attente',

const STORE_KEY='simurg';
function loadStore(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||{};}catch(e){return {};}}
function saveStore(d){try{localStorage.setItem(STORE_KEY,JSON.stringify(d));}catch(e){}}
let STORE=loadStore();
function getNews(k){return STORE['news_'+k];}
function setNews(k,s){STORE['news_'+k]=s;saveStore(STORE);}
function newsTotal(){return NEWS2_PARAMS.reduce((t,p)=>{const v=getNews(p.key);return v!==undefined?t+v:t;},0);}
function newsColor(s){return s<=4?'var(--green)':s<=6?'var(--amber)':s<=8?'var(--red)':'var(--red)';}
function newsLabel(s){return s<=1?'Faible risque':s<=4?'Risque modéré bas':s<=6?'Risque modéré':s<=8?'Risque élevé':'URGENCE VITALE';}

    <div style="display:flex;justify-content:space-between;font-family:'Fira Mono',monospace;font-size:11px;color:var(--txt2);margin-bottom:8px">
      <span>Question ${S.quizIdx%QUIZ.length+1} / ${QUIZ.length}</span>
      <span style="color:var(--red)">${S.quizTotal>0?Math.round(S.quizScore/S.quizTotal*100)+'% correct':'—'}</span>
    </div>
    <div class="progress-bar-wrap" style="margin-bottom:16px"><div class="progress-bar" style="width:${pct}%;background:linear-gradient(90deg,var(--red2),var(--red))"></div></div>
    <div class="card red">
    <div style="font-family:'Barlow',sans-serif;font-size:clamp(14px,2.5vw,17px);font-weight:600;line-height:1.5;margin-bottom:18px;color:var(--txt)">${esc(q.q)}</div>
    ${q.opts.map((opt,i)=>{let cls='';if(S.quizShown){if(i===q.rep)cls='correct';else if(i===S.quizSelected)cls='wrong';}return `<div class="quiz-opt ${cls}" onclick="${S.quizShown?'':'selectQuiz('+i+')'}"><span style="font-family:'Fira Mono',monospace;font-size:11px;flex-shrink:0">${['A','B','C','D'][i]}</span><span>${esc(opt)}</span></div>`;}).join('')}
    ${S.quizShown?`<div class="quiz-expl">${q.expl.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')}</div><button class="btn-p btn-full" style="margin-top:14px" onclick="nextQuiz()">QUESTION SUIVANTE →</button>`:''}
    </div>
    <button class="btn-g btn-full" onclick="S.quizIdx=0;S.quizScore=0;S.quizTotal=0;S.quizSelected=null;S.quizShown=false;render()" style="margin-top:8px;color:var(--green);border-color:rgba(64,192,96,.2)">↺ RECOMMENCER</button>
    </div>`;
  }

  // ── ANALYSE IA ─────────────────────────────────────────────
  else if(S.onglet==='analyse'){
    h+=`<div class="fadeup">
    <div class="card red">
    <div class="card-title" style="color:var(--red)">IA COACH — URGENCES IDE</div>
    <div class="card-sub">// Décrivez une situation d'urgence — l'IA vous aide à analyser votre conduite.</div>
    <textarea id="question-urg" style="width:100%;min-height:80px;background:rgba(0,0,0,.4);border:1.5px solid rgba(232,48,48,.15);border-radius:3px;color:var(--txt);padding:12px;font-size:13px;font-family:'Barlow',sans-serif;outline:none;resize:vertical;line-height:1.6;margin-bottom:10px" placeholder="Ex: Un patient chute dans sa chambre et est inconscient — quelle est ma conduite A B C D E ? Comment différencier un malaise vagal d'un arrêt cardiaque ? Que faire si une perfusion d'antibiotique provoque une réaction allergique ?"></textarea>
    <button class="btn-p btn-full" onclick="runAnalyse()">🚨 ANALYSER LA SITUATION →</button>
    ${S.loading?`<div class="dots" style="margin-top:16px"><span></span><span></span><span></span><div class="dots-msg">// ANALYSE EN COURS...</div></div>`:''}
    ${!S.loading&&S.analyse?`<div class="analysis fadeup" style="margin-top:16px">${renderMd(S.analyse)}</div>`:''}
    <hr class="div">
    ${!S.apiKeySaved?`<div class="apikey-box"><p>Clé API Anthropic. <a href="https://console.anthropic.com/" target="_blank">Obtenir →</a></p><div class="apikey-row"><input type="text" placeholder="sk-ant-api03-…" value="${esc(S.apiKey)}" oninput="S.apiKey=this.value"><button onclick="saveKey()">Sauver</button></div></div>`:`<div style="color:var(--green);font-family:'Fira Mono',monospace;font-size:11px">// API_KEY : configured ✓</div>`}
    </div>
    <div class="premium-box">
    <div style="text-align:center;margin-bottom:18px"><div style="font-size:32px;margin-bottom:8px">🔒</div><div style="font-family:'Barlow Condensed',sans-serif;font-size:24px;letter-spacing:3px;text-transform:uppercase;color:var(--txt);margin-bottom:5px">IA Coach — Accès Premium</div><div style="font-size:13px;color:var(--txt2)">ABCDE, situations, chocs, NEWS2 et quiz sont entièrement gratuits</div></div>
    <div class="grid3" style="margin-bottom:16px">
    ${[{who:'Module seul',price:'4,99€',desc:'PraxisUrgences à vie'},{who:'Suite complète',price:'12,99€',desc:'20 modules à vie',em:true},{who:'Institution',price:'Devis',desc:'IFSI · Syndicat'}].map(t=>`<div style="border:1.5px solid ${t.em?'rgba(232,48,48,.4)':'var(--bdr)'};border-radius:3px;padding:14px;text-align:center;background:${t.em?'rgba(232,48,48,.08)':'rgba(255,255,255,.02)'}"><div style="font-family:'Fira Mono',monospace;font-size:10px;color:${t.em?'var(--red)':'var(--txt2)'};margin-bottom:8px">${t.who}</div><div style="font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;letter-spacing:2px;color:var(--txt)">${t.price}</div><div style="font-size:11px;color:var(--txt2);margin-top:5px">${t.desc}</div></div>`).join('')}
    </div>
    <div style="text-align:center;margin-bottom:10px"><a href="mailto:contact@praxiscare.fr" style="display:inline-block;padding:12px 28px;border-radius:3px;background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;font-weight:700;font-size:14px;text-decoration:none;font-family:'Barlow Condensed',sans-serif;letter-spacing:2px;text-transform:uppercase">OBTENIR L'ACCÈS →</a></div>
    <div style="text-align:center;padding-top:10px;border-top:1px solid rgba(255,255,255,.06)"><button onclick="S.showKey=!S.showKey;render()" style="background:none;border:none;color:var(--txt2);font-size:11px;cursor:pointer;font-family:'Fira Mono',monospace">// formateur_key</button></div>
    ${S.showKey?`<div class="apikey-box" style="margin-top:12px"><p>Clé API — formateur. <a href="https://console.anthropic.com/" target="_blank">Obtenir →</a></p><div class="apikey-row"><input type="text" placeholder="sk-ant-api03-…" value="${esc(S.apiKey)}" oninput="S.apiKey=this.value"><button onclick="saveKey()">Sauver</button></div>${S.apiKeySaved?'<div class="apikey-saved">// configured ✓</div>':''}</div>`:''}
    </div></div>`;
  }

  if(S.view!=='welcome'){
    h+=`<div style="margin-top:12px"><button class="btn-g" onclick="go('welcome')" style="color:var(--red);border-color:rgba(232,48,48,.2)">← Accueil PraxisUrgences</button></div>`;
  }
  h+='</div>';
  document.getElementById('app').innerHTML=h;
}

function go(v){S.view=v;render();window.scrollTo({top:0,behavior:'smooth'});}
function setOnglet(o){S.onglet=o;S.analyse='';render();window.scrollTo({top:0,behavior:'smooth'});}
function selectQuiz(i){if(S.quizShown)return;S.quizSelected=i;S.quizShown=true;S.quizTotal++;if(i===QUIZ[S.quizIdx%QUIZ.length].rep)S.quizScore++;render();}
function nextQuiz(){S.quizIdx++;S.quizSelected=null;S.quizShown=false;render();window.scrollTo({top:0,behavior:'smooth'});}
function saveKey(){localStorage.setItem('simurg_key',S.apiKey);S.apiKeySaved=true;render();}

async function runAnalyse(){
  const q=document.getElementById('question-urg')?.value||'';
  if(!q.trim())return;
  S.loading=true;S.analyse='';render();
  try{
    const headers={'Content-Type':'application/json'};
    if(S.apiKey){headers['x-api-key']=S.apiKey;headers['anthropic-version']='2023-06-01';}
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers,body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:900,messages:[{role:'user',content:`Tu es un formateur IFSI expert en urgences infirmières et en prise en charge des détresses médicales. Tu connais parfaitement les recommandations SFMU "IDE seul devant une situation de détresse médicale", la méthode ABCDE, le score NEWS2 et les protocoles de soins infirmiers d'urgence (PISU) 2024.\n\nSituation ou question : ${q}\n\nRéponds en 3-4 paragraphes pratiques. Structure ta réponse avec la méthode ABCDE si pertinent. Cite les recommandations SFMU. Tutoie l'étudiant. Sois direct — en urgence, pas de circonvolutions. Utilise **gras** pour les actions prioritaires.`}]})});
    const data=await res.json();
    if(data.error)throw new Error(data.error.message);
    S.analyse=data.content?.find(b=>b.type==='text')?.text||'';
  }catch(e){S.analyse=`**Erreur**\n\n${e.message}`;}
  S.loading=false;render();
}

render();
</script>
  <!-- PraxisCare Stats -->
  <script src="praxiscare-stats.js"></script>
  <script>PraxisStats.init('simurgences');</script>
</body>
</html>
