<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PraxisRévision · Outil pédagogique IFSI</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet">
.btn-audio{position:fixed;bottom:16px;right:16px;background:var(--em);color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;font-weight:700;cursor:pointer;z-index:1000;box-shadow:0 4px 16px rgba(0,0,0,.4);}
  <style>
:root {
  --bg:    #0e0e14;
  --bg2:   #14141e;
  --card:  rgba(255,255,255,.032);
  --bdr:   rgba(255,255,255,.08);
  --txt:   #f0eeff;
  --txt2:  #8c84b4;
  --txt3:  #948cb4;
  --em:    #a060ff;
  --em2:   #8040e0;
  --lime:  #b0f060;
  --teal:  #40e0d0;
  --rose:  #ff6090;
  --amber: #ffb040;
  --blue:  #40a0ff;
  /* Années */
  --a1:    #40e0d0;
  --a2:    #a060ff;
  --a3:    #ff6090;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 70% 50% at 10% 5%,  rgba(160,96,255,.07) 0%,transparent 60%),
    radial-gradient(ellipse 60% 40% at 90% 95%, rgba(176,240,96,.04) 0%,transparent 50%);
  color:var(--txt); min-height:100vh; padding-bottom:80px;
}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}

/* ── HEADER ── */
.site-header{text-align:center;padding:40px 24px 20px}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(160,96,255,.08);border:1px solid rgba(160,96,255,.22);
  color:var(--em);padding:5px 16px;border-radius:20px;
  font-family:'Fira Mono',monospace;font-size:11px;
  letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;
}
.site-header h1{
  font-family:'Unbounded',sans-serif;
  font-size:clamp(22px,5vw,38px);font-weight:700;letter-spacing:-1px;line-height:1.1;
}
.site-header h1 span{color:var(--em)}
.site-header p{color:var(--txt3);font-size:13px;margin-top:8px;font-style:italic}

/* ── ONGLETS ANNÉE ── */
.annee-tabs{display:flex;gap:8px;padding:0 0 18px;flex-wrap:wrap}
.annee-tab{
  padding:8px 20px;border-radius:30px;
  border:1.5px solid var(--bdr);background:rgba(255,255,255,.02);
  color:var(--txt2);font-size:13px;font-weight:600;cursor:pointer;
  transition:all .18s;-webkit-tap-highlight-color:transparent;
  font-family:'Plus Jakarta Sans',sans-serif;
}
.annee-tab.a1.active{background:rgba(64,224,208,.1);border-color:rgba(64,224,208,.4);color:var(--a1)}
.annee-tab.a2.active{background:rgba(160,96,255,.1);border-color:rgba(160,96,255,.4);color:var(--a2)}
.annee-tab.a3.active{background:rgba(255,96,144,.1);border-color:rgba(255,96,144,.4);color:var(--a3)}
.annee-tab:hover{background:rgba(255,255,255,.05);color:var(--txt)}

/* ── MODES ── */
.mode-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.mode-tab{
  flex:1;padding:10px 12px;border-radius:12px;
  border:1.5px solid var(--bdr);background:rgba(255,255,255,.02);
  color:var(--txt2);font-size:13px;font-weight:600;cursor:pointer;
  text-align:center;transition:all .18s;min-width:100px;
  -webkit-tap-highlight-color:transparent;
  font-family:'Plus Jakarta Sans',sans-serif;
}
.mode-tab.active{background:rgba(160,96,255,.1);border-color:rgba(160,96,255,.4);color:var(--em)}
.mode-tab:hover{background:rgba(255,255,255,.05);color:var(--txt)}

/* ── CARD ── */
.card{background:var(--card);border:1.5px solid var(--bdr);border-radius:18px;padding:24px;margin-bottom:14px}

/* ── QCM ── */
.qcm-progress{
  background:rgba(255,255,255,.06);border-radius:100px;height:6px;margin-bottom:18px;overflow:hidden;
}
.qcm-bar{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--em2),var(--em));transition:width .5s ease}
.qcm-meta{display:flex;justify-content:space-between;font-family:'Fira Mono',monospace;font-size:11px;color:var(--txt3);margin-bottom:16px}
.qcm-ue{display:inline-block;padding:3px 10px;border-radius:20px;font-family:'Fira Mono',monospace;font-size:10px;letter-spacing:1px;background:rgba(160,96,255,.1);border:1px solid rgba(160,96,255,.25);color:var(--em);margin-bottom:12px}
.qcm-question{
  font-family:'Plus Jakarta Sans',sans-serif;font-size:clamp(15px,2.5vw,18px);
  font-weight:600;line-height:1.5;margin-bottom:20px;color:var(--txt);
}
.qcm-opts{display:flex;flex-direction:column;gap:8px}
.qcm-opt{
  padding:14px 18px;border-radius:12px;border:1.5px solid var(--bdr);
  background:rgba(255,255,255,.025);color:var(--txt2);
  cursor:pointer;font-size:14px;line-height:1.5;
  transition:all .18s;display:flex;align-items:flex-start;gap:12px;
  -webkit-tap-highlight-color:transparent;
}
.qcm-opt:hover{background:rgba(255,255,255,.06);color:var(--txt);border-color:rgba(255,255,255,.15)}
.qcm-opt.selected{background:rgba(160,96,255,.1);border-color:rgba(160,96,255,.4);color:var(--txt)}
.qcm-opt.correct{background:rgba(176,240,96,.1);border-color:rgba(176,240,96,.4);color:var(--lime)}
.qcm-opt.wrong  {background:rgba(255,96,144,.1);border-color:rgba(255,96,144,.4);color:var(--rose)}
.qcm-letter{
  width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;
  display:flex;align-items:center;justify-content:center;
  font-family:'Fira Mono',monospace;font-size:11px;font-weight:500;
  flex-shrink:0;
}
.qcm-explication{
  background:rgba(160,96,255,.06);border:1px solid rgba(160,96,255,.2);
  border-radius:12px;padding:14px 16px;margin-top:14px;
  font-size:14px;color:var(--txt2);line-height:1.75;
}
.qcm-explication strong{color:var(--txt)}
.score-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 18px;border-radius:20px;
  font-family:'Fira Mono',monospace;font-size:14px;font-weight:500;
}

/* ── CAS CLINIQUES ── */
.cas-header{
  background:linear-gradient(135deg,rgba(160,96,255,.12),rgba(64,160,255,.08));
  border:1px solid rgba(160,96,255,.2);border-radius:14px;padding:18px;margin-bottom:16px;
}
.cas-patient{font-family:'Unbounded',sans-serif;font-size:18px;font-weight:700;margin-bottom:4px}
.cas-context{font-size:14px;color:var(--txt2);line-height:1.7}
.cas-question{
  background:rgba(0,0,0,.25);border-left:3px solid var(--em);
  border-radius:0 10px 10px 0;padding:14px 16px;margin:14px 0;
  font-size:15px;color:var(--txt);font-weight:500;
}
.cas-input{
  background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);
  border-radius:10px;color:var(--txt);padding:12px 14px;
  font-size:14px;font-family:'Plus Jakarta Sans',sans-serif;
  outline:none;width:100%;min-height:80px;resize:vertical;
  transition:border-color .2s;line-height:1.6;
}
.cas-input:focus{border-color:rgba(160,96,255,.4)}

/* ── FICHES ── */
.fiche-card{
  background:rgba(255,255,255,.025);border:1.5px solid var(--bdr);
  border-radius:14px;padding:0;overflow:hidden;margin-bottom:10px;
  cursor:pointer;transition:all .2s;
}
.fiche-card:hover{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.14)}
.fiche-header{
  display:flex;align-items:center;gap:12px;padding:16px 18px;
}
.fiche-icon{font-size:24px;flex-shrink:0}
.fiche-title{font-weight:600;font-size:15px}
.fiche-ue{font-size:11px;color:var(--txt3);font-family:'Fira Mono',monospace;margin-top:2px}
.fiche-arrow{margin-left:auto;color:var(--txt3);transition:transform .2s}
.fiche-card.open .fiche-arrow{transform:rotate(90deg)}
.fiche-body{
  padding:0 18px 18px;font-size:14px;color:var(--txt2);
  line-height:1.8;border-top:1px solid var(--bdr);padding-top:14px;
}
.fiche-body h4{color:var(--em);font-size:13px;font-weight:600;margin:12px 0 6px;text-transform:uppercase;letter-spacing:.5px}
.fiche-body ul{padding-left:18px}
.fiche-body li{margin-bottom:4px}
.fiche-body strong{color:var(--txt);font-weight:600}
.fiche-body .mnemo{
  background:rgba(176,240,96,.06);border:1px solid rgba(176,240,96,.2);
  border-radius:8px;padding:10px 12px;margin-top:8px;
  font-family:'Fira Mono',monospace;font-size:13px;color:var(--lime);
}

/* ── STATS / SCORE ── */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat-box{background:rgba(0,0,0,.25);border:1px solid var(--bdr);border-radius:12px;padding:14px;text-align:center}
.stat-n{font-family:'Unbounded',sans-serif;font-size:24px;font-weight:700;display:block}
.stat-l{font-size:10px;color:var(--txt3);font-family:'Fira Mono',monospace;letter-spacing:1px;text-transform:uppercase;display:block;margin-top:4px}

/* ── BUTTONS ── */
.btn-p{
  background:linear-gradient(135deg,var(--em2),var(--em));
  border:none;border-radius:12px;color:#0e0e14;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:700;
  padding:13px 28px;cursor:pointer;transition:opacity .2s,transform .1s;
}
.btn-p:hover{opacity:.9;transform:translateY(-1px)}
.btn-g{
  background:rgba(255,255,255,.03);border:1.5px solid var(--bdr);
  border-radius:12px;color:var(--txt2);
  font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;
  padding:11px 20px;cursor:pointer;transition:all .18s;
}
.btn-g:hover{background:rgba(255,255,255,.07);color:var(--txt)}
.btn-full{width:100%}

/* ── INFO ── */
.info{border-radius:11px;padding:12px 15px;font-size:13px;line-height:1.7}
.info-em {background:rgba(160,96,255,.07);border:1px solid rgba(160,96,255,.2);color:var(--em)}
.info-grn{background:rgba(176,240,96,.07);border:1px solid rgba(176,240,96,.2);color:var(--lime)}
.info-amb{background:rgba(255,176,64,.07);border:1px solid rgba(255,176,64,.2);color:var(--amber)}

/* ── LOADING ── */
.dots{text-align:center;padding:28px 0}
.dots span{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--em);margin:0 3px;animation:dotB 1.4s ease-in-out infinite both}
.dots span:nth-child(2){animation-delay:.16s}
.dots span:nth-child(3){animation-delay:.32s}
.dots-msg{color:var(--txt3);font-size:13px;margin-top:10px;font-style:italic}

/* ── WELCOME ── */
.welcome{text-align:center;padding:4px 0 24px}
.welcome-icon{font-size:60px;display:block;margin-bottom:16px}
.welcome p{color:var(--txt2);font-size:15px;line-height:1.8;max-width:480px;margin:0 auto}
.pts{display:flex;flex-direction:column;gap:12px;margin:20px 0;text-align:left}
.pt{display:flex;gap:12px;align-items:flex-start}
.pt-i{font-size:20px;flex-shrink:0;margin-top:2px}
.pt-t{font-size:14px;color:var(--txt2);line-height:1.65}
.pt-t strong{color:var(--txt)}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes dotB  {0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
@keyframes popIn {from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.fadeup{animation:fadeUp .35s ease forwards}
.popin{animation:popIn .25s ease forwards}

@media(max-width:480px){
  .stats-grid{grid-template-columns:1fr 1fr}
  .mode-tabs{gap:4px}
  .mode-tab{font-size:12px;padding:9px 8px}
}
</style>
</head>
<body>
<div id="app"></div>
<button class="btn-audio" id="btn-audio" onclick="lireOnglet()">🔊 Écouter</button>
<script>
// ═══════════════════════════════════════
//  DONNÉES QCM
// ═══════════════════════════════════════
const QCM = {
  1: [ // 1ère année
    { ue:'UE 2.1', q:'Quelle est la valeur normale de la pression artérielle chez un adulte sain ?', opts:['80/50 mmHg','120/80 mmHg','150/100 mmHg','90/60 mmHg'], rep:1, expl:'La pression artérielle normale chez l\'adulte est de **120/80 mmHg**. On parle d\'hypertension au-delà de 140/90 mmHg et d\'hypotension en dessous de 90/60 mmHg.' },
    { ue:'UE 2.1', q:'La fréquence cardiaque normale d\'un adulte au repos est de :', opts:['40–60 bpm','60–100 bpm','100–120 bpm','120–160 bpm'], rep:1, expl:'La **fréquence cardiaque normale** de l\'adulte est de 60 à 100 bpm. En dessous de 60 : bradycardie. Au-dessus de 100 : tachycardie.' },
    { ue:'UE 2.2', q:'Parmi les éléments suivants, lequel n\'est PAS un signe clinique d\'hypoglycémie ?', opts:['Sueurs froides','Tremblements','Bradycardie','Pâleur'], rep:2, expl:'La bradycardie n\'est PAS un signe d\'hypoglycémie. Les signes adrénergiques de l\'hypoglycémie sont : **sueurs, tremblements, tachycardie, pâleur, anxiété**. La bradycardie est masquée par les bêtabloquants.' },
    { ue:'UE 4.1', q:'La règle des 5B en administration médicamenteuse comprend :', opts:['Bon patient, Bon médicament, Bonne dose, Bonne voie, Bon moment','Bon patient, Bon médecin, Bon bilan, Bonne voie, Bon moment','Bon patient, Bon médicament, Bonne dose, Bon bilan, Bon moment','Bon patient, Bon médicament, Bonne durée, Bonne voie, Bon médecin'], rep:0, expl:'La règle des **5B** : Bon patient · Bon médicament · Bonne dose · Bonne voie · Bon moment. C\'est la base de la sécurisation de l\'administration médicamenteuse.' },
    { ue:'UE 1.1', q:'La SpO₂ normale chez un patient BPCO est :', opts:['95–100%','92–95%','88–92%','80–88%'], rep:2, expl:'Chez le patient **BPCO**, la cible SpO₂ est **88–92%**. Une saturation trop élevée (>92%) risque de supprimer la commande ventilatoire hypoxique et d\'aggraver l\'hypercapnie.' },
    { ue:'UE 2.4', q:'L\'échelle de Glasgow évalue :', opts:['La douleur','La conscience','La saturation','La pression artérielle'], rep:1, expl:'Le **Score de Glasgow** évalue le niveau de conscience sur 3 critères : ouverture des yeux (1–4), réponse verbale (1–5), réponse motrice (1–6). Score total : 3 (coma profond) à 15 (normal).' },
    { ue:'UE 4.2', q:'Une solution isotonique a une osmolarité de :', opts:['< 280 mOsm/L','280–320 mOsm/L','> 320 mOsm/L','> 500 mOsm/L'], rep:1, expl:'Une solution **isotonique** a une osmolarité proche du plasma : **280–320 mOsm/L**. Hypotonique < 280. Hypertonique > 320. Le NaCl 0,9% et le Ringer Lactate sont isotoniques.' },
    { ue:'UE 2.1', q:'La fréquence respiratoire normale d\'un adulte au repos est de :', opts:['8–12 cycles/min','12–20 cycles/min','20–30 cycles/min','30–40 cycles/min'], rep:1, expl:'La **fréquence respiratoire normale** de l\'adulte est de 12 à 20 cycles/minute. Bradypnée < 12. Tachypnée > 20. La FR est souvent négligée mais c\'est un signe vital précoce de décompensation.' },
    { ue:'UE B.1', q:'Quel organite cellulaire est responsable de la production d\'énergie (ATP) ?', opts:['Le noyau','La mitochondrie','L\'appareil de Golgi','Le réticulum endoplasmique'], rep:1, expl:'La **mitochondrie** est la « centrale énergétique » de la cellule : elle produit l\'ATP par respiration cellulaire. Le noyau contient l\'ADN, l\'appareil de Golgi trie et exporte les protéines.' },
    { ue:'UE B.1', q:'L\'homéostasie désigne :', opts:['La division cellulaire','Le maintien d\'un équilibre interne stable malgré les variations externes','La destruction des cellules anormales','La transmission de l\'influx nerveux'], rep:1, expl:'L\'**homéostasie** est la capacité de l\'organisme à maintenir un milieu intérieur stable (température, pH, glycémie...) malgré les variations de l\'environnement. C\'est un concept central de la physiologie.' },
    { ue:'UE B.1', q:'Le pH sanguin normal se situe entre :', opts:['6,80 et 7,00','7,00 et 7,35','7,35 et 7,45','7,45 et 7,80'], rep:2, expl:'Le **pH sanguin normal** est de **7,35 à 7,45** (légèrement alcalin). En dessous : acidose. Au-dessus : alcalose. Une variation de quelques centièmes peut déjà avoir des conséquences cliniques.' },
    { ue:'UE B.1', q:'Une cellule somatique humaine contient normalement :', opts:['23 chromosomes','46 chromosomes','92 chromosomes','44 chromosomes'], rep:1, expl:'Une cellule **somatique** (non reproductrice) contient **46 chromosomes**, soit 23 paires. Les cellules reproductrices (gamètes) n\'en contiennent que 23, pour se combiner à la fécondation.' },
    { ue:'UE B.1', q:'Lors d\'une osmose, l\'eau se déplace :', opts:['Du milieu le plus concentré vers le moins concentré','Du milieu le moins concentré vers le plus concentré en soluté','Toujours vers l\'extérieur de la cellule','Aléatoirement, sans direction précise'], rep:1, expl:'L\'eau traverse une membrane semi-perméable du milieu **le moins concentré** vers le milieu **le plus concentré en soluté**, pour tendre vers l\'équilibre. C\'est ce principe qui explique les échanges entre le sérum perfusé et les cellules.' },
    { ue:'UE B.1', q:'Quelle structure du système nerveux central régule la température corporelle ?', opts:['Le cervelet','L\'hypothalamus','Le bulbe rachidien','Le cortex moteur'], rep:1, expl:'L\'**hypothalamus** est le centre de régulation de la température corporelle, mais aussi de la faim, de la soif et de nombreuses hormones. C\'est un acteur clé de l\'homéostasie.' },
    { ue:'UE B.1', q:'Combien d\'os compose le squelette humain adulte ?', opts:['186','206','226','246'], rep:1, expl:'Le squelette humain adulte compte **206 os**, du crâne jusqu\'aux orteils.' },
    { ue:'UE B.1', q:'Quel est le plus petit os du corps humain ?', opts:['Le fémur','L\'étrier','Le péroné','La clavicule'], rep:1, expl:'L\'**étrier**, situé dans l\'oreille moyenne, est le plus petit os du corps. Le fémur est à l\'inverse le plus grand.' },
    { ue:'UE B.1', q:'Combien de muscles compte le corps humain selon la classification anatomique détaillée ?', opts:['Environ 400','Environ 500','639','Plus de 800'], rep:2, expl:'On dénombre **639 muscles**, dont environ 570 muscles striés squelettiques.' },
    { ue:'UE B.1', q:'Quel est le plus petit muscle du corps humain ?', opts:['Le muscle stapédien','Le grand fessier','Le psoas','Le biceps'], rep:0, expl:'Le **muscle stapédien**, dans l\'oreille moyenne, mesure environ 1mm — c\'est le plus petit muscle du corps.' },
    { ue:'UE B.1', q:'Une articulation comme le genou ou l\'épaule est dite :', opts:['Fixe','Semi-mobile','Mobile','Soudée'], rep:2, expl:'Les articulations **mobiles** (genoux, coudes, épaules) offrent la plus grande amplitude de mouvement, à l\'inverse des semi-mobiles (vertèbres) ou fixes (sutures crâniennes).' },
    { ue:'UE B.1', q:'L\'arthrose se définit comme :', opts:['Une inflammation de l\'articulation','Le vieillissement de l\'articulation','Un déboîtement de l\'articulation','Une inflammation d\'un tendon'], rep:1, expl:'L\'**arthrose** correspond au vieillissement de l\'articulation (usure du cartilage), à distinguer de l\'arthrite (inflammation) et de la luxation (déboîtement).' },
    { ue:'UE B.1', q:'La colonne vertébrale compte combien de vertèbres au total ?', opts:['24','29','33','37'], rep:2, expl:'**33 vertèbres** au total : 7 cervicales, 12 dorsales, 5 lombaires, 5 sacrales, 3 coccygiennes.' },
    { ue:'UE B.1', q:'Le rôle des disques intervertébraux est de :', opts:['Produire les cellules sanguines','Amortir et répartir la pression des mouvements','Transmettre l\'influx nerveux','Stocker le calcium'], rep:1, expl:'Grâce à un noyau gélatineux entouré d\'un anneau fibreux, les disques intervertébraux **amortissent et répartissent la pression** exercée lors des mouvements.' },
    { ue:'UE B.1', q:'Parmi ces facteurs de TMS, lequel appartient à la catégorie « psychosociale » ?', opts:['Mouvements répétitifs','Poste de travail mal adapté','Stress et charge mentale élevée','Cadence à tenir'], rep:2, expl:'Le **stress et la charge mentale** relèvent des facteurs psychosociaux. Les mouvements répétitifs sont biomécaniques, le poste mal adapté est environnemental, la cadence est organisationnelle.' },
    { ue:'UE B.1', q:'Un atome est défini comme :', opts:['Une molécule organique','Le plus petit élément indivisible de la matière','Un assemblage de plusieurs cellules','Une charge électrique libre'], rep:1, expl:'Un **atome** est le plus petit élément indivisible de la matière.' },
    { ue:'UE B.1', q:'Quels sont les trois éléments constituants d\'un atome ?', opts:['Électrons, ions, isotopes','Protons, molécules, neutrons','Électrons, protons, neutrons','Noyaux, cations, anions'], rep:2, expl:'Un atome est constitué d\'**électrons** (charge négative), de **protons** (charge positive) et de **neutrons** (sans charge), ces deux derniers formant le noyau.' },
    { ue:'UE B.1', q:'Quels sont les deux nucléons qui constituent le noyau de l\'atome ?', opts:['Électrons et protons','Protons et neutrons','Électrons et neutrons','Neutrons et ions'], rep:1, expl:'Le noyau de l\'atome est constitué de deux nucléons : les **protons** (charge positive) et les **neutrons** (sans charge).' },
    { ue:'UE B.1', q:'Pourquoi la charge électrique d\'un atome est-elle neutre ?', opts:['Il n\'a pas de neutrons','Les neutrons compensent les électrons','Le nombre d\'électrons est égal au nombre de protons','Il n\'a pas de noyau'], rep:2, expl:'La charge électrique d\'un atome est neutre car le nombre d\'**électrons** (charge négative) est égal au nombre de **protons** (charge positive).' },
    { ue:'UE B.1', q:'Qu\'est-ce qui définit la masse d\'un atome ?', opts:['Le nombre de protons et de neutrons','Le nuage électronique','Le nombre d\'électrons uniquement','La charge globale de l\'atome'], rep:0, expl:'Le **nombre de protons et de neutrons** définit la masse de l\'atome. Le nuage électronique, lui, définit son volume.' },
    { ue:'UE B.1', q:'Dans le tableau périodique, les éléments d\'un même groupe (colonne) partagent :', opts:['Le même nombre de neutrons','Le même nombre de couches d\'électrons remplies','Le même nombre d\'électrons sur la couche périphérique','La même masse atomique'], rep:2, expl:'Dans le tableau périodique, les atomes d\'un même **groupe** (colonne) partagent le même nombre d\'électrons sur leur couche périphérique.' },
    { ue:'UE B.1', q:'Dans le tableau périodique, les éléments d\'une même période (ligne) partagent :', opts:['Le même nombre d\'électrons périphériques','Le même nombre de couches d\'électrons remplies','La même réactivité chimique','Le même nombre de neutrons'], rep:1, expl:'Les éléments d\'une même **période** (ligne) du tableau périodique partagent le même nombre de couches d\'électrons remplies.' },
    { ue:'UE B.1', q:'Les 6 principaux éléments chimiques du corps humain (O, C, H, N, Ca, P) représentent quel pourcentage de la masse corporelle ?', opts:['85%','99%','70%','50%'], rep:1, expl:'Ces 6 éléments (oxygène, carbone, hydrogène, azote, calcium, phosphore) représentent **99%** de la masse corporelle.' },
    { ue:'UE B.1', q:'Qu\'est-ce qu\'un ion ?', opts:['Un atome qui a gagné ou perdu un électron','Un atome radioactif','Un atome sans neutron','Une molécule organique chargée'], rep:0, expl:'Un **ion** est un atome qui a gagné ou perdu un ou plusieurs électrons, ce qui lui confère une charge électrique.' },
    { ue:'UE B.1', q:'Comment appelle-t-on un ion chargé positivement (ayant perdu un électron) ?', opts:['Un anion','Un isotope','Un cation','Un nucléide'], rep:2, expl:'Un ion chargé positivement s\'appelle un **cation**. Exemples dans le corps humain : Na+, Ca2+, Mg2+.' },
    { ue:'UE B.1', q:'Comment appelle-t-on un ion chargé négativement (ayant gagné un électron) ?', opts:['Un cation','Un anion','Un proton','Un isotope'], rep:1, expl:'Un ion chargé négativement s\'appelle un **anion**. Exemples : Cl-, HCO3-, OH-.' },
    { ue:'UE B.1', q:'Les isotopes d\'un même élément se caractérisent par :', opts:['Même nombre de protons, nombre différent d\'électrons','Même charge, masse différente','Même nombre de protons, nombre différent de neutrons','Même nombre de neutrons, nombre différent de protons'], rep:2, expl:'Les **isotopes** sont des atomes possédant le même nombre d\'électrons (et donc de protons), mais un nombre différent de neutrons.' },
    { ue:'UE B.1', q:'Une liaison covalente correspond à :', opts:['La mise en commun de 2 électrons provenant de 2 atomes','Une interaction électrostatique entre cations et anions','Un partage d\'électrons entre tous les atomes d\'un métal','Une attraction faible entre deux molécules'], rep:0, expl:'La **liaison covalente** met en commun 2 électrons provenant de 2 atomes — c\'est une liaison chimique forte, tout comme la liaison ionique et la liaison métallique.' },
    { ue:'UE B.1', q:'Parmi les liaisons chimiques, lesquelles sont considérées comme faibles ?', opts:['Covalente et ionique','Hydrogène et Van der Waals','Métallique et covalente','Ionique et métallique'], rep:1, expl:'Les liaisons **hydrogène** et de **Van der Waals** sont les deux types de liaisons chimiques faibles.' },
    { ue:'UE B.1', q:'Quelle est la différence entre oxydation et réduction ?', opts:['L\'oxydation est un gain d\'électrons, la réduction une perte','Les deux désignent un gain d\'électrons','L\'oxydation est une perte d\'électrons, la réduction un gain','Les deux désignent une perte de neutrons'], rep:2, expl:'On parle d\'**oxydation** lors d\'une perte d\'électron(s), et de **réduction** lors d\'un gain d\'électron(s).' },
    { ue:'UE B.1', q:'Comment mesure-t-on l\'acidité d\'une solution ?', opts:['La concentration en cations','Le potentiel Hydrogène (pH), via l\'ion oxonium','La pression osmotique','La concentration en bicarbonate'], rep:1, expl:'On mesure l\'acidité via le **pH**, qui reflète la concentration en ions oxonium (H3O+).' },
    { ue:'UE B.1', q:'Quelle molécule représente 65% du poids d\'un adulte de 70kg, et quel est son pH pur à 25°C ?', opts:['Le sang, pH 7,4','Les protéines, pH 5','L\'eau, pH 7','Le glucose, pH 6'], rep:2, expl:'L\'**eau** représente 65% du poids corporel, et son pH pur à 25°C est neutre, égal à **7**.' },
    { ue:'UE B.1', q:'Une solution est dite acide ou basique selon quel critère ?', opts:['Acide si pH < 7, basique si pH > 7','Acide si pH > 7, basique si pH < 7','Acide et basique désignent la même chose','Cela dépend uniquement de la température'], rep:0, expl:'Une solution est **acide** si son pH est inférieur à 7 (ex : sucs gastriques), **basique** s\'il est supérieur à 7 (ex : sang).' },
    { ue:'UE B.1', q:'Quel ion constitue le tampon physiologique principal du sang, et quels organes régulent cet équilibre ?', opts:['Le sodium — foie et rate','Le potassium — cœur et poumons','Le bicarbonate — poumons et reins','Le calcium — reins et intestins'], rep:2, expl:'Le **bicarbonate** (HCO3-) est le tampon physiologique principal du sang. Les **poumons** et les **reins** régulent l\'équilibre acido-basique.' },
    { ue:'UE B.1', q:'Chez un adulte de 70kg, quel pourcentage du poids représente l\'eau, et quelle quantité cela représente-t-il ?', opts:['50%, soit 35 litres','65%, soit 45 litres','75%, soit 55 litres','40%, soit 28 litres'], rep:1, expl:'L\'eau représente environ **65%** du poids corporel — soit environ **45 litres** chez un adulte de 70kg, dont 4,5 litres dans le sang.' },
    { ue:'UE B.1', q:'Pourquoi le chlorure de sodium à 0,9% est-il généralement utilisé comme soluté de perfusion ?', opts:['Hypotonique','Hypertonique','Isotonique','Amphotère'], rep:2, expl:'Le NaCl à 0,9% est **isotonique**, ce qui en fait le soluté de référence pour la perfusion sans risque de déséquilibre osmotique cellulaire.' },
    { ue:'UE B.1', q:'Comment définit-on une molécule ?', opts:['Un assemblage de plusieurs cellules','Un assemblage d\'atomes, identiques ou différents','Un ion chargé négativement','Une chaîne de protéines uniquement'], rep:1, expl:'Une **molécule** est un assemblage d\'atomes, identiques ou différents.' },
    { ue:'UE B.1', q:'Quelles sont les deux molécules transportées par les globules rouges dans le plasma ?', opts:['Glucose et insuline','Eau et sodium','Dioxygène (O2) et dioxyde de carbone (CO2)','Protéines et lipides'], rep:2, expl:'Les globules rouges transportent le **dioxygène (O2)** vers les tissus et le **dioxyde de carbone (CO2)** vers les poumons pour son élimination.' },
    { ue:'UE B.1', q:'Le glucose, l\'ADN et les protéines sont des molécules :', opts:['Inorganiques, car issues de minéraux','Organiques, car constituants de la matière vivante','Ni organiques ni inorganiques','Organiques uniquement pour l\'ADN'], rep:1, expl:'Le glucose, l\'ADN et les protéines sont des molécules **organiques** — des constituants de la matière vivante.' },
    { ue:'UE B.1', q:'Avec quoi un proton H+ doit-il se lier pour former un ion oxonium ?', opts:['Une molécule d\'eau (H2O)','Un ion bicarbonate','Une molécule de glucose','Un autre proton H+'], rep:0, expl:'Le proton H+ doit se lier à une molécule d\'**eau** (H2O) pour former l\'ion oxonium (H3O+), dont la concentration permet de mesurer le pH.' },
    { ue:'UE B.1', q:'Les sucs gastriques ont un pH = 2. Comment cela se compare-t-il au pH du sang ?', opts:['Les deux sont acides','Les deux sont basiques','Les sucs gastriques sont acides, le sang est basique','Les sucs gastriques sont basiques, le sang est acide'], rep:2, expl:'Les sucs gastriques (pH=2) sont **acides**, tandis que le sang (pH 7,35-7,45) est **basique** — les deux se situent à l\'opposé l\'un de l\'autre sur l\'échelle du pH.' },
    { ue:'UE B.1', q:'Le bicarbonate est une espèce dite « amphotère ». Que signifie ce terme ?', opts:['Qu\'il est uniquement acide','Qu\'il peut être à la fois un acide et une base','Qu\'il neutralise tous les ions','Qu\'il n\'a aucune charge électrique'], rep:1, expl:'Une espèce **amphotère** peut se comporter à la fois comme un acide et comme une base. Le bicarbonate et l\'eau sont deux exemples.' },
    { ue:'UE B.1', q:'Parmi les fonctions de l\'eau dans l\'organisme, laquelle est correcte ?', opts:['Digestion des lipides uniquement','Production d\'hormones','Contraction musculaire uniquement','Régulation thermique, transport, solvant, lubrification, amortissement des chocs'], rep:3, expl:'L\'eau assure notamment la régulation de la température corporelle, le transport de substances, un rôle de solvant, la lubrification des séreuses et l\'amortissement des chocs.' },
    { ue:'UE B.1', q:'Dans quel secteur liquidien l\'eau joue-t-elle un rôle de transport ?', opts:['Le secteur intracellulaire','Le secteur plasmatique (au sein du secteur extracellulaire)','Le secteur interstitiel uniquement','Aucun secteur en particulier'], rep:1, expl:'Le secteur extracellulaire se divise en secteur interstitiel et secteur plasmatique — c\'est dans ce dernier que l\'eau joue un rôle de transport.' },
    { ue:'UE B.1', q:'Quelles sont les deux pressions qui mobilisent l\'eau à l\'intérieur du secteur extracellulaire ?', opts:['Pression osmotique et pression atmosphérique','Pression artérielle et pression veineuse','Pression oncotique et pression hydrostatique','Pression thoracique et pression abdominale'], rep:2, expl:'La **pression oncotique** dépend de la concentration en protéines, la **pression hydrostatique** de la pression supérieure du milieu vasculaire.' },
    { ue:'UE B.1', q:'Que se passe-t-il cliniquement lorsque le plasma manque de protéines (baisse de la pression oncotique) ?', opts:['Une déshydratation cellulaire','L\'apparition d\'œdèmes','Une hypertension artérielle','Une hyperglycémie'], rep:1, expl:'Un manque de protéines plasmatiques diminue la pression oncotique, ce qui fait diffuser l\'eau vers le milieu interstitiel — se traduisant par des **œdèmes**.' },
    { ue:'UE B.1', q:'En cas de déshydratation intra-cellulaire, quel type de solution le médecin prescrira-t-il, et pourquoi ?', opts:['Une solution hypertonique','Une solution hypotonique','Une solution isotonique','Peu importe le type de solution'], rep:1, expl:'En cas de déshydratation intracellulaire, on prescrit une solution **hypotonique** : elle fait entrer l\'eau dans les cellules par pression osmotique.' },
    { ue:'UE B.1', q:'Quelles sont les trois causes de perte d\'eau par l\'organisme ?', opts:['Digestion, circulation, respiration','Sueur, salive, larmes','Respiration, perspiration (sueur), excrétions (urines/selles)','Vision, audition, olfaction'], rep:2, expl:'L\'organisme perd de l\'eau par la **respiration**, la **perspiration** (sueur) et les **excrétions** (urines, selles).' },
    { ue:'UE B.1', q:'Quelle hormone régule les entrées et sorties d\'eau de l\'organisme, et sur quel organe agit-elle ?', opts:['L\'insuline, sur le pancréas','L\'hormone antidiurétique (ADH), sur les reins','Le glucagon, sur le foie','La thyroïde, sur le cœur'], rep:1, expl:'L\'**hormone antidiurétique (ADH)** régule les entrées et sorties d\'eau de l\'organisme en agissant sur les **reins**.' },
    { ue:'UE B.1', q:'Parmi ces éléments, lesquels sont des macronutriments ?', opts:['Vitamines, sels minéraux, oligo-éléments','Eau, oxygène, glucose uniquement','Lipides, glucides, protides, fibres','Hormones, enzymes, coenzymes'], rep:2, expl:'Les **macronutriments** sont les lipides, glucides, protides et fibres ; les micronutriments sont les vitamines, acides aminés, sels minéraux et oligo-éléments.' },
    { ue:'UE B.1', q:'Qu\'est-ce qu\'une enzyme ?', opts:['Une source d\'énergie directe','Un catalyseur qui accélère les réactions chimiques','Un type de nutriment','Une hormone digestive'], rep:1, expl:'Une **enzyme** est un catalyseur biologique qui accélère la vitesse des réactions chimiques de la cellule.' },
    { ue:'UE B.1', q:'Quelle est la distinction entre les oses et les osides ?', opts:['Les oses sont complexes, les osides sont simples','Les oses sont simples, les osides sont complexes','Les deux désignent la même chose','Les oses sont des lipides, les osides des glucides'], rep:1, expl:'Les **oses** sont des sucres simples, les **osides** sont des sucres complexes (ex : la cellulose, non digestible, rôle de fibre).' },
    { ue:'UE B.1', q:'Comment le glucose est-il transformé pour fournir de l\'énergie à la cellule ?', opts:['Glycolyse, puis production d\'ATP en présence d\'oxygène','Directement transformé en ATP sans étape intermédiaire','Stocké sans jamais être transformé','Transformé en cholestérol'], rep:0, expl:'Le glucose se transforme en pyruvate par **glycolyse** ; en condition aérobie, l\'oxygène permet de produire de l\'**ATP**, avec CO2 et eau comme déchets.' },
    { ue:'UE B.1', q:'Quelles hormones régulent la glycémie et par quel organe sont-elles sécrétées ?', opts:['Cortisol et adrénaline, sécrétés par les surrénales','Insuline et glucagon, sécrétés par le pancréas','Thyroxine, sécrétée par la thyroïde','ADH, sécrétée par l\'hypophyse'], rep:1, expl:'L\'**insuline** et le **glucagon**, sécrétés par le **pancréas**, régulent la glycémie. Valeur normale à jeun : 0,8 à 1,2 g/L (80 à 120 mg/dL).' },
    { ue:'UE B.1', q:'Comment les lipides sont-ils digérés, et comment sont-ils transportés une fois absorbés ?', opts:['Insuline, puis transportés par l\'hémoglobine','Suc gastrique seul, puis transportés librement dans le plasma','Bile et sucs pancréatiques, puis transportés par les lipoprotéines','Salive uniquement'], rep:2, expl:'Les lipides sont digérés grâce à la **bile**, aux **sucs pancréatiques** et aux enzymes intestinales, puis transportés par les **lipoprotéines**.' },
    { ue:'UE B.1', q:'Quels sont les modes de transport du cholestérol entre le foie et les cellules ?', opts:['HDL du foie vers les cellules, LDL en retour','LDL du foie vers les cellules, HDL en retour','Les deux transportent dans le même sens','Aucun transporteur spécifique n\'existe'], rep:1, expl:'Le cholestérol est transporté du foie vers les cellules par les lipoprotéines **LDL**, et des cellules vers le foie par les lipoprotéines **HDL**.' },
    { ue:'UE B.1', q:'Quelle est la protéine essentielle du globule rouge ?', opts:['L\'albumine','L\'hémoglobine','La fibrine','La myoglobine'], rep:1, expl:'L\'**hémoglobine** est la protéine essentielle du globule rouge, transportant l\'oxygène.' },
    { ue:'UE B.1', q:'Quelle protéine régule principalement la pression oncotique du sang ?', opts:['L\'hémoglobine','L\'anticorps','L\'albumine','La créatinine'], rep:2, expl:'L\'**albumine** est la principale protéine qui régule la pression oncotique du sang.' },
    { ue:'UE B.1', q:'Quelle est la principale protéine du plasma fabriquée par le foie, et quelles sont ses valeurs normales ?', opts:['L\'albumine, produite par le foie, normale entre 35 et 52 g/L','L\'hémoglobine, produite par la moelle osseuse','La créatinine, produite par les reins','Le fibrinogène, produit par la rate'], rep:0, expl:'L\'**albumine** est la principale protéine du plasma, fabriquée par le **foie**. Valeurs normales : **35 à 52 g/L**.' },
    { ue:'UE B.1', q:'Selon l\'HAS, quels taux d\'albumine définissent une dénutrition, puis une dénutrition sévère, chez la personne âgée ?', opts:['< 40 g/L et < 35 g/L','< 35 g/L et < 30 g/L','< 30 g/L et < 20 g/L','< 45 g/L et < 40 g/L'], rep:1, expl:'Dénutrition : albuminémie **< 35 g/L**. Dénutrition sévère : **< 30 g/L**.' },
    { ue:'UE B.1', q:'Comment définit-on la cellule ?', opts:['Un assemblage d\'organites sans fonction propre','Une unité structurale et fonctionnelle capable de se reproduire','Une molécule organique complexe','Un type de tissu conjonctif'], rep:1, expl:'La **cellule** est une unité structurale et fonctionnelle capable de se reproduire.' },
    { ue:'UE B.1', q:'Quelle est la différence entre une cellule procaryote et une cellule eucaryote ?', opts:['Procaryote = avec noyau, eucaryote = sans noyau','Les deux ont un noyau, mais de taille différente','Procaryote = sans noyau, eucaryote = avec noyau','La distinction ne concerne que la taille de la cellule'], rep:2, expl:'Les cellules **procaryotes** n\'ont pas de noyau, contrairement aux cellules **eucaryotes** qui en possèdent un.' },
    { ue:'UE B.1', q:'De quoi est principalement composée la membrane plasmique ?', opts:['Uniquement une couche de protéines','Une bicouche phospholipidique avec cholestérol et protéines diverses','Une simple couche de glucides','Un assemblage de fibres de collagène'], rep:1, expl:'La membrane plasmique est composée d\'une **bicouche phospholipidique**, de glycolipides, de cholestérol, de protéines transmembranaires, de glycoprotéines et de protéines périphériques.' },
    { ue:'UE B.1', q:'Quelles sont les fonctions du cytosquelette ?', opts:['Digestion des macromolécules','Production d\'ATP','Soutien de la structure, division cellulaire, mouvement','Synthèse des lipides membranaires'], rep:2, expl:'Le **cytosquelette** assure le soutien de la structure, la division cellulaire, et participe au mouvement.' },
    { ue:'UE B.1', q:'Quelle est la fonction principale du réticulum endoplasmique granuleux ?', opts:['Synthèse des protéines grâce aux ribosomes','Production d\'énergie (ATP)','Digestion cellulaire','Stockage du calcium uniquement'], rep:0, expl:'Le réticulum endoplasmique **granuleux** assure la synthèse des protéines grâce aux **ribosomes** présents sur sa membrane.' },
    { ue:'UE B.1', q:'Quelle est la fonction principale du réticulum endoplasmique lisse (à la différence du granuleux) ?', opts:['Synthèse des protéines via les ribosomes','Synthèse des lipides membranaires et réserve de calcium','Digestion des macromolécules','Production d\'ATP'], rep:1, expl:'Le réticulum endoplasmique **lisse** assure la synthèse des **lipides membranaires** et sert de **réserve de calcium**.' },
    { ue:'UE B.1', q:'Quel est le rôle de l\'appareil de Golgi ?', opts:['Production d\'ATP','Digestion des macromolécules','Maturation et tri des protéines selon leur destination','Stockage du calcium'], rep:2, expl:'L\'**appareil de Golgi** assure la maturation des protéines venant du réticulum endoplasmique et leur tri selon leur destination finale.' },
    { ue:'UE B.1', q:'Quel est le rôle des lysosomes ?', opts:['Production d\'ATP','Digestion des macromolécules et phagocytose','Synthèse des protéines','Régulation de la division cellulaire'], rep:1, expl:'Les **lysosomes** assurent la digestion des macromolécules et la **phagocytose**.' },
    { ue:'UE B.1', q:'Quelles sont les fonctions des mitochondries ?', opts:['Digestion des macromolécules','Synthèse des lipides membranaires','Respiration cellulaire, production d\'ATP, déclenchement de l\'apoptose','Tri des protéines'], rep:2, expl:'Les **mitochondries** assurent la respiration cellulaire, la production d\'**ATP**, et peuvent déclencher l\'**apoptose**.' },
    { ue:'UE B.1', q:'Quels sont les trois types de mort cellulaire ?', opts:['Nécrose, apoptose, autophagie','Mitose, méiose, apoptose','Nécrose, mitose, phagocytose','Apoptose, autolyse, nécrose tissulaire'], rep:0, expl:'Les trois types sont la **nécrose**, l\'**apoptose** (programmée) et l\'**autophagie**.' },
    { ue:'UE B.1', q:'Parmi les trois types de mort cellulaire, lequel est associé à une réaction inflammatoire ?', opts:['L\'apoptose','La nécrose','L\'autophagie','Aucun des trois'], rep:1, expl:'La **nécrose** est associée à une réaction inflammatoire, contrairement à l\'apoptose qui est programmée et silencieuse.' },
    { ue:'UE B.1', q:'Quel type de mort cellulaire correspond à la mort cellulaire programmée ?', opts:['La nécrose','L\'autophagie','L\'apoptose','Aucun des trois'], rep:2, expl:'L\'**apoptose** correspond à la mort cellulaire programmée, un processus contrôlé et physiologique.' },
    { ue:'UE B.1', q:'Parmi ces modes, lesquels font partie des six modes de communication intercellulaire ?', opts:['Digestive, respiratoire, circulatoire, urinaire','Endocrine, neuronale, autocrine, paracrine, adhésion, jonction GAP','Mitose, méiose, apoptose, nécrose','Osmose, diffusion, filtration, transport actif'], rep:1, expl:'Les six modes sont : **endocrine**, **neuronale**, **autocrine**, **paracrine**, par **adhésion**, et par **jonction GAP**.' },
    { ue:'UE B.1', q:'Comment fonctionne la communication intercellulaire de type endocrine ?', opts:['Une protéine circule dans le sang vers une cellule cible éloignée','Deux cellules sont directement en contact','Une cellule se stimule elle-même','Un neurotransmetteur traverse une synapse'], rep:0, expl:'La communication **endocrine** implique une protéine (hormone) qui circule dans le sang vers une cellule cible éloignée.' },
    { ue:'UE B.1', q:'Quels sont les deux types de cellules excitables ?', opts:['Les globules rouges et les globules blancs','Les muscles et les neurones','Les cellules épithéliales et conjonctives','Les hépatocytes et les néphrons'], rep:1, expl:'Les deux types de cellules excitables sont les **muscles** (striés squelettiques, cardiaques, lisses) et les **neurones**.' },
    { ue:'UE B.1', q:'Où se localise le muscle lisse ?', opts:['Le myocarde','Les parois des viscères creux et des vaisseaux sanguins','Les muscles du squelette','Le cerveau'], rep:1, expl:'Le muscle **lisse** se trouve dans les parois des viscères creux et des vaisseaux sanguins, contraction involontaire lente.' },
    { ue:'UE B.1', q:'Comment se caractérisent les noyaux du muscle strié squelettique ?', opts:['Un seul noyau central, comme le muscle lisse','Aucun noyau','Multinucléé (syncitium), noyaux périphériques','Deux noyaux centraux'], rep:2, expl:'Le muscle strié squelettique est **multinucléé** (syncitium), avec des noyaux en position **périphérique**.' },
    { ue:'UE B.1', q:'Parmi les trois types de muscles, lequel a une contraction volontaire ?', opts:['Le muscle strié squelettique','Le muscle lisse','Le muscle strié cardiaque','Aucun des trois'], rep:0, expl:'Seul le muscle **strié squelettique** a une contraction volontaire ; lisse et cardiaque sont involontaires.' },
    { ue:'UE B.1', q:'Quel type de muscle constitue le myocarde ?', opts:['Le muscle lisse','Le muscle strié cardiaque (myocarde)','Le muscle strié squelettique','Aucun muscle n\'est concerné'], rep:1, expl:'Le **myocarde** est un muscle strié à contraction involontaire, un seul noyau central par cellule.' },
    { ue:'UE B.1', q:'Le sang est classé comme un tissu de quel type ?', opts:['Épithélial','Conjonctif (liquide)','Musculaire','Nerveux'], rep:1, expl:'Le sang est classé comme un **tissu conjonctif liquide** — cellules baignant dans une substance fondamentale liquide, le plasma.' },
    { ue:'UE B.1', q:'Quelle est la valeur normale du nombre d\'hématies (globules rouges) ?', opts:['4 000 à 10 000 /mm³','250 000 à 400 000 /mm³','4 à 6 millions /mm³','14 à 18 millions /mm³'], rep:2, expl:'La valeur normale des **hématies** se situe entre **4 et 6 millions par mm³**.' },

var _lecture = false;
function meilleureVoixFr(){
  var voix = speechSynthesis.getVoices().filter(function(v){ return v.lang && v.lang.toLowerCase().indexOf('fr') === 0; });
  if(voix.length === 0) return null;
  var bonsNoms = ['amélie','audrey','thomas','daniel'];
  var meilleure = voix.find(function(v){ return /enhanced|premium|neural/i.test(v.name); });
  if(!meilleure){
    meilleure = voix.find(function(v){ var n=v.name.toLowerCase(); return bonsNoms.some(function(bn){ return n.indexOf(bn)!==-1; }); });
  }
  return meilleure || voix[0];
}
function lireOnglet(){
  if(_lecture){ stopLecture(); return; }
  if(!('speechSynthesis' in window)){ alert('Lecture audio non disponible sur ce navigateur.'); return; }
  if(S.view !== 'main' || !S.anneeChoisie) return;
  var textes = [];
  var qList = QCM[S.annee]||[], cList = CAS[S.annee]||[], fList = FICHES[S.annee]||[];
  if(S.mode === 'qcm'){
    var q = qList[S.qcmIdx % qList.length];
    if(!q) return;
    textes.push(q.q);
    q.opts.forEach(function(opt, i){
      textes.push(['A','B','C','D'][i] + '. ' + opt);
    });
    if(S.qcmShown){
      textes.push(S.qcmSelected===q.rep ? 'Bonne reponse.' : 'Mauvaise reponse.');
      textes.push(q.expl.replace(/\*\*/g, ''));
    }
  } else if(S.mode === 'cas'){
    var casA = cList[S.casIdx % cList.length];
    if(!casA) return;
    textes.push(casA.titre + '. ' + casA.contexte);
    textes.push('Question : ' + casA.question);
    if(S.casRevele){
      textes.push('Elements de reponse : ' + casA.elements_reponse.replace(/\*\*/g, ''));
      if(S.casAnalyse) textes.push('Retour personnalise : ' + S.casAnalyse.replace(/\*\*/g, ''));
    }
  } else if(S.mode === 'fiches'){
    if(S.ficheOpen){
      var f = fList.find(function(x){ return x.id === S.ficheOpen; });
      if(f){
        textes.push(f.titre + '. ' + f.ue + '.');
        var tmp = document.createElement('div');
        tmp.innerHTML = f.contenu;
        var txt = tmp.innerText || tmp.textContent || '';
        if(txt.trim()) textes.push(txt);
      }
    } else {
      alert('Ouvre une fiche pour pouvoir l\'écouter.');
      return;
    }
  }
  if(textes.length === 0) return;
  _lecture = true;
  document.getElementById('btn-audio').textContent = '⏹ Stop';
  var voixChoisie = meilleureVoixFr();
  var i = 0;
  function suivante(){
    if(!_lecture || i >= textes.length){ stopLecture(); return; }
    var u = new SpeechSynthesisUtterance(textes[i++]);
    u.lang = 'fr-FR';
    u.rate = 0.9;
    if(voixChoisie) u.voice = voixChoisie;
    u.onend = suivante;
    u.onerror = suivante;
    speechSynthesis.speak(u);
  }
  speechSynthesis.cancel();
  setTimeout(suivante, 50);
}
function stopLecture(){
  _lecture = false;
  if('speechSynthesis' in window) speechSynthesis.cancel();
  var btn = document.getElementById('btn-audio');
  if(btn) btn.textContent = '🔊 Écouter';
}

function selectRentree(y){
  S.rentreeAnnee=String(y);
  // Calculer l'année automatiquement
  const now=new Date();
  const sep=new Date(+y,8,1);
  const months=(now-sep)/(1000*60*60*24*30.5);
  S.annee = months<12?1:months<24?2:3;
  render();
}

function validerOnboarding(){
  if(!S.rentreeAnnee) return;
  S.anneeChoisie=true;
  // Sauvegarder
  localStorage.setItem('simrev_rentree',S.rentreeAnnee);
  localStorage.setItem('simrev_promo',S.promoNom);
  localStorage.setItem('simrev_annee',String(S.annee));
  S.view='main';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function go(v){
  stopLecture();
  if(v==='main' && !S.anneeChoisie){ S.view='choix_annee'; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  S.view=v;render();window.scrollTo({top:0,behavior:'smooth'});
}
function setAnnee(a){
  stopLecture();
  if(S.anneeChoisie && S.annee!==a){
    if(!confirm('⚠️ Vous allez accéder au contenu de '+anLabel(a)+'. Si vous n\'avez pas encore suivi ces cours, vous risquez de voir des réponses avant d\'avoir réfléchi aux questions.\n\nConfirmer quand même ?')) return;
  }
  S.annee=a;S.anneeChoisie=true;S.qcmIdx=0;S.qcmSelected=null;S.qcmShown=false;
  S.casIdx=0;S.casReponse='';S.casRevele=false;S.casAnalyse='';S.ficheOpen=null;
  if(S.view==='welcome') S.view='main';
  render();window.scrollTo({top:0,behavior:'smooth'});
}
function setMode(m){stopLecture();S.mode=m;render();window.scrollTo({top:0,behavior:'smooth'})}
function toggleFiche(id){S.ficheOpen=S.ficheOpen===id?null:id;render()}

function selectQcm(i){
  if(S.qcmShown) return;
  S.qcmSelected=i;S.qcmShown=true;
  const q=QCM[S.annee][S.qcmIdx%QCM[S.annee].length];
  saveScore(S.annee, i===q.rep);
  render();
}

function nextQcm(){
  S.qcmIdx++;S.qcmSelected=null;S.qcmShown=false;render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function nextCas(){
  S.casIdx++;S.casReponse='';S.casRevele=false;S.casAnalyse='';render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function voirCorrection(){S.casRevele=true;render()}

// ═══════════════════════════════════════
//  API CLAUDE — Évaluation cas clinique
// ═══════════════════════════════════════
async function evaluerReponse(){
  if(!S.casReponse.trim()){return}
  const cas=CAS[S.annee][S.casIdx%CAS[S.annee].length];
  S.casLoading=true;S.casAnalyse='';render();
  try{
    const headers={'Content-Type':'application/json'};
    if(S.apiKey){headers['x-api-key']=S.apiKey;headers['anthropic-version']='2023-06-01';}
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers,
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',max_tokens:600,
        messages:[{role:'user',content:`Tu es un formateur IFSI. Évalue la réponse d'un étudiant à ce cas clinique.

CAS : ${cas.titre}
QUESTION : ${cas.question}
ÉLÉMENTS ATTENDUS : ${cas.elements_reponse}
RÉPONSE ÉTUDIANT : ${S.casReponse}

En 3-4 phrases : ce qui est bien, ce qui manque, ce qui est à corriger. Tutoie l'étudiant. Sois constructif et précis. Pas de liste — du texte fluide.`}]
      })
    });
    const data=await res.json();
    if(data.error) throw new Error(data.error.message);
    S.casAnalyse=data.content?.find(b=>b.type==='text')?.text||'';
  }catch(e){S.casAnalyse='Erreur : '+e.message}
  S.casLoading=false;render();
}

render();
